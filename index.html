<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05081a">
<title>아라호 관제센터</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ─────────────────────────────────────────────────────────
   아라호 관제센터 — 디자인 토큰
   서체: 제목 Noto Serif KR 900 (고전적·우주 다큐 자막 느낌) / 본문 Noto Sans KR
   레이아웃: 16:9 전자칠판 기준 1600px 폭, 학습 슬라이드는 좌 글·우 사진 2단
   ───────────────────────────────────────────────────────── */
:root{
  --space0:#05081a; --space1:#0a0f2c; --panel:#10173a; --panel2:#182052; --line:#273270; --line2:#3b4a9a;
  --fg:#f3f5ff; --mut:#a3adda; --dim:#6d78b3;
  --sun:#ffb13b; --sun2:#ff7a1a; --cyan:#5fe3ff; --green:#3fe6a6; --red:#ff6b6b; --violet:#a497ff;
  --disp:'Noto Serif KR','Nanum Myeongjo',serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--space0);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75;
  background-image:
   radial-gradient(1400px 800px at 85% -10%,#1a2a6e55,transparent 60%),
   radial-gradient(1000px 700px at -10% 110%,#3b145f44,transparent 60%),
   radial-gradient(1.6px 1.6px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 12%,#fff6 50%,transparent 51%),
   radial-gradient(1.4px 1.4px at 86% 48%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 38% 78%,#fff6 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 8% 64%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#fff5 50%,transparent 51%),
   radial-gradient(1px 1px at 92% 82%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 28% 8%,#fff6 50%,transparent 51%);
  background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:.55em 0}
button{font-family:var(--body);font-size:1.05rem;border:0;border-radius:14px;cursor:pointer;min-height:52px;padding:10px 20px;color:var(--fg);-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;font-size:1.12rem;box-shadow:0 4px 18px #ff9c2a44}
.btn-s{background:var(--panel2);border:1.5px solid var(--line2)}
.btn-g{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
textarea,input[type=text],input[type=password],select{width:100%;background:#080c24;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.12rem;font-family:var(--body);line-height:1.8}
textarea{min-height:150px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
a{color:var(--cyan)}
.wrap{max-width:1600px;margin:0 auto;padding:18px 24px 112px}
.card{background:linear-gradient(180deg,var(--panel),#0c1233);border:1.5px solid var(--line);border-radius:22px;padding:24px 26px;margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:#080c24;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 14px;font-size:.9rem}
.small{font-size:.95rem;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.crew3{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:1100px){.crew3{grid-template-columns:1fr 1fr}.crew3>:first-child{grid-column:1/-1}}
@media (max-width:700px){.crew3{grid-template-columns:1fr}}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

/* HUD */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#0b1133cc;border:1.5px solid var(--line);border-radius:18px;padding:12px 20px;backdrop-filter:blur(8px)}
.hud .rk{font-family:var(--disp);font-size:1.2rem;color:var(--sun)}
.hud .pt{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.hud .sync{margin-left:auto;font-size:.88rem;color:var(--dim)}
.hud #hudOut{margin-left:4px}
.hud .sync.on{color:var(--green)}
.bar{height:10px;background:#080c24;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));border-radius:99px;transition:width .4s}

/* 하단 탭 */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#070b22ee;border-top:1.5px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:6px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav#tabs button{background:transparent;min-height:62px;min-width:44px;flex:0 1 140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.95rem;color:var(--mut);border-radius:14px;padding:6px 4px}
nav#tabs button .ic{font-size:1.5rem}
@media (max-width:560px){nav#tabs{gap:0}nav#tabs button{font-size:.72rem;padding:6px 1px}nav#tabs button .ic{font-size:1.25rem}}
nav#tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line2)}
body.deckmode nav#tabs,body.gate nav#tabs{display:none}

/* 로그인 게이트 */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--space0);
 background-image:radial-gradient(900px 600px at 70% 20%,#1a2a6e66,transparent 60%),url(img/solarsys.jpg);background-size:cover;background-position:center}
#gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05081acc,#05081af2)}
.gatebox{position:relative;width:min(560px,100%);background:#0b1133ee;border:1.5px solid var(--line2);border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px #000a}
.gatebox h1{font-size:2.1rem;margin-bottom:4px}
.gatebox .sub{color:var(--mut);margin:0 0 18px}
.gatebox label{display:block;font-size:.95rem;color:var(--mut);margin:10px 0 4px}
.idcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#182052,#0b1133);border:1.5px solid var(--line2);border-radius:18px;padding:14px 18px}
.idcard .av{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6,var(--sun));display:grid;place-items:center;font-size:1.7rem}
.idcard .nm{font-family:var(--disp);font-size:1.3rem}

/* 홈 */
.hero{position:relative;overflow:hidden;border-radius:26px;border:1.5px solid var(--line);min-height:360px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;
 background:#0a0f2c url(img/solarsys2.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05081af5 0%,#05081ad9 48%,#05081a55 100%)}
.hero>div{position:relative;padding:44px 40px}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.2;text-shadow:0 0 30px #ffb13b33}
.hero .lead{color:var(--mut);font-size:1.12rem;max-width:36em;margin-top:10px}
.hero .log{font-family:var(--disp);color:var(--cyan);font-size:1rem;letter-spacing:.1em;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.flow span{background:#080c24cc;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.98rem}
.flow b{color:var(--sun)}
@media (max-width:860px){.hero{grid-template-columns:1fr;min-height:0}.hero>div{padding:28px 22px}}

/* 장 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chap{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:22px;padding:0;cursor:pointer;text-align:left;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;background:#0a0f2c center/cover no-repeat;transition:transform .15s,border-color .15s}
.chap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05081a11 20%,#05081af0 75%)}
.chap>*{position:relative}
.chap .in{padding:18px 20px}
.chap:active{transform:scale(.98)}
.chap.doneAll{border-color:var(--green)}
.chap h3{font-size:1.4rem;margin:4px 0 2px}
.chap .k{font-family:var(--disp);color:var(--cyan);font-size:.92rem;letter-spacing:.12em}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:99px;background:#080c24;border:1px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.stamp{font-family:var(--disp);color:var(--green);border:2.5px solid var(--green);border-radius:10px;display:inline-block;padding:2px 14px;transform:rotate(-6deg);background:#06301d88}

/* ═════ 슬라이드 무대 ═════ */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--space0);
 background-image:radial-gradient(1200px 600px at 80% -10%,#1a2a6e55,transparent 60%),radial-gradient(1.4px 1.4px at 16% 26%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 16%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 88% 56%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 34% 82%,#fff5 50%,transparent 51%)}
.stg-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 8px}
.stg-top .ttl{font-family:var(--disp);font-size:1.1rem;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-top .num{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700;font-size:1.05rem}
.stg-top button{min-height:44px;padding:6px 14px}
.pbar{height:5px;background:#080c24}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));transition:width .35s}
.stg-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 28px 10px;display:flex}
.slide{margin:auto;width:100%;max-width:1560px}
.stg-nav{position:relative;display:flex;gap:12px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));align-items:center}
.stg-nav button{font-size:1.15rem;min-height:58px}
.stg-nav .prev{flex:0 0 160px}.stg-nav .next{flex:1;max-width:420px;margin-left:auto}
.stg-nav .hintkey{color:var(--dim);font-size:.85rem;flex:1;text-align:center}
@media (max-width:700px){.stg-nav{flex-wrap:wrap}.stg-nav .hintkey:not(.lockmsg){display:none}.stg-nav .lockmsg{flex:1 1 100%;order:-1;font-size:.9rem}.stg-nav .prev{flex:1}.stg-nav .next{max-width:none}.stg-body{padding:14px 16px 8px}}

/* 슬라이드 타이포 — 뷰포트 기준으로 크게 */
.s-kicker{font-family:var(--disp);color:var(--cyan);font-size:clamp(.95rem,1.2vw,1.15rem);letter-spacing:.14em;margin-bottom:6px}
.s-title{font-family:var(--disp);font-weight:900;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.25;margin:2px 0 16px}
.s-body{font-size:clamp(1.15rem,1.65vw,1.5rem);line-height:1.8}
.s-body b{color:var(--sun)} .s-body em{color:var(--cyan);font-style:normal;font-weight:700}
.s-body ul{padding-left:1.2em;margin:.4em 0} .s-body li{margin:.25em 0}
.s-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.s-grid.rev{grid-template-columns:.95fr 1.05fr}
@media (max-width:900px){.s-grid,.s-grid.rev{grid-template-columns:1fr;gap:16px}}
.key{background:#080c24;border:1.5px solid var(--line);border-left:6px solid var(--sun);border-radius:14px;padding:14px 20px;margin:16px 0;font-size:clamp(1.08rem,1.4vw,1.3rem)}
.key .kt{font-family:var(--disp);color:var(--sun);display:block;margin-bottom:2px;font-size:1.05em}
/* 빈칸 — 핵심어는 눌러야 보인다 */
.blank{cursor:pointer;border-radius:6px;transition:background .2s}
.blank:not(.on){color:transparent!important;background:linear-gradient(0deg,#ffb13b33,#ffb13b33);box-shadow:inset 0 -2px 0 var(--sun);padding:0 .15em;text-shadow:none}
.blank:not(.on)::selection{color:transparent}
.blank.on{background:#ffb13b1a}
@media (prefers-reduced-motion:no-preference){.blank:not(.on){animation:bl 2.2s ease-in-out infinite}@keyframes bl{0%,100%{box-shadow:inset 0 -2px 0 var(--sun)}50%{box-shadow:inset 0 -2px 0 var(--cyan)}}}
.lockmsg{color:var(--sun);font-size:.95rem;text-align:center;flex:1}
.fig{position:relative;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#000}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;background:linear-gradient(180deg,transparent,#000c);font-size:.95rem;color:#e8ecff}
.fig .cap b{color:var(--sun)}
.fig.tall{aspect-ratio:4/3}.fig.wide{aspect-ratio:16/9}.fig.sq{aspect-ratio:1}
.figs{display:grid;gap:12px}
.figs.c2{grid-template-columns:1fr 1fr}.figs.c3{grid-template-columns:1fr 1fr 1fr}.figs.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.figs.c3,.figs.c4{grid-template-columns:1fr 1fr}}
.figure{background:#080c24cc;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.figcap{color:var(--mut);font-size:.95rem;text-align:center;margin-top:8px}
svg text{font-family:var(--body)}

/* 행성 갤러리 */
.pgal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.pgal{grid-template-columns:1fr 1fr}}
.pcard{background:#080c24;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;min-height:0;display:block;transition:border-color .15s}
.pcard.on{border-color:var(--sun)}
.pcard .ph{aspect-ratio:1;background:#000 center/cover no-repeat}
.pcard .nm{font-family:var(--disp);font-size:clamp(1.1rem,1.5vw,1.4rem);padding:10px 14px 2px}
.pcard .ft{padding:0 14px 12px;font-size:clamp(.95rem,1.15vw,1.08rem);color:var(--mut);line-height:1.55}
.pcard .ft b{color:var(--sun)}

/* 히어로 */
.s-hero{text-align:center}
.s-hero .s-title{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.s-hero .s-sub{color:var(--mut);font-size:clamp(1.05rem,1.4vw,1.3rem);max-width:34em;margin:0 auto 10px}
.comms{display:inline-block;font-family:var(--disp);color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:4px 16px;font-size:.95rem;letter-spacing:.08em;margin-bottom:8px;background:#080c24aa}
.herogrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;text-align:left}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}

/* 퀴즈·피드백 */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--line2);margin:10px 0;font-size:clamp(1.1rem,1.5vw,1.35rem);padding:16px 20px;border-radius:16px}
.opt .n{font-family:var(--disp);color:var(--cyan);flex:0 0 auto}
.opt.ok{background:#0d3a2455;border-color:var(--green)}
.opt.no{background:#43182055;border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.opt.no{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.fb{border-radius:16px;padding:14px 18px;margin-top:14px;font-size:1.08rem}
.fb.ok{background:#0d3a2455;border:1.5px solid var(--green)}
.fb.no{background:#3a2a1055;border:1.5px solid var(--sun)}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{padding:4px 0}
.cklist .y::before{content:"✔ ";color:var(--green)} .cklist .n::before{content:"✦ ";color:var(--sun)}
@media (max-width:900px){.grwrap>.figure{order:-1}}
.sortgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sortgrid{grid-template-columns:repeat(2,1fr)}}
.sortcard{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:16px;background:var(--panel2);border:3px solid var(--line2);text-align:center}
.sortcard .ph{display:block;height:clamp(110px,15vh,170px);background-size:cover;background-position:center}
.sortcard .no{position:absolute;left:8px;top:6px;font-size:1.3rem;font-weight:900;color:#fff;text-shadow:0 1px 4px #000}
.sortcard .nm{font-weight:900;font-size:1.1rem;padding:6px 0 0}.sortcard .tg{font-size:.98rem;color:var(--mut);padding:2px 0 8px}
.sortcard.s{border-color:var(--sun)}.sortcard.s .tg{color:var(--sun);font-weight:700}
.sortcard.a{border-color:var(--violet)}.sortcard.a .tg{color:var(--violet);font-weight:700}
.sortcard.n{box-shadow:0 0 0 3px var(--red)}
table.sumtab td.ga,table.sumtab th.ga{background:#6b4208;color:#ffe2a8} table.sumtab td.gb,table.sumtab th.gb{background:#0d3a73;color:#d4ebff}
table.sumtab td:nth-child(2){font-weight:900;color:var(--sun)}
table.sumtab .tb{display:inline-block;min-width:5.5em;font-weight:700}
.tlink{display:block;margin:14px auto 0;background:none;border:0;color:var(--cyan);font-size:1rem;text-decoration:underline;text-underline-offset:4px;min-height:40px}
.guestbox{margin-top:10px;padding:14px 16px;border:1.5px solid var(--violet);border-radius:16px;background:#a497ff12}
.guestbox h3{margin:0 0 4px;color:var(--violet)}
.gcls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gcls button{min-height:44px;background:var(--panel2);border:1.5px solid var(--line2);border-radius:12px}
.gcls button:disabled{opacity:.35}
.gcls button.gon{grid-column:1/-1;border-color:var(--violet);color:var(--fg);font-weight:900;font-size:1.1rem;min-height:56px;background:#a497ff22}
.greet{position:fixed;left:50%;top:18px;z-index:80;transform:translate(-50%,-20px);opacity:0;transition:all .4s;display:flex;gap:14px;align-items:center;max-width:min(680px,92vw);background:#121a46f2;border:1.5px solid var(--violet);border-radius:18px;padding:14px 20px;box-shadow:0 18px 50px #000a;cursor:pointer;line-height:1.55}
.greet.on{transform:translate(-50%,0);opacity:1}.greet.out{opacity:0;transform:translate(-50%,-20px)}
.volmeta{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:#080c24;border:1.5px solid var(--line);border-radius:14px;padding:8px 16px;margin:0 0 12px}
.volmeta .vm{display:flex;align-items:center;gap:8px;font-size:1.02rem;line-height:1.35}
.volopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.volopts .opt{justify-content:center;font-weight:700}
.volcalc{display:grid;gap:8px;margin-top:12px}
.volcalc>div{background:#080c24;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(1rem,1.25vw,1.15rem);line-height:1.55}
.volcalc em{color:var(--sun);font-style:normal;font-weight:900}
.volcalc .vn{color:var(--sun);font-weight:900;margin-right:6px}
.volmini{display:flex;justify-content:center;gap:18px;margin-bottom:6px}
.volmini>div{width:90px;text-align:center}
.volcount{font-size:1.3rem;margin-top:6px}.volcount b{color:var(--sun);font-size:1.8rem}
.grsteps{margin:0;padding:0;list-style:none;counter-reset:g;display:grid;gap:7px}
.grsteps li{counter-increment:g;position:relative;padding:8px 12px 8px 46px;background:#080c24;border:1.5px solid var(--line);border-radius:12px;font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.5}
.grsteps li::before{content:counter(g);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#2a1500;font-weight:900;display:grid;place-items:center;font-size:.95rem}
.grsteps em{color:var(--sun);font-style:normal;font-weight:700}
.grpick{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}

.cmcol>h3{font-family:var(--disp);font-size:1.05rem;background:var(--panel2);border:1.5px solid var(--line2);border-radius:14px;padding:9px 14px;margin:0 0 10px;flex-shrink:0;color:var(--fg)}
.cmcol>h3 span{float:right;color:var(--cyan);font-family:var(--body)}
.cmcol .inner{overflow-y:auto;padding-right:4px;flex:1}
.cmcol .inner::-webkit-scrollbar{width:7px} .cmcol .inner::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.cmq{background:#0a0f2c;border:1.5px solid var(--line);border-left:5px solid var(--sun);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.cmq.done{border-left-color:var(--cyan)} .cmq.mine{box-shadow:inset 0 0 0 1.5px #ffb13b55}
.cmmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.82rem;color:var(--dim)}
.cmph{color:var(--mut);font-weight:700} .cmn{margin-left:auto;color:var(--sun);font-weight:700} .cmq.done .cmn{color:var(--cyan)}
.cmtx{margin:6px 0 4px;font-size:1.08rem;line-height:1.55;color:var(--fg);word-break:keep-all;overflow-wrap:anywhere}
.cma{border-top:1px dashed var(--line);padding:6px 0 2px;font-size:.95rem;line-height:1.5}
.cma b{color:var(--cyan);font-size:.9rem} .cma.t b{color:var(--sun)} .cma.t{background:#ffb13b12;border-radius:8px;padding:6px 8px}
.cmmore,.cmrep{min-height:34px;padding:2px 10px;font-size:.88rem;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;margin-top:6px}
.cmrep{color:var(--cyan);border-color:var(--line2)}
.cmbox textarea{min-height:70px;margin-top:6px}
@media (max-width:760px){.cmboard{display:block}.cmcol{max-width:none;max-height:none}.cmcol .inner{overflow:visible}}
.skybar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:-2px 0 12px;padding:6px 12px;background:#080c24;border:1.5px dashed var(--line2);border-radius:16px}
.skyh{font-family:var(--disp);color:var(--cyan);margin-right:4px}
.skybtn{display:inline-flex;align-items:center;min-height:36px;padding:2px 12px;border-radius:99px;background:var(--panel2);border:1.5px solid var(--line2);color:var(--fg);text-decoration:none;font-size:.98rem}
.skybtn:hover{border-color:var(--cyan);color:var(--cyan)} .skyn{margin-left:auto;color:var(--dim)}
.cmboard.two .cmcol{flex:1 1 0;max-width:none;min-width:320px}
.cmboard.two .inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 10px;align-content:start}
.cmboard.two .cmdiv{grid-column:1/-1}
.cmcol.q>h3{border-color:var(--sun);color:var(--sun)} .cmcol.k>h3{border-color:var(--green);color:var(--green)}
.cmcol.k .cmq{border-left-color:var(--green)} .cmcol.k .cmq .cmn{color:var(--green)}
.cmdiv{font-size:.88rem;font-weight:700;color:var(--mut);border-top:1px dashed var(--line2);padding-top:8px;margin:4px 0 8px}
.cmdiv b{color:var(--cyan)}
@media (max-width:760px){.cmboard.two .inner{display:block}}
</style>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   ① 서버 주소 — Apps Script 웹 앱 URL(…/exec)을 따옴표 안에 붙여넣기.
      비워 두면 기록이 이 기기에만 저장됩니다.
   ═══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbxNm28yoKc0w33ZKzgVZspQVUxzagBU1oewJEIJef4qILhxR93avtzHD3llbvumzJlaBA/exec';
const LOCAL_TEACHER_CODE = '0726';   // 서버가 없을 때만 쓰는 임시 센터장 코드
/* ② 학교 이름 — 화면 곳곳(관제센터 이름, 미션 패치)에 쓰인다. SCHOOL은 두 글자 정도가 패치에 예쁘게 들어간다. */
const SCHOOL = '고천';                 // 예: '고천' → '고천 관제센터'
const SCHOOL_FULL = '고천중학교';
const SCHOOL_EN = 'GOCHEON';            // 첫 화면 영문 표기 (예: 'GOCHEON')
/* ③ 참관(공개수업) — 참관 선생님이 둘러볼 수 있는 반. 쓰기·저장은 안 되고 보기만. 끄려면 [] */
const GUEST_CLS = ['1'];
const SCHOOL_STORY = '고천(古川), 오래된 냇물은 흘러 바다에 닿는다 — 그리고 별들의 바다, 우주로. ';  // 첫 화면 이야기(학교 이름 풀이). 비워 둬도 된다.

/* ───────── 서버 통신 (힘탐정과 같은 방식: 읽기 JSONP, 쓰기 POST) ───────── */
let seq=0;
function call(params){ return new Promise((done,fail)=>{
  if(me&&me.guest&&params.action!=="qlist") return fail(GUEST_MSG);
  if(!API) return fail('서버 미설정');
  const cb='cb_'+(++seq)+'_'+Date.now(); let s;
  const timer=setTimeout(()=>{clean();fail('시간 초과');},20000);
  function clean(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s);}
  window[cb]=res=>{clean(); if(res&&res.ok)done(res); else fail((res&&res.error)||'오류');};
  const q=['callback='+cb]; for(const k in params){ if(params[k]==null)continue; q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  s=document.createElement('script'); s.src=API+'?'+q.join('&'); s.onerror=()=>{clean();fail('연결 실패');}; document.head.appendChild(s);
});}
function post(params){ if(me&&me.guest) return Promise.reject(GUEST_MSG); if(!API) return Promise.reject('서버 미설정');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)})
   .then(r=>r.json()).then(res=>{ if(res&&res.ok)return res; throw (res&&res.error)||'오류'; }); }

/* ───────── 상태 ───────── */
const LS="araho_v2", LS_ME="araho_me";
const SESSION_VER=3; // 입장 방식이 바뀌면 올려서 저장된 세션을 무효화
let me=null; try{me=JSON.parse(localStorage.getItem(LS_ME)||'null'); if(me&&me.ver!==SESSION_VER)me=null;}catch(e){}
let S=freshState();
function freshState(){return {pts:0,seen:{},quiz:{},writes:{},wanted:{},exam:{},slide:{},done:{}};}
function loadLocal(){try{const j=localStorage.getItem(LS+'_'+(me?me.cls+'_'+me.num:'x')); if(j)S={...freshState(),...JSON.parse(j)};}catch(e){}}
let saveTimer=null, syncState='off';
function save(){
  if(isT()||isG()){drawHud();return;} // 센터장·참관 체험 기록은 저장하지 않음 — 다시 들어오면 처음부터
  try{localStorage.setItem(LS+'_'+(me?me.cls+'_'+me.num:'x'),JSON.stringify(S));}catch(e){}
  drawHud();
  if(API&&me){ clearTimeout(saveTimer); setSync('pending'); saveTimer=setTimeout(()=>{
    post({action:'save',...me,pts:S.pts,rank:rank().r,prog:CH.map(c=>{const p=chapProg(c);return p.d+'/'+p.total;}).join(' '),state:JSON.stringify(S)})
     .then(()=>setSync('on')).catch(()=>setSync('err')); },1500); }
}
function setSync(s){syncState=s;const el=document.querySelector('.hud .sync');if(el){el.className='sync '+(s==='on'?'on':'');el.textContent=s==='on'?'● 센터장 시트에 저장됨':s==='pending'?'○ 저장 중…':s==='err'?'! 저장 실패(다시 시도 중)':API?'○ 연결 대기':'기기에만 저장';}}
function logSrv(type,item,text,score,ai){ if(API&&me) post({action:'log',...me,type,item,text,score,ai}).catch(()=>{}); }
function addPts(n){if(isT()){save();return;}const b=S.pts;S.pts+=n;save();toast("+"+n+"점!");checkUnlock(b,S.pts);}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400);},1500);}
/* 등급: 우주 비행사 경력 순서 */
const RANKS=[[0,"지상 훈련생"],[40,"우주 비행 후보생"],[90,"우주 비행사"],[140,"미션 스페셜리스트"],[190,"커맨더"]];
function rank(){let r=RANKS[0][1],next=RANKS[1]||null;for(let i=0;i<RANKS.length;i++){if(S.pts>=RANKS[i][0]){r=RANKS[i][1];next=RANKS[i+1]||null;}}return{r,next};}
/* 장비: 점수를 모으면 우주복이 한 점씩 갖춰진다 */
const ITEMS=[
 {k:"gloves",at:15,n:"장갑·부츠",e:"🧤",d:"선외 활동용 두꺼운 장갑과 부츠. 색을 고를 수 있다."},
 {k:"suit",at:30,n:"우주복",e:"🧑‍🚀",d:SCHOOL+" 관제센터 지급품. 색은 네가 고른다."},
 {k:"helmet",at:50,n:"헬멧",e:"🪖",d:"이제 선외 활동(EVA) 자격이 생겼다. 바이저를 고를 수 있다."},
 {k:"pack",at:75,n:"생명유지 배낭",e:"🎒",d:"산소·물·냉각수. 8시간 버틸 수 있다."},
 {k:"jet",at:100,n:"제트팩",e:"🚀",d:"우주 공간에서 방향을 바꾸는 추진 장치."},
 {k:"patch",at:125,n:SCHOOL+" 미션 패치",e:"🏷️",d:SCHOOL_FULL+" 관제센터 공식 패치. 가슴에 단다."},
 {k:"robot",at:150,n:"반려 로봇 '아라'",e:"🤖",d:"아라호가 보내준 작은 친구. 계산이 빠르다."},
 {k:"visor",at:170,n:"황금 바이저",e:"✨",d:"태양빛을 막는 금 코팅. 베테랑의 상징."},
 {k:"cmd",at:190,n:"커맨더 견장",e:"👑",d:"임무 전체를 지휘하는 자의 표식."}];
const have=(k)=>{const it=ITEMS.find(i=>i.k===k);return it&&S.pts>=it.at;};
/* 센터장 보급 쿠폰 (마이쭈) */
/* 보급 쿠폰은 3개만 (2026-10 축소): 태양계 완주 · 논술 시험 제출 · 커맨더 승급 */
const CPNS=[
 {id:"m4",n:"태양계 완주 보급",c:"MISSION 01~04 모두 완수",t:()=>CH.filter(c=>c.id!=="c5").every(c=>{const p=chapProg(c);return p.d>=p.total;})},
 {id:"ex",n:"자격 시험 응시 보급",c:"논술 시험 3문항 모두 제출",t:()=>[1,2,3].every(n=>S.exam&&S.exam[n])},
 {id:"cmd",n:"커맨더 취임 선물",c:"커맨더 승급(190점)",t:()=>S.pts>=190}];
/* 없앤 쿠폰: 이미 신청된 건이 센터장 결재 목록에 이름으로 보이도록만 남겨 둠 */
const CPN_OLD={m1:"첫 임무 완수 보급 (폐지)",wd:"명추리 보급 (폐지)",cm:"통신병 보급 (폐지)"};
let COUP={};
function cpnState(c){const st=COUP[c.id]; if(st==="Y")return "y"; if(st==="W")return "w"; return c.t()?"ready":"lock";}
function cpnHTML(){
  if(isG())return `<h3>🍬 센터장 보급</h3><p class="small">학생은 미션 완주·논술 시험 제출·커맨더 승급 때 보급(간식) 쿠폰을 신청하고, 센터장이 결재해요. 참관 모드에서는 보기만 할 수 있어요.</p>`;
  const got=CPNS.filter(c=>COUP[c.id]==="Y").length;
  return `<h3>🍬 센터장 보급 <span class="small">받음 ${got}/${CPNS.length}</span></h3>
  <p class="small">조건을 채우면 <b>보급 신청</b> → 센터장 콘솔에 올라가고, 간식은 수업 시간에 받습니다. 쿠폰은 하나씩 한 번만!</p>
  ${API?CPNS.map(c=>{const st=cpnState(c);return `<div class="frame" style="display:flex;gap:10px;align-items:center;color:var(--fg);${st==='lock'?'opacity:.5':''}${st==='ready'?'border-color:var(--sun);border-style:solid':''}"><span style="font-size:1.4rem">🍬</span><div style="flex:1"><b>${c.n}</b><div class="small">${c.c}${st==='w'?' · 수업 시간에 센터장께 받으세요':''}</div></div>
   ${st==='y'?'<span class="pill g">지급 완료 ✓</span>':st==='w'?'<span class="pill w">센터장 결재 대기</span>':st==='ready'?`<button class="btn-p cpn" data-cid="${c.id}" style="min-height:42px;padding:6px 14px;font-size:.98rem">보급 신청</button>`:'<span class="pill">🔒</span>'}</div>`;}).join(""):'<p class="small">서버가 연결되면 열립니다.</p>'}`;
}
function cpnBind(root){root.querySelectorAll(".cpn").forEach(bt=>bt.onclick=async()=>{bt.disabled=true;bt.textContent="신청 중…";
  try{const r=await post({action:'couponClaim',...me,cid:bt.dataset.cid});COUP[bt.dataset.cid]=r.st||"W";toast(r.st==="Y"?"🍬 이미 받은 보급이에요":"📋 보급 신청서가 센터장 책상에 올라갔습니다!");render();}
  catch(e){bt.disabled=false;bt.textContent="보급 신청";toast("신청 실패: "+e);}});}
const SUITS={white:["#f2f4fa","#c3c9dc","흰색"],orange:["#ff9a3c","#c9641a","주황"],blue:["#6fb6ff","#2f6fc9","파랑"],mint:["#8df0d2","#3fae8e","민트"],black:["#3a4160","#1b2038","검정"]};
const GLOVES={white:["#eef0f6","#b9c0d6","흰색"],black:["#2a3050","#141830","검정"],orange:["#ff9a3c","#c9641a","주황"],red:["#ff6b6b","#b83a3a","빨강"]};
const VISORS={clear:["#bfe8ff","#e9f7ff",.28,"투명"],blue:["#4f8fe8","#bfe0ff",.55,"파랑 미러"],gold:["#ffd166","#fff3c4",.62,"황금(✨ 황금 바이저 필요)"]};
const HAIRS={dbrown:["#2b1d16","#4a3328","흑갈색"],black:["#16131a","#3a3540","검정"],brown:["#6b4226","#94603a","갈색"],blond:["#d9a441","#f3d27a","금발"]};
const LOOKS={m:"남자 승무원",f:"여자 승무원"};
function sty(){S.sty=S.sty||{};return {look:S.sty.look==="f"?"f":"m",hair:HAIRS[S.sty.hair]?S.sty.hair:"dbrown",suit:S.sty.suit||S.suit||"white",glove:S.sty.glove||"white",visor:(S.sty.visor==="gold"&&!have("visor"))?"clear":(S.sty.visor||"clear")};}
function astronautSVG(pts,suit,size,o){
  const p=pts==null?S.pts:pts; const H=(k)=>{const it=ITEMS.find(i=>i.k===k);return it&&p>=it.at;};
  const st=Object.assign(sty(),o||{}); const [h1,h2]=HAIRS[st.hair]||HAIRS.dbrown; const F=st.look==="f"; const [c1,c2]=SUITS[suit||st.suit]||SUITS.white; const [g1,g2]=GLOVES[st.glove]||GLOVES.white; const [v1,v2,vo]=VISORS[st.visor]||VISORS.clear;
  const sz=size||200, uid="a"+Math.floor(Math.random()*1e6);
  const suitOn=H("suit"), body=suitOn?c1:"#6b7390", bodyD=suitOn?c2:"#454c6b";
  return `<svg viewBox="0 0 240 320" width="${sz}" height="${sz*1.33}" style="display:block;max-width:100%;height:auto">
  <defs>
   <linearGradient id="${uid}s" x1="0" x2="1"><stop offset="0" stop-color="${body}"/><stop offset=".6" stop-color="${body}"/><stop offset="1" stop-color="${bodyD}"/></linearGradient>
   <radialGradient id="${uid}f" cx=".4" cy=".35"><stop offset="0" stop-color="#ffe3c9"/><stop offset="1" stop-color="#e2b48f"/></radialGradient>
   <radialGradient id="${uid}v" cx=".35" cy=".3"><stop offset="0" stop-color="${v2}" stop-opacity=".9"/><stop offset=".5" stop-color="${v1}" stop-opacity="${vo}"/><stop offset="1" stop-color="#0a0f2c" stop-opacity=".55"/></radialGradient>
   <linearGradient id="${uid}m" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#c9d0e3"/><stop offset="1" stop-color="#7e879f"/></linearGradient>
  </defs>
  ${H("jet")?`<g><rect x="54" y="150" width="26" height="78" rx="9" fill="url(#${uid}m)"/><rect x="160" y="150" width="26" height="78" rx="9" fill="url(#${uid}m)"/><rect x="58" y="226" width="18" height="8" rx="3" fill="#3b4160"/><rect x="164" y="226" width="18" height="8" rx="3" fill="#3b4160"/>
    <path d="M60 234 q7 30 14 0z" fill="#ffb13b" opacity=".9"><animate attributeName="d" values="M60 234 q7 26 14 0z;M60 234 q7 44 14 0z;M60 234 q7 26 14 0z" dur="0.5s" repeatCount="indefinite"/></path><path d="M166 234 q7 30 14 0z" fill="#ffb13b" opacity=".9"><animate attributeName="d" values="M166 234 q7 40 14 0z;M166 234 q7 24 14 0z;M166 234 q7 40 14 0z" dur="0.45s" repeatCount="indefinite"/></path>
    <path d="M63 234 q4 18 8 0z" fill="#fff6d6"/><path d="M169 234 q4 18 8 0z" fill="#fff6d6"/></g>`:""}
  ${H("pack")?`<rect x="56" y="112" width="128" height="124" rx="20" fill="url(#${uid}m)" stroke="#5c6480" stroke-width="2.5"/><rect x="62" y="150" width="14" height="60" rx="5" fill="#3fe6a6" opacity=".85"/><rect x="164" y="150" width="14" height="60" rx="5" fill="#5fe3ff" opacity=".85"/><rect x="60" y="226" width="120" height="8" rx="3" fill="#5c6480"/>`:""}
  <!-- 다리 -->

function maskName(n){n=String(n||"").trim();const c=[...n];if(c.length<=1||n.includes("○"))return n;if(c.length===2)return c[0]+"○";return c[0]+"○".repeat(c.length-2)+c[c.length-1];}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

const LINKS=/(때문|따라서|그러므로|왜냐하면|그래서|이므로|으므로)/;
const COMPARE=/(반면|비해|보다|많고|적고|크고|작고|높고|낮고|달리)/;
function checkWrite(text,spec){
  const t=(text||"").trim(); const msgs=[]; let got=0,need=0;
  need++; if(t.length>=spec.min){got++;msgs.push({y:1,m:`길이 충분 (${t.length}자)`});}else msgs.push({y:0,m:`조금 더 길게! 최소 ${spec.min}자 (지금 ${t.length}자)`});
  (spec.groups||[]).forEach(g=>{need++;const hit=g.words.some(w=>t.includes(w));
    if(hit){got++;msgs.push({y:1,m:`핵심어 포함: ${g.name}`});}else msgs.push({y:0,m:`이 내용이 보이지 않아요 → ${g.name}`});});
  if(spec.compare){need++;if(COMPARE.test(t)){got++;msgs.push({y:1,m:"비교 표현 사용 (…보다, 반면 등)"});}else msgs.push({y:0,m:"두 대상을 '…보다/반면'처럼 직접 비교해 보세요"});}
  if(spec.link!==false){need++;if(LINKS.test(t)){got++;msgs.push({y:1,m:"이유·결론 연결어 사용 (때문에, 따라서 등)"});}else msgs.push({y:0,m:"'왜냐하면 ~ 때문이다', '따라서 ~'로 근거와 주장을 이어 보세요"});}
  return {pass:got>=need, got, need, msgs};
}

function sceneOrbit(){

  let belt="";for(let i=0;i<34;i++){const a=i/34*360+(i*7)%13;const r=40.5+((i*13)%7)/3;
    belt+=`<i class="beltdot" style="left:${(50+r*Math.cos(a*Math.PI/180)).toFixed(1)}%;top:${(50+r*Math.sin(a*Math.PI/180)).toFixed(1)}%"></i>`;}

    ${planets.map(p=>`<div class="spin" style="animation-duration:${p[4]}s;transform:rotate(${p[5]}deg)"><div class="planet" data-nm="${p[0]}" style="left:0;top:0;width:${p[2]}px;height:${p[2]}px;background:radial-gradient(circle at 35% 35%,#fff6,${p[3]})">

}
function bindOrbit(root){

function granules(cx,cy,R){ /* 쌀알무늬 확대: 밝은 알갱이 + 어두운 틈 (고정 배치) */
 let g="",seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
 for(let row=-5;row<=5;row++)for(let col=-5;col<=5;col++){const x=cx+col*15+(row%2?7.5:0)+(rnd()-.5)*5,y=cy+row*13+(rnd()-.5)*4;
  if(Math.hypot(x-cx,y-cy)>R+8)continue;const rx=6+rnd()*2.4,ry=5+rnd()*2,a=(rnd()*60-30).toFixed(0);
  g+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})" fill="url(#gran)"/>`;}
 return g;}

  function upd(){const v=+r.value,n=Math.round(1+v/11);

 {t:"write",key:"w_c2",h:"관제 일지 · 한 줄 논술",img:"uranus",prompt:`아라호가 관측한 <b>천체 P</b> — 반지름(지구=1) 4.0, 위성 27개, 고리 있음, 표면 상태: 기체.<br>P를 지구형/목성형으로 <b>분류</b>하고, 자료에서 <b>근거 두 가지 이상</b>을 들어 까닭을 쓰세요.`,frame:"P는 <b>___형 행성</b>이다. 왜냐하면 지구형 행성보다 ___이/가 ___고, ___이/가 ___기 때문이다.",spec:{min:40,groups:[{name:"'목성형'이라는 분류",words:["목성형"]},{name:"크기 또는 표면 근거",words:["반지름","지름","크기","크고","크다","기체","표면"]},{name:"위성 또는 고리 근거",words:["위성","고리"]}],compare:true},ai:"자료: 천체 P 반지름(지구=1) 4.0, 위성 27개, 고리 있음, 표면 상태 기체. 평가 요소: ① P를 목성형 행성으로 분류 ② 자료의 특징 두 가지 이상(반지름 큼, 위성 많음, 고리 있음, 표면이 기체)을 지구형과 비교(…보다)하여 근거로 제시 ③ 분류와 근거를 ‘때문이다’로 연결. 수준: 상=①②③ / 중=분류는 맞으나 근거 1개이거나 비교 표현 없음 / 하=분류 틀림. 밀도는 교과서 범위가 아니므로 요구하지 말 것(학생이 맞게 쓰면 감점하지 않음)."},

 {t:"hero",log:"통신 로그 · D+40 · 태양 카메라 가동",h:"태양의 얼굴",sub:"아라호가 태양 전용 필터를 열었다. 표면과 대기에서 벌어지는 거대한 쇼 — 하나도 놓치지 말고 기록하라. — 센터장",scene:"sun",img:"sun_full"},
 {t:"learn",h:"표면: 광구와 흑점",figs:[["sun2014","<b>광구</b> 위의 <b>흑점</b> (2014년, 활발한 시기)"],["sunspot_earth","흑점 하나에 <b>지구</b>가 쏙 들어간다"]],b:`<ul><li><b>광구</b> — 밝게 보이는 태양의 둥근 표면. 온도 약 <em>6000℃</em>. 광구에서는 흑점과 쌀알 무늬가 관측된다.</li><li><b>흑점</b> — 광구에 나타나는 어두운 무늬. 주변보다 온도가 <em>약 2000℃ 낮아</em>(약 4000℃) 어둡게 보인다. 모양과 크기가 변하며, 어떤 흑점은 행성보다 크기도 하다.</li></ul><div class="key"><span class="kt">오개념 교정</span>흑점도 빛을 내요! 다만 주위가 더 밝아서 <b>상대적으로</b> 어두워 보일 뿐.</div>`},
 {t:"learn",h:"쌀알 무늬, 그리고 자전",figs:[["granule","<b>쌀알 무늬</b> — 하나 크기가 약 1000 km"],["sunspot_close","흑점 주변의 쌀알 무늬 (고해상도)"]],b:`<ul><li><b>쌀알 무늬</b> — 쌀알을 뿌려 놓은 것 같은 무늬. 광구 아래에서 일어나는 <em>대류</em>로 생긴다. 내부에서 고온의 물질이 올라오는 곳은 밝고, 표면에서 냉각된 물질이 내려가는 곳은 어둡다.</li><li>망원경으로 태양 표면을 관측하면 흑점의 위치가 달라진다(동→서). 이로부터 태양이 <em>자전</em>함을 알 수 있다!</li></ul>`},
 {t:"learn",h:"대기: 채층과 코로나",figs:[["chromo","<b>채층</b> — 광구 바로 위 붉은 테"],["corona","<b>코로나</b> — 개기 일식 때 드러나는 진주빛 대기"]],b:`<p>태양의 대기는 평소엔 광구가 너무 밝아 안 보이고, <em>개기 일식</em> 때 볼 수 있어요.</p><ul><li><b>채층</b> — 광구 바로 위에 있는 붉은색의 대기층</li><li><b>코로나</b> — 채층 위로 넓게 뻗어 있는 대기층. 개기 일식 때 진주색으로 보이는 희박한 가스층으로, 온도가 <em>100만 ℃ 이상!</em> 태양 활동이 활발할수록 코로나의 크기가 커진다.</li></ul>`},
 {t:"learn",h:"대기의 폭발 쇼: 홍염과 플레어",figs:[["prominence","<b>홍염</b> — 지구 크기(점)와 비교해 보라"],["flare","<b>플레어</b> — 흑점 근처의 대폭발"]],b:`<ul><li><b>홍염</b> — 채층 위로 거대하게 분출되는 가스. 고온의 물질이 채층을 뚫고 수십만 km의 코로나까지 솟아오르는 <em>불꽃 기둥</em>. 고리 모양의 홍염은 수일~수개월 유지되기도 한다.</li><li><b>플레어</b> — 채층에서 일어나는 <em>폭발</em> 현상. 흑점 부근에서 폭발이 일어나 채층의 일부가 수 분~수 시간 안에 급격히 밝아지면서 빛을 낸다.</li></ul>`},

 {t:"learn",h:"흑점 수는 11년마다 춤춘다",figs:[["sun2014","<b>2014년</b> — 흑점 많음 = 활발"],["sun2020","<b>2020년</b> — 흑점 거의 없음 = 조용"]],b:`<p>흑점 수는 약 <b>11년</b>을 주기로 늘었다 줄었다 해요. 태양 활동이 활발할수록 흑점이 많이 관측되고, 적을 때는 '조용'해요.</p><p class="small">주기 — 어떤 현상이 다시 반복되는 데 걸리는 시간</p>${IMG('cycle','1700년대부터 기록된 <b>흑점 수의 주기적 변화</b>','wide')}`},
 {t:"learn",h:"'활발하다'의 신호 세트",img:"sun_uv",cap:"자외선으로 본 활발한 태양 — 밝게 빛나는 곳이 <b>활동 영역</b>",b:`<div class="key"><span class="kt">태양 활동이 활발할 때 (세트로 외우기!)</span>① <b>흑점 수 증가</b> ② <b>홍염·플레어 잦아짐</b> ③ <b>코로나 커짐</b> ④ <b>태양풍 강해짐</b></div><p>논술형은 "어느 시기가 활발한가? <em>근거는?</em>"을 꼭 물어요. 근거는 <b>흑점 수</b>와 <b>홍염·플레어</b> 자료에서 찾으세요!</p>`},

 {t:"write",key:"w_c3",h:"관제 일지 · 한 줄 논술",img:"flare2",prompt:`관측 기록 — <b>(가) 시기</b>: 흑점 수 적음, 플레어 드묾 / <b>(나) 시기</b>: 흑점 수 많음, 플레어 자주 발생.<br>태양 활동이 더 활발한 시기를 <b>판단</b>하고, 자료에서 <b>근거 두 가지</b>를 들어 쓰세요.`,frame:"태양 활동은 <b>___ 시기</b>에 더 활발하다. 왜냐하면 (가) 시기보다 ___이/가 ___고, ___이/가 ___기 때문이다.",spec:{min:35,groups:[{name:"'(나) 시기' 판단",words:["나"]},{name:"흑점 근거",words:["흑점"]},{name:"플레어(홍염) 근거",words:["플레어","홍염"]}]},ai:"자료: (가) 흑점 적음·플레어 드묾 / (나) 흑점 많음·플레어 자주. 평가 요소: ① (나) 시기가 더 활발하다고 판단 ② 근거로 흑점 수 증가 ③ 근거로 홍염·플레어 잦음 ④ (가)와 비교하는 표현. 수준: 상=①②③④ / 중=판단 맞고 근거 하나 / 하=판단만 또는 틀림. 중1 범위: 흑점 수↑, 홍염·플레어↑ = 태양 활동 활발."},

 {t:"hero",log:"통신 로그 · D+58 · 우주기상 경보 발령",h:"태양이 보낸 신호",sub:"플레어 폭발 확인. 1억 5천만 km 떨어진 지구가 어떻게 흔들리는지 밝혀라 — 아라호의 통신이 끊기기 전에. — 센터장",scene:"sim"},
 {t:"learn",h:"태양풍 — 태양이 부는 바람",img:"flare2",cap:"플레어와 함께 뿜어져 나오는 <b>전기를 띤 입자</b>들",b:`<p>태양은 빛만 보내는 게 아니에요. <b>전기를 띤 입자</b>들을 사방으로 내뿜는데, 이것이 <em>태양풍</em>!</p><div class="key"><span class="kt">핵심 연결</span>태양 활동이 활발해지면 → 태양풍도 <b>강해진다</b></div>`},
 {t:"learn",h:"지구의 방패, 그리고 오로라",img:"aurora",cap:"우주정거장에서 본 <b>오로라</b> — 태양풍 입자가 대기와 부딪혀 빛난다",b:`<p>지구의 <b>자기장</b>이 태양풍을 막아 주는 방패 역할을 해요.</p><p>일부 입자가 극지방 하늘로 들어와 공기와 부딪히면 — <b>오로라</b>가 빛나요!</p><div class="key"><span class="kt">활발할 때의 오로라</span><b>더 자주</b>, 그리고 평소보다 <b>낮은 위도</b>에서도 나타나요.</div>`},
 {t:"learn",h:"활발해지면 생기는 문제들",img:"earth_effects",cap:"교과서 그림 — 통신·GPS·인공위성·송전망이 흔들린다",b:`<p>강해진 태양풍 때문에 <b>자기 폭풍</b>이 일어나면 —</p><p class="small">자기 폭풍 — 태양풍에 의해 지구 자기장이 일시적으로 불규칙하게 변하는 현상</p><ul><li>📡 <b>무선 통신 장애</b>(델린저 현상) — 전파를 이용한 통신에 장애</li><li>🛰️ <b>인공위성 성능 저하</b> — 센서가 고장 나 성능이 떨어진다(GPS 수신 오류)</li><li>✈️ <b>항공 분야 피해</b> — 비행기가 북극 부근을 운항하지 못하기도 한다</li><li>💡 <b>전력 장비 손상</b> — 지상의 전력 장비가 손상되어 정전 사고</li><li>🌌 <b>강해지는 오로라</b> — 더 넓은 지역에서 강하게 나타난다</li></ul>`},
 {t:"race",h:"관제센터 비상 대응 훈련"},
 {t:"learn",h:"인과 사슬 — 6점짜리 글의 뼈대",wide:true,b:`<p>최고 배점 문항은 이 사슬을 <em>글로 잇는</em> 거예요.</p><div class="chain"><span class="nd"><b>①</b>태양 활동 활발</span><span class="ar">→</span><span class="nd"><b>②</b>흑점↑ 홍염·플레어↑</span><span class="ar">→</span><span class="nd"><b>③</b>태양풍 강해짐</span><span class="ar">→</span><span class="nd"><b>④</b>지구 자기장 교란</span><span class="ar">→</span><span class="nd"><b>⑤</b>오로라·통신 장애·GPS 오류·정전</span></div><div class="key"><span class="kt">서술 공식</span>"태양 활동이 활발해지면 <b>태양풍이 강해지고</b>, 강해진 태양풍이 지구 자기장을 교란하여 ○○ 현상이 나타날 수 있다. <b>따라서</b> ~한 대비가 필요하다."</div><div class="figs c3">${IMG('sun2014','① 흑점 많음','sq')}${IMG('flare','② 플레어','sq')}${IMG('aurora','⑤ 오로라','sq')}</div>`},
 {t:"learn",h:"우주 기상 예보",img:"earth_effects2",cap:"<b>우주 기상</b> — 태양 활동을 예보해 위성·통신·전력을 지킨다",b:`<p>날씨 예보처럼 <b>우주 기상 예보</b>도 있어요. <b>국가기상위성센터</b>에서는 태양 활동을 관측하여 우주 기상을 예보함으로써 피해를 예방하거나 줄이려 노력하고 있어요.</p><div class="key"><span class="kt">그래서 관제센터는</span>태양 활동이 활발할 땐 중요한 자료 전송을 미루고, 위성을 안전 모드로 돌리고, 전력망을 점검해요. 논술 3번의 '결정이 타당한 까닭'이 바로 이것!</div>`},

 if(sl.t==="learn"||sl.t==="hero"||sl.t==="clear"||sl.t==="graph"||sl.t==="vol"||sl.t==="sunsort"||sl.t==="scope"||sl.t==="race")return !!S.seen[k];
 if(sl.t==="quiz"||sl.t==="game2"||sl.t==="meet")return !!S.quiz[k];
 if(sl.t==="write")return !!(S.writes[sl.key]&&S.writes[sl.key].ok); return false;}

 ({home:renderHome,crew:renderCrew,learn:renderLearn,wanted:renderWanted,exam:renderExam,comms:renderComms,docs:renderDocs,teacher:renderTeacher})[view]();
 showAI();

   <button class="btn-p" id="cmNew" ${CM.other||isG()?'hidden':''} style="min-height:44px;margin-left:auto;font-size:1rem">${CM.compose?'✕ 닫기':'✏️ 새 교신 보내기'}</button></div>
  <div id="cmCompose" ${CM.compose?'':'hidden'}>${commsComposeHTML(CM.mission||CH[0].no,"출발 전",{pick:true})}
   ${API?"":'<div class="fb no">서버 미연결: 교신이 이 기기에만 저장됩니다. 센터장이 시트를 연결하면 학급 전체가 함께 봅니다.</div>'}</div>
  <div id="cmStat"></div><div id="cmList"><p class="small">불러오는 중…</p></div>`;
  drawHud();
  bindCompose(app.querySelector("#cmCompose"),CM.mission||CH[0].no,"출발 전",()=>{CM.compose=false;setTimeout(()=>{toast("📡 교신 발신 완료!");render();},400);});
  app.querySelector("#cmMission").onchange=e=>{CM.mission=e.target.value;render();};
  const cc=app.querySelector("#cmCls"); if(cc)cc.onchange=e=>{CM.cls=e.target.value;render();};
  const co=app.querySelector("#cmOther"); if(co)co.onclick=()=>{CM.other=!CM.other;CM.mine=false;CM.noans=false;CM.compose=false;render();};
  app.querySelector("#cmMine").onclick=()=>{CM.mine=!CM.mine;render();}; app.querySelector("#cmNoans").onclick=()=>{CM.noans=!CM.noans;render();};
  app.querySelector("#cmReload").onclick=loadComms;
  app.querySelector("#cmNew").onclick=()=>{CM.compose=!CM.compose;render();};
  loadComms();
}
const CM_PH={"출발 전":["❓","출발 전 질문"],"귀환 후":["❓","귀환 후 질문"],"귀환 보고":["💡","알게 된 점"]};
function cmCard(r){
  const ans=r.answers||[], open=CM.open&&CM.open[r.id], shown=open?ans:ans.slice(-2), ph=CM_PH[r.phase]||["❓",r.phase];
  const who=r.ro?`${esc(r.cls)}반 승무원`:r.name==="익명 승무원"?"익명":`${esc(r.cls)}반 ${esc(r.name)}`;
  return `<div class="cmq ${ans.length?'done':'wait'} ${r.mine?'mine':''}" data-q="${esc(r.id)}" data-k="${r.phase==="귀환 보고"?1:""}">
   <div class="cmmeta">${(!CM.mission&&r.phase!=="귀환 보고")?`<span class="cmph">${r.phase==="출발 전"?"출발 전":"귀환 후"}</span>`:''}<span>${who}</span><span>${esc((r.t||'').slice(5,16).replace('T',' '))}</span>${r.mine?'<span class="pill w" style="margin:0">내 교신</span>':''}<span class="cmn">${r.phase==="귀환 보고"?(ans.length?`댓글 ${ans.length}`:''):(ans.length?`응답 ${ans.length}`:'응답 기다림')}</span></div>
   <p class="cmtx">${esc(r.text)}</p>
   ${ans.length>shown.length?`<button class="cmmore" data-more="${esc(r.id)}">이전 응답 ${ans.length-shown.length}개 더 보기</button>`:''}
   ${shown.map(a=>`<div class="cma ${a.teacher?'t':''}"><b>${a.teacher?'🎖️ 센터장':'💬 '+(r.ro?(a.cls?esc(a.cls)+'반 ':'')+'승무원':esc(a.name))}</b> <span class="small">${esc((a.t||'').slice(5,16).replace('T',' '))}</span><div>${esc(a.text)}</div></div>`).join("")}
   ${r.ro?'':`<button class="cmrep" data-rep="${esc(r.id)}" data-lab="${r.phase==="귀환 보고"?"👍 댓글 달기":"응답하기"}">${r.phase==="귀환 보고"?"👍 댓글 달기":"응답하기"}</button>
   <div class="cmbox" hidden><textarea class="ansIn" placeholder="아는 만큼, 근거와 함께"></textarea><button class="btn-s ansBtn" style="min-height:44px;width:100%;margin-top:6px">${ansBtnLabel()}</button><div class="ansFb"></div></div>`}</div>`;
}
async function loadComms(){
  const L=document.getElementById("cmList"), ST=document.getElementById("cmStat"); if(!L)return;
  const RO=(!isT()&&CM.other)||isG(); /* 다른 반 구경·참관: 이름 가림 · 읽기 전용 */
  try{let every=(await commsList({cls:(isT()||(RO&&!isG()))?"":(me?me.cls:""),mission:CM.mission})).filter(r=>r.phase!=="분류회의");
    if(isG())every=every.filter(r=>String(r.cls)===String(me.cls)).map(r=>({...r,mine:false,ro:true}));
    else if(RO)every=every.filter(r=>me&&String(r.cls)!==String(me.cls)).map(r=>({...r,mine:false,ro:true}));
    const cc=document.getElementById("cmCls"); if(cc){const cls=[...new Set(every.map(r=>String(r.cls)).filter(x=>x&&x!=="T"))].sort((a,b)=>(+a||0)-(+b||0)||a.localeCompare(b));
      cc.innerHTML=`<option value="">모든 반</option>`+cls.map(x=>`<option value="${esc(x)}" ${CM.cls===x?'selected':''}>${esc(x)}반</option>`).join("");}
    const all=isT()&&CM.cls?every.filter(r=>String(r.cls)===CM.cls):every; let rows=all;
    if(CM.mine)rows=rows.filter(r=>r.mine); if(CM.noans)rows=rows.filter(r=>r.phase!=="귀환 보고"&&!(r.answers||[]).length);
    const qN=all.filter(r=>r.phase!=="귀환 보고").length, wait=all.filter(r=>r.phase!=="귀환 보고"&&!(r.answers||[]).length).length, mineN=all.filter(r=>r.mine).length;
    if(ST)ST.innerHTML=RO?(all.length?`<div class="cmstat"><span>🔭 다른 반 ❓ 질문 <b>${qN}</b></span><span>💡 알게 된 점 <b>${all.length-qN}</b></span><span style="color:var(--mut)">응답은 우리 반 교신에만 달 수 있어요</span></div>`:""):all.length?`<div class="cmstat"><span>❓ 질문 <b>${qN}</b> <span style="border:0;padding:0;background:none">(응답 받음 ${qN-wait})</span></span><span>💡 알게 된 점 <b>${all.length-qN}</b></span><button id="cmWaitBtn" class="${CM.noans?'on':''}">🔍 응답 기다리는 질문 <b>${wait}</b> ${CM.noans?'· 전체 보기':'· 보러 가기'}</button><span>🧑‍🚀 내 교신 <b>${mineN}</b></span></div>`:"";
    const wb=document.getElementById("cmWaitBtn"); if(wb)wb.onclick=()=>{CM.noans=!CM.noans;render();};
    if(!rows.length){const f=[CM.mission&&CM.mission,CM.mine&&"내 교신만",CM.noans&&"응답 없는 질문"].filter(Boolean);
      L.innerHTML=f.length?`<div class="card"><p class="small">조건(<b>${esc(f.join(" · "))}</b>)에 맞는 교신이 없어요.</p><button class="btn-s" id="cmClear" style="min-height:44px">조건 모두 풀고 전체 보기</button></div>`:(RO?'<div class="card"><p class="small">아직 다른 반 교신이 없어요.</p></div>':'<div class="card"><p class="small">아직 교신이 없어요. 첫 교신을 보내 보세요!</p></div>');
      const cb=L.querySelector("#cmClear"); if(cb)cb.onclick=()=>{CM.mission="";CM.mine=false;CM.noans=false;CM.cls="";render();}; return;}
    /* 칸 나누기: 모든 미션 → 미션별 칸 / 미션 하나 → 단계별 칸 (힘탐정사무소 차시별 칸과 같은 방식) */
    /* 칸은 언제나 두 개: ❓ 질문 | 💡 알게 된 점. 칸 안에서 미션별(미션 하나면 출발 전/귀환 후)로 구분선 */
    const isQ=r=>r.phase!=="귀환 보고";
    const groups=(items,q)=>CM.mission
      ? (q?[["출발 전","출발 전 질문"],["귀환 후","귀환 후 질문"]].map(([ph,h])=>({h,items:items.filter(r=>r.phase===ph)})):[{h:"",items}])
      : CH.map(c=>({h:`${c.no} · ${c.title}`,items:items.filter(r=>r.mission===c.no)}));
    const col=(cls,h,items,q)=>`<div class="cmcol ${cls}"><h3>${h}<span>${items.length}</span></h3><div class="inner">${items.length?groups(items,q).filter(g=>g.items.length).map(g=>(g.h?`<div class="cmdiv">${esc(g.h)} <b>${g.items.length}</b></div>`:"")+g.items.map(cmCard).join("")).join(""):`<p class="small" style="grid-column:1/-1;margin:6px 4px">${q?"아직 질문 교신이 없어요.":"아직 알게 된 점 교신이 없어요. 귀환 교신에서 💡 칸에 써 보세요!"}</p>`}</div></div>`;
    L.innerHTML=`<div class="cmboard two">${col("q","❓ 질문",rows.filter(isQ),true)}${col("k","💡 알게 된 점",rows.filter(r=>!isQ(r)),false)}</div>`;
    L.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{CM.open=CM.open||{};CM.open[b.dataset.more]=1;loadComms();});
    L.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{const bx=b.nextElementSibling;bx.hidden=!bx.hidden;b.textContent=bx.hidden?b.dataset.lab:"취소";if(!bx.hidden)bx.querySelector("textarea").focus();});
    L.querySelectorAll(".ansBtn").forEach(b=>b.onclick=()=>sendAnswer(b,false));
  }catch(e){L.innerHTML=`<div class="fb no">교신 채널 연결 실패: ${esc(e)}</div>`;}
}


/* 응답 보내기 — AI가 먼저 읽고 '하'면 고쳐 쓰게 한다. AI가 꺼져 있거나 연결이 안 되면 예전처럼 바로 보낸다 */
async function sendAnswer(b,force){
  const card=b.closest("[data-q]"),inp=card.querySelector(".ansIn"),out=card.querySelector(".ansFb"),t=inp.value.trim();
  if(t.length<2)return toast("응답을 적어 주세요");
  const left=ansLeft(), scoring=!isT()&&!isG()&&left>0;
  let lvl=null;
  b.disabled=true;
  if(scoring&&AI_ON&&API&&!force){
    const lab=b.textContent; b.textContent="🤖 AI가 응답을 읽는 중… (5~10초)"; if(out)out.innerHTML="";
    try{const q=(card.querySelector(".cmtx")||{}).textContent||"";
      const res=await post({action:'feedback',...me,item:'교신응답',rubric:ansRubric(q,card.dataset.k==="1"),text:t,score:''});
      const fb=res&&res.fb; lvl=fb&&fb.level||null;
      if(lvl==="하"){
        b.textContent=lab; b.disabled=false;
        out.innerHTML=`<div class="fb no" style="margin-top:8px"><b>🤖 조금만 고쳐 볼까요?</b><ul class="cklist">${(fb.improve||[]).map(g=>`<li class="n">${esc(g)}</li>`).join("")}</ul><div class="small">고쳐서 다시 보내면 +${ANS_PTS}점을 받을 수 있어요.</div><button class="cmmore ansForce" style="margin-top:6px">AI 판단이 틀린 것 같아요 — 점수 없이 그대로 보내기</button></div>`;
        out.querySelector(".ansForce").onclick=()=>sendAnswer(b,true); inp.focus(); return;}
    }catch(e){lvl=null;}
  }
  try{
    await commsAnswer(card.dataset.q,t);
    if(scoring&&!force){S.comms.ans=(S.comms.ans||0)+1; addPts(ANS_PTS); if(lvl==="상")setTimeout(()=>toast("🤖 근거까지 든 멋진 응답!"),700);}
    else save();
    CM.open=CM.open||{};CM.open[card.dataset.q]=1; loadComms();
  }catch(e){toast("응답 실패: "+e);b.disabled=false;b.textContent=ansBtnLabel();}
}

const DOCS=[
 {f:"m1_solar_system_members",no:"MISSION 01",t:"내 손안의 우주 도감: 태양계의 구성원",d:"태양·행성·위성·소행성·혜성·왜소 행성을 한 권으로 정리",pg:15},
 {f:"m2_planet_classification",no:"MISSION 02",t:"우주 탐사선 데이터 로그: 8개의 행성을 분류하라",d:"행성별 특징과 지구형·목성형 분류 기준",pg:12},
 {f:"m3_sun_anatomy",no:"MISSION 03",t:"스스로 빛을 내는 유일한 별, 태양의 해부학",d:"광구·흑점·쌀알 무늬 / 채층·코로나·홍염·플레어",pg:15},
 {f:"m4_space_weather",no:"MISSION 04",t:"우주 기상 주의보: 태양의 활동이 지구에 미치는 영향",d:"태양풍·오로라·자기 폭풍과 통신·GPS·전력망",pg:14}];
function renderDocs(){
  app.innerHTML=`${hudBlock()}<h2 style="margin:18px 4px 4px;font-size:1.9rem">📂 자료실</h2>
  <p class="small" style="margin:0 4px 12px">미션별 정리 자료입니다. 미션 전에 훑어보거나, 끝난 뒤 복습할 때 열어 보세요. 누르면 새 창에서 열립니다.</p>
  <div class="grid">${DOCS.map(d=>`<a href="docs/${d.f}.pdf" target="_blank" rel="noopener" class="docl" data-f="${d.f}" style="display:flex;flex-direction:column;text-decoration:none;color:var(--fg);background:linear-gradient(180deg,var(--panel),#0c1233);border:1.5px solid var(--line);border-radius:20px;overflow:hidden">
    <img src="docs/thumb/${d.f.slice(0,2)}.jpg" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1.5px solid var(--line)">
    <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px"><div style="font-family:var(--disp);color:var(--cyan);font-size:.9rem;letter-spacing:.12em">${d.no}</div><h3 style="font-size:1.2rem;line-height:1.4">${d.t}</h3><div class="small">${d.d}</div><div class="small" style="color:var(--sun);margin-top:4px">📄 ${d.pg}쪽 · 열기 ↗ ${S.docs&&S.docs[d.f]?'<span class="pill g" style="margin-left:6px">열어 봄</span>':''}</div></div></a>`).join("")}</div>`;
  drawHud();
  app.querySelectorAll(".docl").forEach(a=>a.addEventListener("click",()=>{S.docs=S.docs||{};if(!S.docs[a.dataset.f]){S.docs[a.dataset.f]=1;save();}logSrv('자료실',a.dataset.f,'','','');}));
}

/* ═══════ 내비 ═══════ */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;deck=null;render();});
document.addEventListener("keydown",e=>{if(!deck)return;if(e.target.closest("textarea,input"))return;
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();const n=stage.querySelector("#next");if(n)n.click();}
 if(e.key==="ArrowLeft"){e.preventDefault();const p=stage.querySelector("#prev");if(p&&!p.disabled)p.click();}
 if(e.key==="Escape"){deck=null;view="learn";render();}});
(function(){const h=(location.hash||"").replace("#","");const m=h.match(/^(c[1-5])s(\d+)$/);
 if(m){const ci=CH.findIndex(c=>c.id===m[1]);if(ci>=0){deck={ch:ci,i:Math.min(+m[2]-1,CH[ci].slides.length-1)};view="learn";}}
 else if(["home","crew","learn","wanted","exam","comms","docs","teacher"].includes(h))view=h;})();
if(me){loadLocal(); if(API){call({action:'ping'}).then(r=>{AI_ON=!!r.ai;setSync('on');showAI();}).catch(()=>setSync('err'));}}
render();
</script>
