<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a1f">
<title>아라호 관제센터</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ──────────────────────────────────────────────
   아라호 관제센터 · 디자인 토큰
   레이아웃: 학습은 100dvh 풀스크린 슬라이드(전자칠판·태블릿),
   나머지는 스크롤 카드. 볼드함은 각 장의 '살아있는 우주 장면' 한 곳에 집중.
   ────────────────────────────────────────────── */
:root{
  --space0:#060a1f; --space1:#0b1130; --panel:#121a40; --panel2:#1a2454; --line:#2c3775; --line2:#44519e;
  --fg:#f2f4ff; --mut:#9aa6db; --dim:#6b77b4;
  --sun:#ffae34; --sun2:#ff7b1c; --cyan:#53e0ff; --green:#3de8a0; --red:#ff6b6b; --violet:#9b8cff;
  --disp:'Jua',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--space0);color:var(--fg);font-family:var(--body);font-size:17.5px;line-height:1.75;
  background-image:
   radial-gradient(1200px 700px at 85% -10%,#1b2a6b55,transparent 60%),
   radial-gradient(900px 600px at -10% 110%,#3a155f44,transparent 60%),
   radial-gradient(1.6px 1.6px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 12%,#fff6 50%,transparent 51%),
   radial-gradient(1.4px 1.4px at 86% 48%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 38% 78%,#fff6 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 8% 64%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#fff5 50%,transparent 51%);
  background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:.55em 0}
button{font-family:var(--body);font-size:1.05rem;border:0;border-radius:14px;cursor:pointer;min-height:52px;padding:10px 18px;color:var(--fg);-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;font-size:1.12rem;box-shadow:0 4px 18px #ff9c2a44}
.btn-s{background:var(--panel2);border:1.5px solid var(--line2)}
.btn-g{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
textarea,input[type=text]{width:100%;background:#0a0f2c;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.12rem;font-family:var(--body);line-height:1.8}
textarea{min-height:140px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
.wrap{max-width:900px;margin:0 auto;padding:18px 18px 112px}
.card{background:linear-gradient(180deg,var(--panel),#0e1538);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:#0a0f2c;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 14px;font-size:.88rem}
.small{font-size:.95rem;color:var(--mut)}

/* ── 상단 HUD ── */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#0d1335cc;border:1.5px solid var(--line);border-radius:18px;padding:12px 18px;backdrop-filter:blur(8px)}
.hud .rk{font-family:var(--disp);font-size:1.2rem;color:var(--sun)}
.hud .pt{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.bar{height:10px;background:#0a0f2c;border-radius:99px;overflow:hidden;flex:1;min-width:110px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));border-radius:99px;transition:width .4s}

/* ── 하단 탭 ── */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#090e26ee;border-top:1.5px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav#tabs button{background:transparent;min-height:62px;min-width:62px;flex:0 1 150px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.92rem;color:var(--mut);border-radius:14px;padding:6px 4px}
nav#tabs button .ic{font-size:1.5rem}
nav#tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line2)}
body.deckmode nav#tabs{display:none}

/* ── 홈 히어로 ── */
.hero{position:relative;text-align:center;padding:46px 18px 34px;overflow:hidden;border-radius:26px;border:1.5px solid var(--line);
 background:radial-gradient(600px 330px at 50% 115%,#2a1a5e66,transparent),linear-gradient(180deg,#0d1335,#0a0f2c)}
.hero .rocket{font-size:3.4rem;display:inline-block}
@media (prefers-reduced-motion:no-preference){.hero .rocket{animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}}
.hero h1{font-size:clamp(2.1rem,7vw,3rem);margin:6px 0 2px;text-shadow:0 0 28px #ffae3430}
.hero .sub{color:var(--mut);font-size:1.08rem;max-width:34em;margin:8px auto 0}
.flow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.flow span{background:#0a0f2c;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.98rem}
.flow b{color:var(--sun)}

/* ── 장 카드(미션 학습 목록) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.chap{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel),#0d1335);border:1.5px solid var(--line);border-radius:22px;padding:20px;cursor:pointer;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.chap:active{transform:scale(.98)}
.chap.doneAll{border-color:var(--green)}
.chap .em{font-size:2.2rem}
.chap h3{font-size:1.32rem}
.chap .glow{position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;filter:blur(32px);opacity:.5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:99px;background:#0a0f2c;border:1px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.stamp{font-family:var(--disp);color:var(--green);border:2.5px solid var(--green);border-radius:10px;display:inline-block;padding:2px 14px;transform:rotate(-6deg);background:#06301d55}

/* ══════════ 슬라이드 무대 ══════════ */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--space0);
 background-image:radial-gradient(1000px 560px at 80% -10%,#1b2a6b55,transparent 60%),radial-gradient(1.4px 1.4px at 16% 26%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 16%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 88% 56%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 34% 82%,#fff5 50%,transparent 51%)}
.stg-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.stg-top .ttl{font-family:var(--disp);font-size:1.12rem;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-top .num{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700;font-size:1.05rem}
.stg-top button{min-height:44px;padding:6px 14px}
.pbar{height:5px;background:#0a0f2c}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));transition:width .35s}
.stg-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 10px;display:flex}
.slide{margin:auto;width:100%;max-width:860px}
.stg-nav{position:relative;display:flex;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.stg-nav button{flex:1;font-size:1.2rem;min-height:60px}
.stg-nav .hintkey{display:none}
@media (min-width:900px){.stg-nav .hintkey{display:block;position:absolute;left:50%;transform:translateX(-50%);top:-20px;color:var(--dim);font-size:.85rem}}

/* 슬라이드 공통 타이포 */
.s-kicker{font-family:var(--disp);color:var(--cyan);font-size:1.05rem;letter-spacing:.04em;margin-bottom:4px}
.s-title{font-family:var(--disp);font-size:clamp(1.7rem,4.6vw,2.6rem);line-height:1.3;margin:2px 0 14px;text-shadow:0 0 24px #53e0ff1f}
.s-body{font-size:clamp(1.12rem,2.6vw,1.3rem);line-height:1.85;max-width:38em}
.s-body b{color:var(--sun)} .s-body em{color:var(--cyan);font-style:normal;font-weight:700}
.s-body ul{padding-left:1.2em;margin:.5em 0}
.key{background:#0a0f2c;border:1.5px solid var(--line);border-left:6px solid var(--sun);border-radius:14px;padding:14px 18px;margin:16px 0;font-size:clamp(1.08rem,2.4vw,1.22rem)}
.key .kt{font-family:var(--disp);color:var(--sun);display:block;margin-bottom:2px}
.figure{background:#0a0f2ccc;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.figcap{color:var(--mut);font-size:.95rem;text-align:center;margin-top:8px}
svg text{font-family:var(--body)}

/* 히어로 슬라이드 */
.s-hero{text-align:center}
.s-hero .s-title{font-size:clamp(2rem,6vw,3.1rem)}
.s-hero .s-sub{color:var(--mut);font-size:1.12rem;max-width:30em;margin:0 auto}

/* 퀴즈 */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--line2);margin:10px 0;font-size:clamp(1.08rem,2.5vw,1.25rem);padding:16px 18px;border-radius:16px}
.opt .n{font-family:var(--disp);color:var(--cyan);flex:0 0 auto}
.opt.ok{background:#0d3a2455;border-color:var(--green)}
.opt.no{background:#43182055;border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.opt.no{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.fb{border-radius:16px;padding:14px 18px;margin-top:14px;font-size:1.08rem}
.fb.ok{background:#0d3a2455;border:1.5px solid var(--green)}
.fb.no{background:#3a2a1055;border:1.5px solid var(--sun)}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{padding:4px 0}
.cklist .y::before{content:"✔ ";color:var(--green)} .cklist .n::before{content:"✦ ";color:var(--sun)}
.frame{background:#0a0f2c;border:1.5px dashed var(--line2);border-radius:14px;padding:12px 16px;color:var(--mut);font-size:1.02rem;margin:10px 0}
.frame b{color:var(--cyan)}

/* 표 */
table.t{border-collapse:collapse;width:100%;font-size:clamp(1rem,2.3vw,1.12rem);font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:10px 12px;text-align:center}
table.t th{background:#0a0f2c;color:var(--cyan);font-weight:700}
table.t td:first-child{color:var(--sun);font-weight:700}
.twrap{overflow-x:auto;margin:10px 0}

/* 인과 사슬 */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.chain .nd{flex:1 1 140px;background:var(--panel2);border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:1.02rem;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.chain .nd b{color:var(--sun);font-family:var(--disp);font-weight:400}
.chain .ar{align-self:center;color:var(--sun);font-size:1.5rem}

/* ── 장면: 공전 태양계 ── */
.orbitbox{position:relative;width:min(88vw,460px);aspect-ratio:1;max-width:100%;margin:6px auto}
.orbit{position:absolute;border:1.5px dashed #3a4a9a66;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.spin{position:absolute;left:50%;top:50%;width:0;height:0}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 10px #0008}
.planet u{text-decoration:none}
.planet span{position:absolute;left:50%;top:-2em;transform:translateX(-50%);font-size:.85rem;color:var(--fg);background:#0a0f2cdd;border:1px solid var(--line);border-radius:8px;padding:1px 8px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.planet.show span{opacity:1}
.sunCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#fff3c4,#ffae34 55%,#ff7b1c);box-shadow:0 0 36px 10px #ffae3466,0 0 90px 30px #ff7b1c22}
.beltdot{position:absolute;width:3px;height:3px;border-radius:50%;background:#c9b08a;transform:translate(-50%,-50%)}

/* ── 장면: 태양 클로즈업 ── */
.sunstage{position:relative;width:min(92vw,460px);margin:4px auto}
@media (prefers-reduced-motion:no-preference){
 .corona{animation:pulse 4.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 .flareA{animation:flick 2.6s ease-in-out infinite}@keyframes flick{0%,100%{opacity:.35}45%{opacity:1}}
}
.pin{font-size:15px;fill:#f2f4ff}

/* ── 장면: 분류 격납고 게임 ── */
.hangars{display:flex;gap:12px;margin-top:14px}
.hangar{flex:1;border:2px solid var(--line2);border-radius:18px;padding:12px;min-height:110px;text-align:center}
.hangar h4{font-family:var(--disp);font-weight:400;font-size:1.15rem;margin:0 0 6px}
.hangar.rock{border-color:#d08f5a} .hangar.gas{border-color:var(--cyan)}
.hangar .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hangar .got span{background:#0a0f2c;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:.95rem}
.qPlanet{text-align:center;margin:8px 0}
.qPlanet .ball{display:inline-block;border-radius:50%;box-shadow:0 0 24px #0009, inset -14px -14px 30px #0006}
.qPlanet .nm{font-family:var(--disp);font-size:1.5rem;display:block;margin-top:8px}
.binbtns{display:flex;gap:12px;margin-top:10px}
.binbtns button{flex:1;font-size:1.15rem;min-height:62px}

/* ── 장면: 태양 활동 시뮬레이터 ── */
.sim{border:1.5px solid var(--line);border-radius:20px;background:#0a0f2cd9;padding:16px;text-align:left}
.simrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center}
.simsun{position:relative;width:120px;height:120px;border-radius:50%;flex:0 0 auto;overflow:hidden;
 background:radial-gradient(circle at 38% 34%,#fff3c4,#ffae34 55%,#ff7b1c);box-shadow:0 0 12px 4px #ffae3466;transition:box-shadow .3s}
.simsun i{position:absolute;border-radius:50%;background:#5a2d00}
.windlane{position:relative;flex:1;min-width:150px;height:60px;overflow:hidden}
.wp{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:var(--cyan);opacity:.9}
@media (prefers-reduced-motion:no-preference){.wp{animation:fly linear infinite}@keyframes fly{from{transform:translateX(-10px)}to{transform:translateX(440px)}}}
.earthdot{width:74px;height:74px;border-radius:50%;flex:0 0 auto;position:relative;
 background:radial-gradient(circle at 35% 35%,#9fd8ff,#2a6fd6 60%,#143a78);box-shadow:0 0 18px #2a6fd666}
.aur{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:88px;height:30px;border-radius:50%;
 background:linear-gradient(90deg,transparent,var(--green),var(--cyan),var(--violet),transparent);filter:blur(5px);opacity:.15;transition:opacity .3s,height .3s}
.lamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.lamp{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:.98rem;transition:border-color .3s}
.lamp .st{display:block;font-weight:900;margin-top:2px}
.lamp.good{border-color:var(--green)} .lamp.good .st{color:var(--green)}
.lamp.warnL{border-color:var(--sun)} .lamp.warnL .st{color:var(--sun)}
.lamp.badL{border-color:var(--red)} .lamp.badL .st{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--sun);height:40px}
.simread{font-family:var(--disp);text-align:center;font-size:1.25rem;margin-top:8px}
.simread b{color:var(--sun)}

/* 비유 그림 */
.metaphor{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.metaphor .m{text-align:center;flex:1 1 150px;max-width:230px}
.metaphor .shape{margin:0 auto;border-radius:50%}
.metaphor .lb{margin-top:8px;font-size:1.02rem}
.metaphor .lb b{color:var(--sun)}

/* 수배 파일 */
.wanted{position:relative;border:2px solid var(--line2);border-radius:20px;padding:18px;background:linear-gradient(170deg,var(--panel),#0a0f2c);margin:14px 0}
.wanted::before{content:"CASE FILE";position:absolute;right:16px;top:-12px;font-family:var(--disp);font-size:.8rem;letter-spacing:.2em;color:var(--dim);background:var(--space0);padding:0 8px}
.wanted.solved{border-color:var(--green)}
.clue{background:#0a0f2c;border:1.5px dashed var(--line2);border-radius:14px;padding:12px 16px;font-size:1.1rem;margin:10px 0}

/* 선생님/코드 */
.codebox{background:#04071a;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;word-break:break-all;max-height:150px;overflow:auto;user-select:all}
.badgerow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.badge{background:#0a0f2c;border:1.5px solid var(--line);border-radius:12px;padding:7px 13px;font-size:.98rem}
.badge.on{border-color:var(--sun);color:var(--sun);box-shadow:0 0 14px #ffae3422}
.sec{border:1.5px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.sec>button{width:100%;text-align:left;background:var(--panel2);border:0;border-radius:0;font-size:1.08rem;font-weight:700}
.sec>div{padding:14px 18px;background:#0a0f2c}
.news{border-left:6px solid var(--violet);background:#151040;border-radius:12px;padding:12px 16px;margin:10px 0;font-size:1.08rem}
.news .src{color:var(--mut);font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;padding:13px 24px;border-radius:99px;box-shadow:0 8px 28px #000a;z-index:60;transition:opacity .3s;font-size:1.05rem}
body.deckmode .toast{bottom:110px}
@media (max-width:460px){body{font-size:16.5px}.card{padding:18px 16px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="stage" hidden></div>
<nav id="tabs">
  <button data-v="home"><span class="ic">🛰️</span>관제센터</button>
  <button data-v="learn"><span class="ic">📚</span>미션 학습</button>
  <button data-v="wanted"><span class="ic">🔭</span>수배 파일</button>
  <button data-v="exam"><span class="ic">✍️</span>논술 시험</button>
  <button data-v="teacher"><span class="ic">📋</span>선생님</button>
</nav>

<script>
"use strict";
/* ═══════ 상태 ═══════ */
const LS="araho_v1", TEACHER_CODE="0726";
let S={name:"",cls:"",pts:0,seen:{},quiz:{},writes:{},wanted:{},exam:{},tdone:false,slide:{}};
try{const j=localStorage.getItem(LS); if(j)S={...S,...JSON.parse(j)};}catch(e){}
if(!S.slide)S.slide={};
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} drawHud();}
function addPts(n){S.pts+=n;save();toast("+"+n+"점!");}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400);},1400);}

/* ═══════ AI 코치 (Gemini) ═══════ */
const GKEY_LS="araho_gkey";
function getKey(){try{return localStorage.getItem(GKEY_LS)||"";}catch(e){return "";}}
function setKey(k){try{if(k)localStorage.setItem(GKEY_LS,k);else localStorage.removeItem(GKEY_LS);}catch(e){}}
(function(){try{
  const q=new URLSearchParams(location.search); let k=q.get("k")||"";
  if(!k&&location.hash.startsWith("#k="))k=decodeURIComponent(location.hash.slice(3));
  if(k){setKey(k.trim()); history.replaceState(null,"",location.pathname);}
}catch(e){}})();
const coach=()=>!!getKey();
const GMODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-1.5-flash"];
async function geminiJSON(prompt){
  const key=getKey(); let lastErr=null;
  for(const m of GMODELS){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.4}})});
      if(res.status===404)continue;
      if(!res.ok){lastErr=res.status;if(res.status===429){await new Promise(r=>setTimeout(r,1500));continue;}break;}
      const j=await res.json();
      const txt=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts.map(p=>p.text||"").join("");
      if(!txt)throw new Error("empty");
      return JSON.parse(txt.replace(/^```json\s*|```\s*$/g,""));
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error("fail");
}
function showAI(){document.querySelectorAll(".aibtn").forEach(b=>b.hidden=!coach());}

/* ═══════ 서술 점검 엔진 ═══════ */
const LINKS=/(때문|따라서|그러므로|왜냐하면|그래서|이므로|으므로)/;
const COMPARE=/(반면|비해|보다|많고|적고|크고|작고|높고|낮고|달리)/;
function checkWrite(text,spec){
  const t=(text||"").trim(); const msgs=[]; let got=0,need=0;
  need++; if(t.length>=spec.min){got++;msgs.push({y:1,m:`길이 충분 (${t.length}자)`});}else msgs.push({y:0,m:`조금 더 길게! 최소 ${spec.min}자 (지금 ${t.length}자)`});
  (spec.groups||[]).forEach(g=>{need++;const hit=g.words.some(w=>t.includes(w));
    if(hit){got++;msgs.push({y:1,m:`핵심어 포함: ${g.name}`});}else msgs.push({y:0,m:`이 내용이 보이지 않아요 → ${g.name}`});});
  if(spec.compare){need++;if(COMPARE.test(t)){got++;msgs.push({y:1,m:"비교 표현 사용 (…보다, 반면 등)"});}else msgs.push({y:0,m:"두 대상을 '…보다/반면'처럼 직접 비교해 보세요"});}
  if(spec.link!==false){need++;if(LINKS.test(t)){got++;msgs.push({y:1,m:"이유·결론 연결어 사용 (때문에, 따라서 등)"});}else msgs.push({y:0,m:"'왜냐하면 ~ 때문이다', '따라서 ~'로 근거와 주장을 이어 보세요"});}
  return {pass:got>=need, got, need, msgs};
}
function fbHTML(r){return `<div class="fb ${r.pass?'ok':'no'}"><b>${r.pass?'✅ 통과! 논리가 잘 이어졌어요.':'🛰️ 관제센터 점검 '+r.got+'/'+r.need}</b><ul class="cklist">${r.msgs.map(m=>`<li class="${m.y?'y':'n'}">${esc(m.m)}</li>`).join("")}</ul>${r.pass?'':'<div class="small">✦ 표시만 고쳐서 다시 점검해 보세요. 고칠수록 좋아지는 게 진짜 글쓰기!</div>'}</div>`;}
async function aiFeedback(key,prompt,textGetter,outEl){
  const t=textGetter(); if(!t.trim()){outEl.innerHTML='<div class="fb no">먼저 글을 써 주세요!</div>';return;}
  outEl.innerHTML='<div class="fb no">🤖 AI 코치가 읽는 중…</div>';
  try{
    const res=await geminiJSON(
      "너는 한국 중학교 1학년 과학 논술 코치다. 학생의 글을 아래 기준으로 평가해 JSON으로만 답하라.\n"+
      "채점 관점: "+prompt+"\n학생 글: \"\"\"\n"+t+"\n\"\"\"\n"+
      '출력 형식: {"level":"상|중|하","good":["잘한 점 1~2개"],"improve":["고칠 점 1~2개, 구체적으로"],"next":"학생이 바로 이어 쓸 수 있는 예시 문장 1개"} 친절하고 짧게, 존댓말로. 정답을 통째로 불러주지 말고 스스로 고치게 힌트를 줘라.');
    outEl.innerHTML=`<div class="fb ok"><b>🤖 AI 코치 (수준: ${esc(res.level||"-")})</b>
      <ul class="cklist">${(res.good||[]).map(g=>`<li class="y">${esc(g)}</li>`).join("")}${(res.improve||[]).map(g=>`<li class="n">${esc(g)}</li>`).join("")}</ul>
      ${res.next?`<div class="frame">✍️ 이렇게 이어 보면? “${esc(res.next)}”</div>`:""}</div>`;
  }catch(e){outEl.innerHTML='<div class="fb no">AI 코치 연결에 실패했어요(키 확인 또는 잠시 후 다시). 자동 점검으로도 충분히 연습할 수 있어요!</div>';}
}

    box.querySelectorAll(".planet").forEach(pl=>{pl.style.left=(w*(RAD[pl.dataset.nm]||20)/100)+"px";});};

 {t:"learn",h:"행성 8형제",b:`<p>태양 주위를 공전하는 8개의 행성.</p><p style="font-family:var(--disp);font-size:1.5rem;text-align:center;letter-spacing:.06em">수성 · 금성 · 지구 · 화성<br>목성 · 토성 · 천왕성 · 해왕성</p><div class="key"><span class="kt">외우기</span>"수·금·지·화·목·토·천·해" — 태양에서 가까운 순서!</div>`},
 {t:"learn",h:"위성 — 행성의 단짝",b:`<p><b>위성</b>은 <em>행성 주위를 공전</em>하는 천체. 지구의 위성은 <b>달</b>이에요.</p><p>목성형 행성들은 위성을 수십 개씩 거느려요.</p><div class="key"><span class="kt">함정 주의</span>위성은 태양이 아니라 <b>행성</b> 주위를 돌아요. 하지만 그 행성이 태양을 돌기 때문에 — <b>위성도 당당한 태양계 구성원!</b></div>`},
 {t:"learn",h:"소행성과 혜성",b:`<ul><li><b>소행성</b> — 작고 불규칙한 <em>암석</em> 천체. 주로 <b>화성과 목성 사이</b> '소행성대'에서 태양 주위를 공전</li><li><b>혜성</b> — <em>얼음과 먼지</em> 덩어리. <b>길쭉한 궤도</b>로 태양 주위를 공전</li></ul><div class="key"><span class="kt">혜성의 꼬리</span>태양에 <b>가까워지면</b> 얼음이 녹아 꼬리가 생기고, 꼬리는 항상 <em>태양 반대쪽</em>을 향해요.</div>`},
 {t:"quiz",q:"혜성의 꼬리가 생기는 때와 방향으로 옳은 것은?",o:["태양에서 멀어질 때, 태양 쪽","태양에 가까워질 때, 태양 반대쪽","언제나 꼬리가 있고 방향은 제멋대로"],a:1,ex:"태양에 가까워지면 얼음이 승화해 꼬리가 생기고, 태양풍에 밀려 꼬리는 태양 반대쪽을 향해요."},
 {t:"quiz",q:"다음 중 태양계 구성원이 <b>아닌</b> 것은?",o:["달(위성)","소행성","태양계 밖의 다른 별"],a:2,ex:"위성·소행성·혜성도 모두 태양계 구성원! 태양계 밖의 별은 구성원이 아니에요."},
 {t:"write",key:"w_c1",h:"관제 일지 · 한 줄 논술",prompt:`우주 신문에 <b>"행성이 아닌 혜성은 태양계 구성원이 아니다"</b>라는 기사가 실렸어요. 이 기사가 잘못된 까닭을 한두 문장으로 반박해 보세요.`,frame:"혜성은 행성은 아니지만 <b>______을/를 공전</b>하기 때문에 <b>______</b>이다.",spec:{min:25,groups:[{name:"'공전'이라는 말",words:["공전","주위를 돌","주위를 도는","태양 주위"]},{name:"'태양계 구성원'이라는 판단",words:["구성원","태양계에 포함","태양계이다","태양계에 속"]}]},ai:"혜성이 행성이 아니어도 태양 주위를 공전하므로 태양계 구성원이라는 점을 근거-주장 구조로 썼는지 평가"},
 {t:"clear",pts:["태양계 = 태양 + 공전하는 모든 천체","태양은 유일한 별(스스로 빛)","행성 8개: 수금지화목토천해","위성·소행성·혜성도 구성원 (공전!)","혜성 꼬리: 태양 가까이, 태양 반대쪽"]}
]},
{id:"c2",em:"⚖️",glow:"#e8c27a",title:"2장. 쌍둥이가 아니야",sub:"지구형 vs 목성형 행성 · 7분",slides:[
 {t:"hero",k:"MISSION 02",h:"쌍둥이가 아니야",sub:"아라호가 보낸 행성 자료 도착. 8개의 행성은 두 팀으로 나뉜다 — 분류 기준을 마스터하라!",art:SIZE_FIG},
 {t:"learn",h:"분류 기준 다섯 가지",b:`<p>행성은 특징에 따라 <em>지구형</em>과 <em>목성형</em> 두 팀으로 나뉘어요.</p><div class="key"><span class="kt">기준</span><b>반지름(크기) · 질량 · 평균 밀도 · 위성 수 · 고리</b></div><p>논술형 평가는 늘 이 기준으로 "표를 읽고 근거를 대라"고 물어요.</p>`},
 {t:"learn",h:"지구형 행성 — 수·금·지·화",b:`<ul><li>크기와 질량이 <em>작다</em></li><li>평균 밀도가 <em>크다</em> — 단단한 <b>암석</b>으로 되어 있어서!</li><li>위성이 <em>없거나 적다</em></li><li>고리가 <em>없다</em></li></ul>`},
 {t:"learn",h:"목성형 행성 — 목·토·천·해",b:`<ul><li>크기와 질량이 <em>크다</em></li><li>평균 밀도가 <em>작다</em> — 주로 <b>기체</b>로 되어 있어서!</li><li>위성이 <em>많다</em></li><li>고리가 <em>있다</em></li></ul>`},
 {t:"learn",h:"반전: 클수록 가볍다?",b:`<p>가장 많이 틀리는 오개념 — "크면 밀도도 크겠지?" <b>반대예요!</b></p>${METAPHOR}<div class="key"><span class="kt">오개념 교정</span>밀도는 '얼마나 꽉 찼는가'. 목성형은 덩치는 커도 기체라 <b>밀도가 작아요.</b></div>`},
 {t:"game2",h:"격납고 분류 작전"},
 {t:"learn",h:"서술 공식",b:`<p>표가 나오면 이 틀로 쓰면 됩니다.</p><div class="key"><span class="kt">서술 공식</span>"A는 ○○형 행성이다. A는 B<b>보다</b> ~하고 ~하기 <b>때문이다</b>."</div><p>⚠️ 근거는 반드시 <b>두 가지 이상</b> — 한 가지만 쓰면 감점!</p><div class="twrap"><table class="t"><tr><th>구분</th><th>지구형</th><th>목성형</th></tr><tr><td>크기·질량</td><td>작다</td><td>크다</td></tr><tr><td>평균 밀도</td><td>크다</td><td>작다</td></tr><tr><td>위성 수</td><td>없거나 적다</td><td>많다</td></tr><tr><td>고리</td><td>없다</td><td>있다</td></tr></table></div>`},
 {t:"quiz",q:"평균 밀도가 크고 위성이 없는 행성은 어느 팀?",o:["지구형 행성","목성형 행성","둘 다 아님"],a:0,ex:"밀도가 크다 = 암석 행성 = 지구형! 지구형은 위성이 없거나 적어요."},
 {t:"write",key:"w_c2",h:"관제 일지 · 한 줄 논술",prompt:`아라호가 관측한 <b>천체 P</b> — 상대 지름 4.0, 평균 밀도 1.2 g/cm³, 위성 27개, 고리 있음.<br>P를 지구형/목성형으로 <b>분류</b>하고, 자료에서 <b>근거 두 가지 이상</b>을 들어 까닭을 쓰세요.`,frame:"P는 <b>___형 행성</b>이다. 왜냐하면 지구형 행성보다 ___이/가 ___고, ___이/가 ___기 때문이다.",spec:{min:40,groups:[{name:"'목성형'이라는 분류",words:["목성형"]},{name:"밀도 근거",words:["밀도"]},{name:"위성 또는 고리 근거",words:["위성","고리"]}],compare:true},ai:"천체 P(밀도 작음, 위성 많음, 고리 있음)를 목성형으로 분류하고 자료의 특징 2가지 이상을 비교해 근거로 들었는지 평가"},

{id:"c3",em:"☀️",glow:"#ffae34",title:"3장. 태양의 얼굴",sub:"태양의 특징과 태양 활동 · 7분",slides:[
 {t:"hero",k:"MISSION 03",h:"태양의 얼굴",sub:"아라호의 태양 카메라 가동. 표면과 대기에서 벌어지는 거대한 쇼를 기록하라!",scene:"sun"},
 {t:"learn",h:"표면: 광구와 흑점",b:`<ul><li><b>광구</b> — 우리가 보는 태양의 둥근 표면. 온도 약 <em>6000℃</em></li><li><b>흑점</b> — 주위보다 온도가 <em>낮아서(약 4000℃)</em> 어둡게 보이는 점</li></ul><div class="key"><span class="kt">오개념 교정</span>흑점도 빛을 내요! 다만 주위가 더 밝아서 <b>상대적으로</b> 어두워 보일 뿐.</div>`},
 {t:"learn",h:"쌀알 무늬, 그리고 자전",b:`<ul><li><b>쌀알 무늬</b> — 광구 아래에서 물질이 끓어오르며(대류) 생기는 쌀알 모양 무늬</li><li>흑점이 동→서로 <b>이동하는 것처럼</b> 보이는 까닭? 태양이 <em>자전</em>하기 때문!</li></ul>`},
 {t:"learn",h:"대기: 채층과 코로나",b:`<p>태양의 대기는 평소엔 광구가 너무 밝아 안 보이고, <em>개기 일식</em> 때 볼 수 있어요.</p><ul><li><b>채층</b> — 광구 바로 위의 붉은 대기층</li><li><b>코로나</b> — 바깥으로 멀리 뻗은 진주색 대기. 온도가 <em>100만 ℃ 이상!</em></li></ul>`},
 {t:"learn",h:"대기의 폭발 쇼: 홍염과 플레어",b:`<ul><li><b>홍염</b> — 광구에서 솟아오르는 거대한 <em>불기둥</em></li><li><b>플레어</b> — 흑점 근처에서 일어나는 강력한 <em>폭발</em>. 엄청난 에너지와 물질을 내뿜어요</li></ul>`},
 {t:"learn",h:"'활발하다'의 신호 세트",b:`<div class="key"><span class="kt">태양 활동이 활발할 때 (세트로 외우기!)</span>① <b>흑점 수 증가</b> ② <b>홍염·플레어 잦아짐</b> ③ <b>코로나 커짐</b> ④ <b>태양풍 강해짐</b></div><p>논술형은 "어느 시기가 활발한가? <em>근거는?</em>"을 꼭 물어요. 근거는 <b>흑점 수</b>와 <b>홍염·플레어</b> 자료에서 찾으세요!</p>`},
 {t:"quiz",q:"흑점이 어둡게 보이는 까닭은?",o:["빛을 전혀 내지 않아서","주위(광구)보다 온도가 낮아서","구멍이 뚫려 있어서"],a:1,ex:"흑점도 빛을 내지만, 약 4000℃로 주위(6000℃)보다 온도가 낮아 상대적으로 어둡게 보여요."},
 {t:"write",key:"w_c3",h:"관제 일지 · 한 줄 논술",prompt:`관측 기록 — <b>(가) 시기</b>: 흑점 수 적음, 플레어 드묾 / <b>(나) 시기</b>: 흑점 수 많음, 플레어 자주 발생.<br>태양 활동이 더 활발한 시기를 <b>판단</b>하고, 자료에서 <b>근거 두 가지</b>를 들어 쓰세요.`,frame:"태양 활동은 <b>___ 시기</b>에 더 활발하다. 왜냐하면 (가) 시기보다 ___이/가 ___고, ___이/가 ___기 때문이다.",spec:{min:35,groups:[{name:"'(나) 시기' 판단",words:["나"]},{name:"흑점 근거",words:["흑점"]},{name:"플레어(홍염) 근거",words:["플레어","홍염"]}]},ai:"흑점 수와 플레어 발생 자료를 근거로 (나) 시기에 태양 활동이 활발하다고 판단했는지, 근거 2가지를 들었는지 평가"},
 {t:"clear",pts:["표면: 광구(6000℃)·흑점(온도 낮아 어둡게)·쌀알 무늬(대류)","흑점 이동 = 태양의 자전","대기: 채층·코로나(100만℃↑) — 개기 일식 때","홍염(불기둥)·플레어(폭발)","활발 신호: 흑점↑·홍염/플레어↑·코로나↑·태양풍↑"]}
]},
{id:"c4",em:"🌏",glow:"#3de8a0",title:"4장. 태양이 보낸 신호",sub:"태양 활동이 지구에 미치는 영향 · 7분",slides:[
 {t:"hero",k:"MISSION 04",h:"태양이 보낸 신호",sub:"우주기상 경보 발령. 태양의 변화가 1억 5천만 km 떨어진 지구를 어떻게 흔드는지 밝혀라!",scene:"sim"},
 {t:"learn",h:"태양풍 — 태양이 부는 바람",b:`<p>태양은 빛만 보내는 게 아니에요. <b>전기를 띤 입자</b>들을 사방으로 내뿜는데, 이것이 <em>태양풍</em>!</p><div class="key"><span class="kt">핵심 연결</span>태양 활동이 활발해지면 → 태양풍도 <b>강해진다</b></div>`},
 {t:"learn",h:"지구의 방패, 그리고 오로라",b:`<p>지구의 <b>자기장</b>이 태양풍을 막아 주는 방패 역할을 해요.</p><p>일부 입자가 극지방 하늘로 들어와 공기와 부딪히면 — <b>오로라</b>가 빛나요!</p><div class="key"><span class="kt">활발할 때의 오로라</span><b>더 자주</b>, 그리고 평소보다 <b>낮은 위도</b>에서도 나타나요.</div>`},

const app=document.getElementById("app"), stage=document.getElementById("stage");
let view="home", deck=null;

function drawHud(){const h=document.getElementById("hud");if(!h)return;const{r,next}=rank();
 const pct=next?Math.min(100,Math.round(S.pts/next[0]*100)):100;
 h.innerHTML=`<span class="rk">${esc(S.name||"이름 미입력")} · ${r}</span><span class="pt">⭐ ${S.pts}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="small">${next?`다음 등급까지 ${next[0]-S.pts}점`:"최고 등급 달성!"}</span>`;}
function hudBlock(){return `<div id="hud" class="hud"></div>`;}

function slideDone(c,sl,idx){const k=c.id+"_"+idx;
 if(sl.t==="learn"||sl.t==="hero"||sl.t==="clear")return !!S.seen[k];
 if(sl.t==="quiz"||sl.t==="game2")return !!S.quiz[k];
 if(sl.t==="write")return !!(S.writes[sl.key]&&S.writes[sl.key].ok);
 return false;}
function chapProg(c){let d=0;c.slides.forEach((sl,i)=>{if(slideDone(c,sl,i))d++;});return{d,total:c.slides.length};}

function render(){
 document.body.classList.toggle("deckmode",!!deck);
 stage.hidden=!deck;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 if(deck){renderSlide();return;}
 if(view==="home")renderHome();
 else if(view==="learn")renderLearn();
 else if(view==="wanted")renderWanted();
 else if(view==="exam")renderExam();
 else if(view==="teacher")renderTeacher();
 showAI();
}

/* 분류 게임 */
function mountG2(root,k){
 let q=[...G2].sort(()=>Math.random()-.5), idx=0, score=0, got={rock:[],gas:[]};
 function bins(){return `<div class="hangars"><div class="hangar rock"><h4>🪨 지구형</h4><div class="got">${got.rock.map(n=>`<span>${n}</span>`).join("")||'<span class="small">비어 있음</span>'}</div></div>
  <div class="hangar gas"><h4>🎈 목성형</h4><div class="got">${got.gas.map(n=>`<span>${n}</span>`).join("")||'<span class="small">비어 있음</span>'}</div></div></div>`;}
 function draw(){
  if(idx>=q.length){
    root.innerHTML=`<div class="fb ok" style="text-align:center"><b style="font-size:1.3rem">분류 완료! ${score}번 만에 성공 🎉</b><p>지구형 = 작고 꽉 참 · 목성형 = 크고 푹신함. 이제 몸이 기억하죠?</p></div>${bins()}`;
    if(!S.quiz[k]){S.quiz[k]=1;addPts(6);}else save();
    return;}
  const p=q[idx];
  root.innerHTML=`<div class="qPlanet"><span class="ball" style="width:${p[2]}px;height:${p[2]}px;background:radial-gradient(circle at 35% 35%,#fff7,${p[3]})"></span><span class="nm">${p[0]}</span></div>
  <div class="binbtns"><button class="btn-s" data-b="rock" style="border-color:#d08f5a">🪨 지구형 격납고</button><button class="btn-s" data-b="gas" style="border-color:var(--cyan)">🎈 목성형 격납고</button></div>
  ${bins()}<div id="g2fb"></div>`;
  root.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
    if(b.dataset.b===p[1]){got[p[1]].push(p[0]);score++;idx++;draw();}
    else{b.classList.add("no");root.querySelector("#g2fb").innerHTML=`<div class="fb no">🛰️ 다시! ${p[0]}의 크기를 잘 봐 — ${p[1]==="rock"?"작고 단단한 쪽":"크고 푹신한 쪽"}이야.</div>`;setTimeout(()=>b.classList.remove("no"),400);}});
 }
 draw();
}

 document.getElementById("gksave").onclick=()=>{setKey(document.getElementById("gk").value.trim());document.getElementById("gkst").textContent=coach()?"✅ 키 저장됨 — AI 코치 켜짐":"키 없음 — 자동 점검만 작동";showAI();toast(coach()?"AI 코치 켜짐 🤖":"키 삭제됨");};
 document.getElementById("gklink").onclick=()=>{const k=getKey();if(!k)return toast("먼저 키를 저장하세요");
   const url=location.origin+location.pathname+"?k="+encodeURIComponent(k);
   document.getElementById("gkout").innerHTML=`<div class="codebox">${esc(url)}</div>`;
   navigator.clipboard.writeText(url).then(()=>toast("링크 복사됨 — QR로 만들어 배포!")).catch(()=>toast("길게 눌러 복사하세요"));};
 const studentHTML=(d)=>`<div class="card"><h3>👩‍🚀 ${esc(d.n||"이름없음")} <span class="small">(${esc(d.c||"-")})</span></h3>
   <p>⭐ ${d.p}점 · ${esc(d.r||"")} · 제출 ${esc(d.ts||"-")}</p>
   <p class="small">학습 진도: ${ (d.ch||[]).map((x,i)=>`${i+1}장 ${x}`).join(" · ") } · 수배 해결 ${d.wd??0}/${WANTED.length}</p>
   ${(d.w||[]).length?`<div class="sec"><button data-sec>▶ 한 줄 논술 ${(d.w||[]).length}건</button><div hidden>${d.w.map(w=>`<p><b>${esc(w.k)}</b> ${w.ok?'<span style="color:var(--green)">통과</span>':'<span style="color:var(--sun)">연습 중</span>'}<br>${esc(w.t)}</p>`).join("<hr style='border-color:var(--line)'>")}</div></div>`:'<p class="small">한 줄 논술 기록 없음</p>'}
   ${d.e&&Object.keys(d.e).length?`<div class="sec"><button data-sec>▶ 논술 시험 답안 ${Object.keys(d.e).length}문항</button><div hidden>${Object.entries(d.e).map(([n,v])=>`<p><b>문항 ${n}</b> <span class="small">(자동점검 ${esc(v.g||"-")})</span><br>${esc(v.t)}</p>`).join("<hr style='border-color:var(--line)'>")}</div></div>`:'<p class="small">시험 답안 없음</p>'}</div>`;
 const bindSec=(root)=>root.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{const dd=b.nextElementSibling;dd.hidden=!dd.hidden;b.textContent=(dd.hidden?"▶":"▼")+b.textContent.slice(1);});
 document.getElementById("parse").onclick=()=>{
   const lines=document.getElementById("codes").value.split(/\s+/).filter(x=>x.startsWith("ARAHO."));
   const rows=[];lines.forEach(l=>{try{rows.push(JSON.parse(decodeURIComponent(escape(atob(l.slice(6))))));}catch(e){}});
   const R=document.getElementById("roster");
   if(!rows.length){R.innerHTML='<div class="fb no">읽을 수 있는 코드가 없어요. ARAHO. 로 시작하는 코드 전체를 붙여넣었는지 확인하세요.</div>';return;}
   rows.sort((a,b)=>(a.c||"").localeCompare(b.c||"","ko"));
   R.innerHTML=`<div class="fb ok"><b>${rows.length}명의 기록을 불러왔어요.</b></div>`+rows.map(studentHTML).join("");
   bindSec(R);};
 document.getElementById("mine").onclick=()=>{
   const d={n:S.name,c:S.cls,p:S.pts,r:rank().r,ch:CH.map(c=>{const p=chapProg(c);return p.d+"/"+p.total;}),wd:Object.keys(S.wanted).length,
     w:Object.entries(S.writes).map(([k,v])=>({k,ok:v.ok?1:0,t:v.t||""})),e:S.exam,ts:"지금"};
   const M=document.getElementById("mineOut");M.innerHTML=studentHTML(d);bindSec(M);};
 document.getElementById("tlock").onclick=()=>{S.tdone=false;save();render();};
}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;deck=null;render();});
document.addEventListener("keydown",e=>{
 if(!deck)return; if(e.target.closest("textarea,input"))return;
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();const n=stage.querySelector("#next");if(n)n.click();}
 if(e.key==="ArrowLeft"){e.preventDefault();const p=stage.querySelector("#prev");if(p&&!p.disabled)p.click();}
 if(e.key==="Escape"){deck=null;view="learn";render();}
});
(function(){const h=(location.hash||"").replace("#","");
 const m=h.match(/^(c[1-4])s(\d+)$/);
 if(m){const ci=CH.findIndex(c=>c.id===m[1]);if(ci>=0){deck={ch:ci,i:Math.min(+m[2]-1,CH[ci].slides.length-1)};view="learn";}}
 else if(["home","learn","wanted","exam","teacher"].includes(h))view=h;})();
render();
</script>
