<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05081a">
<title>아라호 관제센터</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ─────────────────────────────────────────────────────────
   아라호 관제센터 — 디자인 토큰
   서체: 제목 Noto Serif KR 900 (고전적·우주 다큐 자막 느낌) / 본문 Noto Sans KR
   레이아웃: 16:9 전자칠판 기준 1600px 폭, 학습 슬라이드는 좌 글·우 사진 2단
   ───────────────────────────────────────────────────────── */
:root{
  --space0:#05081a; --space1:#0a0f2c; --panel:#10173a; --panel2:#182052; --line:#273270; --line2:#3b4a9a;
  --fg:#f3f5ff; --mut:#a3adda; --dim:#6d78b3;
  --sun:#ffb13b; --sun2:#ff7a1a; --cyan:#5fe3ff; --green:#3fe6a6; --red:#ff6b6b; --violet:#a497ff;
  --disp:'Noto Serif KR','Nanum Myeongjo',serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--space0);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75;
  background-image:
   radial-gradient(1400px 800px at 85% -10%,#1a2a6e55,transparent 60%),
   radial-gradient(1000px 700px at -10% 110%,#3b145f44,transparent 60%),
   radial-gradient(1.6px 1.6px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 12%,#fff6 50%,transparent 51%),
   radial-gradient(1.4px 1.4px at 86% 48%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 38% 78%,#fff6 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 8% 64%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#fff5 50%,transparent 51%),
   radial-gradient(1px 1px at 92% 82%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 28% 8%,#fff6 50%,transparent 51%);
  background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:.55em 0}
button{font-family:var(--body);font-size:1.05rem;border:0;border-radius:14px;cursor:pointer;min-height:52px;padding:10px 20px;color:var(--fg);-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;font-size:1.12rem;box-shadow:0 4px 18px #ff9c2a44}
.btn-s{background:var(--panel2);border:1.5px solid var(--line2)}
.btn-g{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
textarea,input[type=text],input[type=password],select{width:100%;background:#080c24;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.12rem;font-family:var(--body);line-height:1.8}
textarea{min-height:150px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
a{color:var(--cyan)}
.wrap{max-width:1600px;margin:0 auto;padding:18px 24px 112px}
.card{background:linear-gradient(180deg,var(--panel),#0c1233);border:1.5px solid var(--line);border-radius:22px;padding:24px 26px;margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:#080c24;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 14px;font-size:.9rem}
.small{font-size:.95rem;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

/* HUD */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#0b1133cc;border:1.5px solid var(--line);border-radius:18px;padding:12px 20px;backdrop-filter:blur(8px)}
.hud .rk{font-family:var(--disp);font-size:1.2rem;color:var(--sun)}
.hud .pt{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.hud .sync{margin-left:auto;font-size:.88rem;color:var(--dim)}
.hud #hudOut{margin-left:4px}
.hud .sync.on{color:var(--green)}
.bar{height:10px;background:#080c24;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));border-radius:99px;transition:width .4s}

/* 하단 탭 */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#070b22ee;border-top:1.5px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:6px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav#tabs button{background:transparent;min-height:62px;min-width:62px;flex:0 1 180px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.95rem;color:var(--mut);border-radius:14px;padding:6px 4px}
nav#tabs button .ic{font-size:1.5rem}
nav#tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line2)}
body.deckmode nav#tabs,body.gate nav#tabs{display:none}

/* 로그인 게이트 */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--space0);
 background-image:radial-gradient(900px 600px at 70% 20%,#1a2a6e66,transparent 60%),url(img/solarsys.jpg);background-size:cover;background-position:center}
#gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05081acc,#05081af2)}
.gatebox{position:relative;width:min(560px,100%);background:#0b1133ee;border:1.5px solid var(--line2);border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px #000a}
.gatebox h1{font-size:2.1rem;margin-bottom:4px}
.gatebox .sub{color:var(--mut);margin:0 0 18px}
.gatebox label{display:block;font-size:.95rem;color:var(--mut);margin:10px 0 4px}
.idcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#182052,#0b1133);border:1.5px solid var(--line2);border-radius:18px;padding:14px 18px}
.idcard .av{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6,var(--sun));display:grid;place-items:center;font-size:1.7rem}
.idcard .nm{font-family:var(--disp);font-size:1.3rem}

/* 홈 */
.hero{position:relative;overflow:hidden;border-radius:26px;border:1.5px solid var(--line);min-height:360px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;
 background:#0a0f2c url(img/solarsys2.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05081af5 0%,#05081ad9 48%,#05081a55 100%)}
.hero>div{position:relative;padding:44px 40px}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.2;text-shadow:0 0 30px #ffb13b33}
.hero .lead{color:var(--mut);font-size:1.12rem;max-width:36em;margin-top:10px}
.hero .log{font-family:var(--disp);color:var(--cyan);font-size:1rem;letter-spacing:.1em;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.flow span{background:#080c24cc;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.98rem}
.flow b{color:var(--sun)}
@media (max-width:860px){.hero{grid-template-columns:1fr;min-height:0}.hero>div{padding:28px 22px}}

/* 장 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chap{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:22px;padding:0;cursor:pointer;text-align:left;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;background:#0a0f2c center/cover no-repeat;transition:transform .15s,border-color .15s}
.chap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#05081a11 20%,#05081af0 75%)}
.chap>*{position:relative}
.chap .in{padding:18px 20px}
.chap:active{transform:scale(.98)}
.chap.doneAll{border-color:var(--green)}
.chap h3{font-size:1.4rem;margin:4px 0 2px}
.chap .k{font-family:var(--disp);color:var(--cyan);font-size:.92rem;letter-spacing:.12em}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:99px;background:#080c24;border:1px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.stamp{font-family:var(--disp);color:var(--green);border:2.5px solid var(--green);border-radius:10px;display:inline-block;padding:2px 14px;transform:rotate(-6deg);background:#06301d88}

/* ═════ 슬라이드 무대 ═════ */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--space0);
 background-image:radial-gradient(1200px 600px at 80% -10%,#1a2a6e55,transparent 60%),radial-gradient(1.4px 1.4px at 16% 26%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 16%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 88% 56%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 34% 82%,#fff5 50%,transparent 51%)}
.stg-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 8px}
.stg-top .ttl{font-family:var(--disp);font-size:1.1rem;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-top .num{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700;font-size:1.05rem}
.stg-top button{min-height:44px;padding:6px 14px}
.pbar{height:5px;background:#080c24}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));transition:width .35s}
.stg-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 28px 10px;display:flex}
.slide{margin:auto;width:100%;max-width:1560px}
.stg-nav{position:relative;display:flex;gap:12px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));align-items:center}
.stg-nav button{font-size:1.15rem;min-height:58px}
.stg-nav .prev{flex:0 0 160px}.stg-nav .next{flex:1;max-width:420px;margin-left:auto}
.stg-nav .hintkey{color:var(--dim);font-size:.85rem;flex:1;text-align:center}
@media (max-width:700px){.stg-nav .hintkey{display:none}.stg-nav .prev{flex:1}.stg-nav .next{max-width:none}.stg-body{padding:14px 16px 8px}}

/* 슬라이드 타이포 — 뷰포트 기준으로 크게 */
.s-kicker{font-family:var(--disp);color:var(--cyan);font-size:clamp(.95rem,1.2vw,1.15rem);letter-spacing:.14em;margin-bottom:6px}
.s-title{font-family:var(--disp);font-weight:900;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.25;margin:2px 0 16px}
.s-body{font-size:clamp(1.15rem,1.65vw,1.5rem);line-height:1.8}
.s-body b{color:var(--sun)} .s-body em{color:var(--cyan);font-style:normal;font-weight:700}
.s-body ul{padding-left:1.2em;margin:.4em 0} .s-body li{margin:.25em 0}
.s-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.s-grid.rev{grid-template-columns:.95fr 1.05fr}
@media (max-width:900px){.s-grid,.s-grid.rev{grid-template-columns:1fr;gap:16px}}
.key{background:#080c24;border:1.5px solid var(--line);border-left:6px solid var(--sun);border-radius:14px;padding:14px 20px;margin:16px 0;font-size:clamp(1.08rem,1.4vw,1.3rem)}
.key .kt{font-family:var(--disp);color:var(--sun);display:block;margin-bottom:2px;font-size:1.05em}
.fig{position:relative;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#000}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;background:linear-gradient(180deg,transparent,#000c);font-size:.95rem;color:#e8ecff}
.fig .cap b{color:var(--sun)}
.fig.tall{aspect-ratio:4/3}.fig.wide{aspect-ratio:16/9}.fig.sq{aspect-ratio:1}
.figs{display:grid;gap:12px}
.figs.c2{grid-template-columns:1fr 1fr}.figs.c3{grid-template-columns:1fr 1fr 1fr}.figs.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.figs.c3,.figs.c4{grid-template-columns:1fr 1fr}}
.figure{background:#080c24cc;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.figcap{color:var(--mut);font-size:.95rem;text-align:center;margin-top:8px}
svg text{font-family:var(--body)}

/* 행성 갤러리 */
.pgal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.pgal{grid-template-columns:1fr 1fr}}
.pcard{background:#080c24;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;min-height:0;display:block;transition:border-color .15s}
.pcard.on{border-color:var(--sun)}
.pcard .ph{aspect-ratio:1;background:#000 center/cover no-repeat}
.pcard .nm{font-family:var(--disp);font-size:clamp(1.1rem,1.5vw,1.4rem);padding:10px 14px 2px}
.pcard .ft{padding:0 14px 12px;font-size:clamp(.95rem,1.15vw,1.08rem);color:var(--mut);line-height:1.55}
.pcard .ft b{color:var(--sun)}

/* 히어로 */
.s-hero{text-align:center}
.s-hero .s-title{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.s-hero .s-sub{color:var(--mut);font-size:clamp(1.05rem,1.4vw,1.3rem);max-width:34em;margin:0 auto 10px}
.comms{display:inline-block;font-family:var(--disp);color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:4px 16px;font-size:.95rem;letter-spacing:.08em;margin-bottom:8px;background:#080c24aa}
.herogrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;text-align:left}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}

/* 퀴즈·피드백 */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--line2);margin:10px 0;font-size:clamp(1.1rem,1.5vw,1.35rem);padding:16px 20px;border-radius:16px}
.opt .n{font-family:var(--disp);color:var(--cyan);flex:0 0 auto}
.opt.ok{background:#0d3a2455;border-color:var(--green)}
.opt.no{background:#43182055;border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.opt.no{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.fb{border-radius:16px;padding:14px 18px;margin-top:14px;font-size:1.08rem}
.fb.ok{background:#0d3a2455;border:1.5px solid var(--green)}
.fb.no{background:#3a2a1055;border:1.5px solid var(--sun)}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{padding:4px 0}
.cklist .y::before{content:"✔ ";color:var(--green)} .cklist .n::before{content:"✦ ";color:var(--sun)}
.frame{background:#080c24;border:1.5px dashed var(--line2);border-radius:14px;padding:12px 16px;color:var(--mut);font-size:1.05rem;margin:10px 0}
.frame b{color:var(--cyan)}

/* 표 */
table.t{border-collapse:collapse;width:100%;font-size:clamp(1rem,1.25vw,1.15rem);font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:10px 12px;text-align:center}
table.t th{background:#080c24;color:var(--cyan);font-weight:700}
table.t td:first-child{color:var(--sun);font-weight:700;white-space:nowrap}
table.t .grpA{background:#5a3a0a99;color:#ffe0a8} table.t .grpB{background:#0e2f5a99;color:#cfe6ff}
.twrap{overflow-x:auto;margin:10px 0}

/* 인과 사슬 */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.chain .nd{flex:1 1 150px;background:var(--panel2);border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:1.05rem;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.chain .nd b{color:var(--sun);font-family:var(--disp)}
.chain .ar{align-self:center;color:var(--sun);font-size:1.5rem}

/* 공전 장면 */
.orbitbox{position:relative;width:min(80vw,520px);max-height:62vh;aspect-ratio:1;max-width:100%;margin:6px auto}
.orbit{position:absolute;border:1.5px dashed #3a4a9a66;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.spin{position:absolute;left:50%;top:50%;width:0;height:0}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 10px #0008}
.planet u{text-decoration:none}
.planet span{position:absolute;left:50%;top:-2em;transform:translateX(-50%);font-size:.9rem;color:var(--fg);background:#080c24dd;border:1px solid var(--line);border-radius:8px;padding:1px 8px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.planet.show span{opacity:1}
.sunCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#fff3c4,#ffb13b 55%,#ff7a1a);box-shadow:0 0 36px 10px #ffb13b66,0 0 90px 30px #ff7a1a22}
.beltdot{position:absolute;width:3px;height:3px;border-radius:50%;background:#c9b08a;transform:translate(-50%,-50%)}

/* 태양 클로즈업 */
.sunstage{position:relative;width:min(80vw,520px);margin:4px auto}
@media (prefers-reduced-motion:no-preference){
 .corona{animation:pulse 4.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 .flareA{animation:flick 2.6s ease-in-out infinite}@keyframes flick{0%,100%{opacity:.35}45%{opacity:1}}
}
.pin{font-size:15px;fill:#f3f5ff}

/* 격납고 게임 */
.hangars{display:flex;gap:12px;margin-top:14px}
.hangar{flex:1;border:2px solid var(--line2);border-radius:18px;padding:12px;min-height:110px;text-align:center}
.hangar h4{font-family:var(--disp);font-size:1.15rem;margin:0 0 6px}
.hangar.rock{border-color:#d08f5a} .hangar.gas{border-color:var(--cyan)}
.hangar .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hangar .got span{background:#080c24;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:.95rem}
.qPlanet{text-align:center;margin:8px 0}
.qPlanet .ball{display:inline-block;border-radius:50%;box-shadow:0 0 30px #000a;background:#000 center/cover}
.qPlanet .nm{font-family:var(--disp);font-size:1.6rem;display:block;margin-top:8px}
.binbtns{display:flex;gap:12px;margin-top:10px}
.binbtns button{flex:1;font-size:1.15rem;min-height:62px}

/* 시뮬레이터 */
.sim{border:1.5px solid var(--line);border-radius:20px;background:#080c24d9;padding:18px;text-align:left}
.simrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center}
.simsun{position:relative;width:130px;height:130px;border-radius:50%;flex:0 0 auto;overflow:hidden;
 background:radial-gradient(circle at 38% 34%,#fff3c4,#ffb13b 55%,#ff7a1a);box-shadow:0 0 12px 4px #ffb13b66;transition:box-shadow .3s}
.simsun i{position:absolute;border-radius:50%;background:#5a2d00}
.windlane{position:relative;flex:1;min-width:160px;height:64px;overflow:hidden}
.wp{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:var(--cyan);opacity:.9}
@media (prefers-reduced-motion:no-preference){.wp{animation:fly linear infinite}@keyframes fly{from{transform:translateX(-10px)}to{transform:translateX(560px)}}}
.earthdot{width:80px;height:80px;border-radius:50%;flex:0 0 auto;position:relative;background:url(img/earth.jpg) center/cover;box-shadow:0 0 18px #2a6fd666}
.aur{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:94px;height:30px;border-radius:50%;
 background:linear-gradient(90deg,transparent,var(--green),var(--cyan),var(--violet),transparent);filter:blur(5px);opacity:.15;transition:opacity .3s,height .3s}
.lamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.lamp{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:1rem;transition:border-color .3s}
.lamp .st{display:block;font-weight:900;margin-top:2px}
.lamp.good{border-color:var(--green)} .lamp.good .st{color:var(--green)}
.lamp.warnL{border-color:var(--sun)} .lamp.warnL .st{color:var(--sun)}
.lamp.badL{border-color:var(--red)} .lamp.badL .st{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--sun);height:40px}
.simread{font-family:var(--disp);text-align:center;font-size:1.3rem;margin-top:8px}
.simread b{color:var(--sun)}

/* 비유 */
.metaphor{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.metaphor .m{text-align:center;flex:1 1 150px;max-width:240px}
.metaphor .shape{margin:0 auto;border-radius:50%}
.metaphor .lb{margin-top:8px;font-size:1.05rem}
.metaphor .lb b{color:var(--sun)}

/* 수배 파일 */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.wanted{position:relative;border:2px solid var(--line2);border-radius:20px;padding:18px;background:linear-gradient(170deg,var(--panel),#080c24)}
.wanted::before{content:"CASE FILE";position:absolute;right:16px;top:-12px;font-family:var(--disp);font-size:.8rem;letter-spacing:.2em;color:var(--dim);background:var(--space0);padding:0 8px}
.wanted.solved{border-color:var(--green)}
.clue{background:#080c24;border:1.5px dashed var(--line2);border-radius:14px;padding:12px 16px;font-size:1.1rem;margin:10px 0}
.wphoto{aspect-ratio:16/9;border-radius:14px;background:#000 center/cover;border:1.5px solid var(--line);filter:blur(0)}
.wphoto.hid{filter:blur(14px) brightness(.6)}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wopts .opt{margin:0;padding:12px 14px;font-size:1.05rem}

/* 시험 */
.exam-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:1000px){.exam-wrap{grid-template-columns:1fr}}
.doc{background:#fdfbf4;color:#1a1a1a;border-radius:16px;padding:22px 24px;font-size:1.05rem;line-height:1.75;box-shadow:inset 0 0 0 1px #d8d2bc}
.doc h4{font-family:var(--disp);margin:0 0 8px;color:#2a1f0a;font-size:1.2rem}
.doc table.t th{background:#efe9d6;color:#2a1f0a} .doc table.t td,.doc table.t th{border-color:#cfc7ad} .doc table.t td:first-child{color:#8a4b00}
.doc .news{border-left:6px solid #8a4b00;background:#f4eedc;border-radius:10px;padding:10px 14px;margin:10px 0}
.doc .src{color:#6b5d3a;font-size:.9rem}
.exam-steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.exam-steps button{min-height:46px;padding:6px 16px;font-size:1rem}
.exam-steps button.on{background:var(--sun);color:#2a1500;font-weight:900}
.news{border-left:6px solid var(--violet);background:#151040;border-radius:12px;padding:12px 16px;margin:10px 0;font-size:1.08rem}
.news .src{color:var(--mut);font-size:.9rem}

/* 센터장 */
.sec{border:1.5px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.sec>button{width:100%;text-align:left;background:var(--panel2);border:0;border-radius:0;font-size:1.08rem;font-weight:700}
.sec>div{padding:14px 18px;background:#080c24}
.codebox{background:#04071a;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;word-break:break-all;max-height:160px;overflow:auto;user-select:all;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
table.r{border-collapse:collapse;width:100%;font-size:1rem;font-variant-numeric:tabular-nums}
table.r th,table.r td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
table.r th{color:var(--cyan);font-weight:700;background:#080c24;position:sticky;top:0}
table.r tr.sel td{background:#182052}
table.r td.c{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;border:1px solid var(--line2);color:var(--mut)}
.pill.g{border-color:var(--green);color:var(--green)} .pill.w{border-color:var(--sun);color:var(--sun)}
.badgerow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.badge{background:#080c24;border:1.5px solid var(--line);border-radius:12px;padding:7px 13px;font-size:1rem}
.badge.on{border-color:var(--sun);color:var(--sun);box-shadow:0 0 14px #ffb13b22}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 44px;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--sun);color:#2a1500;font-weight:900;display:grid;place-items:center}
.vid{aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;padding:13px 24px;border-radius:99px;box-shadow:0 8px 28px #000a;z-index:60;transition:opacity .3s;font-size:1.05rem}
body.deckmode .toast{bottom:110px}
@media (max-width:460px){body{font-size:16.5px}.card{padding:18px 16px}.wrap{padding:14px 14px 112px}}
[hidden]{display:none!important}
</style>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   ① 서버 주소 — Apps Script 웹 앱 URL(…/exec)을 따옴표 안에 붙여넣기.
      비워 두면 기록이 이 기기에만 저장됩니다.
   ═══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbxff1XqN2m3VXguyrJALyGJUgqgJuo7JXab0nlFm9p-o_cLQm1qVm5fP-3-b1ZjiBRSkQ/exec';
const LOCAL_TEACHER_CODE = '0726';   // 서버가 없을 때만 쓰는 임시 센터장 코드

/* ───────── 서버 통신 (힘탐정과 같은 방식: 읽기 JSONP, 쓰기 POST) ───────── */
let seq=0;
function call(params){ return new Promise((done,fail)=>{
  if(!API) return fail('서버 미설정');
  const cb='cb_'+(++seq)+'_'+Date.now(); let s;
  const timer=setTimeout(()=>{clean();fail('시간 초과');},20000);
  function clean(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s);}
  window[cb]=res=>{clean(); if(res&&res.ok)done(res); else fail((res&&res.error)||'오류');};
  const q=['callback='+cb]; for(const k in params){ if(params[k]==null)continue; q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  s=document.createElement('script'); s.src=API+'?'+q.join('&'); s.onerror=()=>{clean();fail('연결 실패');}; document.head.appendChild(s);
});}
function post(params){ if(!API) return Promise.reject('서버 미설정');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)})
   .then(r=>r.json()).then(res=>{ if(res&&res.ok)return res; throw (res&&res.error)||'오류'; }); }

/* ───────── 상태 ───────── */
const LS="araho_v2", LS_ME="araho_me";
const SESSION_VER=3; // 입장 방식이 바뀌면 올려서 저장된 세션을 무효화
let me=null; try{me=JSON.parse(localStorage.getItem(LS_ME)||'null'); if(me&&me.ver!==SESSION_VER)me=null;}catch(e){}
let S=freshState();
function freshState(){return {pts:0,seen:{},quiz:{},writes:{},wanted:{},exam:{},slide:{}};}
function loadLocal(){try{const j=localStorage.getItem(LS+'_'+(me?me.cls+'_'+me.num:'x')); if(j)S={...freshState(),...JSON.parse(j)};}catch(e){}}
let saveTimer=null, syncState='off';
function save(){
  try{localStorage.setItem(LS+'_'+(me?me.cls+'_'+me.num:'x'),JSON.stringify(S));}catch(e){}
  drawHud();
  if(API&&me){ clearTimeout(saveTimer); setSync('pending'); saveTimer=setTimeout(()=>{
    post({action:'save',...me,pts:S.pts,rank:rank().r,prog:CH.map(c=>{const p=chapProg(c);return p.d+'/'+p.total;}).join(' '),state:JSON.stringify(S)})
     .then(()=>setSync('on')).catch(()=>setSync('err')); },1500); }
}
function setSync(s){syncState=s;const el=document.querySelector('.hud .sync');if(el){el.className='sync '+(s==='on'?'on':'');el.textContent=s==='on'?'● 센터장 시트에 저장됨':s==='pending'?'○ 저장 중…':s==='err'?'! 저장 실패(다시 시도 중)':API?'○ 연결 대기':'기기에만 저장';}}
function logSrv(type,item,text,score,ai){ if(API&&me) post({action:'log',...me,type,item,text,score,ai}).catch(()=>{}); }
function addPts(n){const b=S.pts;S.pts+=n;save();toast("+"+n+"점!");checkUnlock(b,S.pts);}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400);},1500);}
/* 등급: 우주 비행사 경력 순서 */
const RANKS=[[0,"지상 훈련생"],[40,"우주 비행 후보생"],[100,"우주 비행사"],[170,"미션 스페셜리스트"],[240,"커맨더"]];
function rank(){let r=RANKS[0][1],next=RANKS[1]||null;for(let i=0;i<RANKS.length;i++){if(S.pts>=RANKS[i][0]){r=RANKS[i][1];next=RANKS[i+1]||null;}}return{r,next};}
/* 장비: 점수를 모으면 우주복이 한 점씩 갖춰진다 */
const ITEMS=[
 {k:"gloves",at:15,n:"장갑·부츠",e:"🧤",d:"지상 훈련 통과 기념. 손끝이 따뜻해졌다."},
 {k:"suit",at:30,n:"우주복",e:"👨‍🚀",d:"고천 관제센터 지급품. 색은 네가 고른다."},
 {k:"helmet",at:50,n:"헬멧",e:"🪖",d:"이제 선외 활동(EVA) 자격이 생겼다."},
 {k:"pack",at:75,n:"생명유지 배낭",e:"🎒",d:"산소·물·냉각수. 8시간 버틸 수 있다."},
 {k:"jet",at:100,n:"제트팩",e:"🚀",d:"우주 공간에서 방향을 바꾸는 추진 장치."},
 {k:"patch",at:130,n:"고천 미션 패치",e:"🏷️",d:"고천중 관제센터 공식 패치. 가슴에 단다."},
 {k:"robot",at:165,n:"반려 로봇 '아라'",e:"🤖",d:"아라호가 보내준 작은 친구. 계산이 빠르다."},
 {k:"visor",at:200,n:"황금 바이저",e:"✨",d:"태양빛을 막는 금 코팅. 베테랑의 상징."},
 {k:"cmd",at:240,n:"커맨더 견장",e:"👑",d:"임무 전체를 지휘하는 자의 표식."}];
const have=(k)=>{const it=ITEMS.find(i=>i.k===k);return it&&S.pts>=it.at;};
const SUITS={white:["#eef1ff","#c9d0ea"],orange:["#ff9a3c","#d9741b"],blue:["#6fb6ff","#3b7fd8"],mint:["#8df0d2","#4cc7a6"]};
function astronautSVG(pts,suit,size){
  const p=pts==null?S.pts:pts; const H=(k)=>{const it=ITEMS.find(i=>i.k===k);return it&&p>=it.at;};
  const [c1,c2]=SUITS[suit||S.suit||"white"]||SUITS.white; const sz=size||200;
  const suitOn=H("suit"); const body=suitOn?c1:"#5b6b9a", bodyD=suitOn?c2:"#3f4c74";
  return `<svg viewBox="0 0 200 240" width="${sz}" height="${sz*1.2}" style="display:block;max-width:100%;height:auto">
  ${H("jet")?`<g><rect x="52" y="110" width="22" height="60" rx="8" fill="#8891b8"/><rect x="126" y="110" width="22" height="60" rx="8" fill="#8891b8"/><path d="M57 170 q6 22 12 0z" fill="#ffb13b"><animate attributeName="d" values="M57 170 q6 22 12 0z;M57 170 q6 34 12 0z;M57 170 q6 22 12 0z" dur="0.5s" repeatCount="indefinite"/></path><path d="M131 170 q6 22 12 0z" fill="#ffb13b"><animate attributeName="d" values="M131 170 q6 30 12 0z;M131 170 q6 18 12 0z;M131 170 q6 30 12 0z" dur="0.45s" repeatCount="indefinite"/></path></g>`:""}
  ${H("pack")?`<rect x="58" y="95" width="84" height="80" rx="16" fill="#9aa4cf" stroke="#6d78b3" stroke-width="3"/><rect x="92" y="100" width="16" height="70" rx="6" fill="#7f8ab8"/>`:""}
  <!-- 다리 -->
  <rect x="72" y="160" width="24" height="48" rx="10" fill="${body}"/><rect x="104" y="160" width="24" height="48" rx="10" fill="${body}"/>
  <rect x="68" y="200" width="32" height="20" rx="8" fill="${H("gloves")?"#2d3561":"#8891b8"}"/><rect x="100" y="200" width="32" height="20" rx="8" fill="${H("gloves")?"#2d3561":"#8891b8"}"/>
  <!-- 몸통 -->
  <rect x="58" y="92" width="84" height="84" rx="26" fill="${body}" stroke="${bodyD}" stroke-width="3"/>
  ${suitOn?`<rect x="78" y="120" width="44" height="34" rx="8" fill="${bodyD}" opacity=".55"/><circle cx="88" cy="130" r="4" fill="#3fe6a6"/><circle cx="100" cy="130" r="4" fill="#ffb13b"/><circle cx="112" cy="130" r="4" fill="#5fe3ff"/>`:`<path d="M80 100 h40 v12 h-40z" fill="#3f4c74"/>`}
  ${H("patch")?`<circle cx="124" cy="110" r="10" fill="#0a0f2c" stroke="#ffb13b" stroke-width="2.5"/><text x="124" y="114" text-anchor="middle" font-size="9" fill="#ffb13b" font-weight="700">고천</text>`:""}
  <!-- 팔 -->
  <rect x="34" y="98" width="26" height="62" rx="12" fill="${body}" stroke="${bodyD}" stroke-width="3" transform="rotate(12 47 98)"/><rect x="140" y="98" width="26" height="62" rx="12" fill="${body}" stroke="${bodyD}" stroke-width="3" transform="rotate(-12 153 98)"/>
  <circle cx="40" cy="162" r="12" fill="${H("gloves")?"#2d3561":"#f1c9a5"}"/><circle cx="160" cy="162" r="12" fill="${H("gloves")?"#2d3561":"#f1c9a5"}"/>
  ${H("cmd")?`<rect x="60" y="94" width="22" height="9" rx="3" fill="#ffd166"/><rect x="118" y="94" width="22" height="9" rx="3" fill="#ffd166"/>`:""}
  <!-- 머리 -->
  <circle cx="100" cy="60" r="34" fill="#f1c9a5"/><path d="M68 54 q6 -30 32 -30 q26 0 32 30 q-10 -14 -32 -14 q-22 0 -32 14z" fill="#3b2a22"/>
  <circle cx="88" cy="62" r="3.2" fill="#2a1f1a"/><circle cx="112" cy="62" r="3.2" fill="#2a1f1a"/><path d="M90 76 q10 8 20 0" stroke="#b05a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  ${H("helmet")?`<circle cx="100" cy="60" r="44" fill="${H("visor")?"#ffd166":"#bfe8ff"}" opacity="${H("visor")?".55":".28"}" stroke="#e6ecff" stroke-width="4"/><path d="M66 48 q34 -30 68 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`:""}
  ${H("robot")?`<g><rect x="4" y="150" width="30" height="34" rx="8" fill="#9aa4cf" stroke="#5fe3ff" stroke-width="2"/><circle cx="13" cy="164" r="3" fill="#5fe3ff"/><circle cx="25" cy="164" r="3" fill="#5fe3ff"/><rect x="12" y="174" width="14" height="3" rx="1.5" fill="#0a0f2c"/><line x1="19" y1="150" x2="19" y2="140" stroke="#5fe3ff" stroke-width="2"/><circle cx="19" cy="138" r="3" fill="#ffb13b"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle></g>`:""}
  </svg>`;
}
function checkUnlock(before,after){ITEMS.forEach(it=>{if(before<it.at&&after>=it.at)setTimeout(()=>toast(`${it.e} 장비 획득: ${it.n}!`),600);});
  const rb=RANKS.filter(r=>before>=r[0]).length,ra=RANKS.filter(r=>after>=r[0]).length; if(ra>rb)setTimeout(()=>toast(`🎖️ 승급! ${RANKS[ra-1][1]}`),1400);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const IMG=(n,cap,cls)=>`<div class="fig ${cls||'tall'}"><img src="img/${n}.jpg" alt="${esc(cap||n)}" loading="lazy">${cap?`<div class="cap">${cap}</div>`:""}</div>`;

/* ───────── 서술 점검 ───────── */
const LINKS=/(때문|따라서|그러므로|왜냐하면|그래서|이므로|으므로)/;
const COMPARE=/(반면|비해|보다|많고|적고|크고|작고|높고|낮고|달리)/;
function checkWrite(text,spec){
  const t=(text||"").trim(); const msgs=[]; let got=0,need=0;
  need++; if(t.length>=spec.min){got++;msgs.push({y:1,m:`길이 충분 (${t.length}자)`});}else msgs.push({y:0,m:`조금 더 길게! 최소 ${spec.min}자 (지금 ${t.length}자)`});
  (spec.groups||[]).forEach(g=>{need++;const hit=g.words.some(w=>t.includes(w));
    if(hit){got++;msgs.push({y:1,m:`핵심어 포함: ${g.name}`});}else msgs.push({y:0,m:`이 내용이 보이지 않아요 → ${g.name}`});});
  if(spec.compare){need++;if(COMPARE.test(t)){got++;msgs.push({y:1,m:"비교 표현 사용 (…보다, 반면 등)"});}else msgs.push({y:0,m:"두 대상을 '…보다/반면'처럼 직접 비교해 보세요"});}
  if(spec.link!==false){need++;if(LINKS.test(t)){got++;msgs.push({y:1,m:"이유·결론 연결어 사용 (때문에, 따라서 등)"});}else msgs.push({y:0,m:"'왜냐하면 ~ 때문이다', '따라서 ~'로 근거와 주장을 이어 보세요"});}
  return {pass:got>=need, got, need, msgs};
}
function fbHTML(r){return `<div class="fb ${r.pass?'ok':'no'}"><b>${r.pass?'✅ 통과! 논리가 잘 이어졌어요.':'🛰️ 관제센터 점검 '+r.got+'/'+r.need}</b><ul class="cklist">${r.msgs.map(m=>`<li class="${m.y?'y':'n'}">${esc(m.m)}</li>`).join("")}</ul>${r.pass?'':'<div class="small">✦ 표시만 고쳐서 다시 점검해 보세요. 고칠수록 좋아지는 게 진짜 글쓰기!</div>'}</div>`;}
let AI_ON=false;
function showAI(){document.querySelectorAll(".aibtn").forEach(b=>b.hidden=!AI_ON);}
async function aiFeedback(item,rubric,textGetter,outEl,score){
  const t=textGetter(); if(!t.trim()){outEl.innerHTML='<div class="fb no">먼저 글을 써 주세요!</div>';return;}
  outEl.innerHTML='<div class="fb no">🤖 AI 코치가 읽는 중… (10초쯤 걸려요)</div>';
  try{
    const res=await post({action:'feedback',...(me||{}),item,rubric,text:t,score:score||''});
    const fb=res.fb||{};
    outEl.innerHTML=`<div class="fb ok"><b>🤖 AI 코치 (수준: ${esc(fb.level||"-")})</b>

function bindSim(root){

  const lamps=[1,2,3,4].map(i=>root.querySelector("#lp"+i));

  function upd(){const v=+r.value,n=Math.round(1+v/11);
    sun.innerHTML=Array.from({length:n},(_,i)=>{const a=(i*137)%360,d=16+(i*29)%36;return `<i style="left:${(58+d*Math.cos(a*Math.PI/180)*0.9).toFixed(0)}px;top:${(58+d*Math.sin(a*Math.PI/180)*0.9).toFixed(0)}px;width:${6+(i%3)*3}px;height:${5+(i%3)*2}px"></i>`;}).join("");

    if(v<34){setLamp(lamps[0],"good","극지방에서 가끔");setLamp(lamps[1],"good","정상");setLamp(lamps[2],"good","정상");setLamp(lamps[3],"good","정상");}

  r.oninput=upd; upd();
}

 {t:"learn",h:"위성 — 행성의 단짝",figs:[["moon","지구의 위성 <b>달</b>"],["titan","토성의 위성 <b>타이탄</b> (두꺼운 대기)"]],b:`<p><b>위성</b>은 <em>행성 주위를 공전</em>하는 천체. 지구의 위성은 <b>달</b> 하나뿐이지만, 목성형 행성들은 수십 개씩 거느려요.</p><div class="key"><span class="kt">함정 주의</span>위성은 태양이 아니라 <b>행성</b> 주위를 돌아요. 하지만 그 행성이 태양을 돌기 때문에 — <b>위성도 당당한 태양계 구성원!</b></div>`},
 {t:"learn",h:"소행성과 혜성",figs:[["asteroid","<b>소행성</b> — 작고 울퉁불퉁한 암석 덩어리"],["comet","<b>혜성</b> 67P — 얼음·먼지에서 가스가 뿜어져 나온다"]],b:`<ul><li><b>소행성</b> — 작고 불규칙한 <em>암석</em> 천체. 주로 <b>화성과 목성 사이</b> '소행성대'에서 태양 주위를 공전</li><li><b>혜성</b> — <em>얼음과 먼지</em> 덩어리. <b>길쭉한 궤도</b>로 태양 주위를 공전</li></ul><div class="key"><span class="kt">혜성의 꼬리</span>태양에 <b>가까워지면</b> 얼음이 녹아 꼬리가 생기고, 꼬리는 항상 <em>태양 반대쪽</em>을 향해요.</div>`},
 {t:"learn",h:"왜소 행성 — 행성이 되지 못한 이유",img:"pluto",cap:"<b>명왕성</b> — 2006년 행성에서 왜소 행성으로 (뉴허라이즌스 촬영)",b:`<p>명왕성, 세레스 같은 <b>왜소 행성</b>은 태양 주위를 공전하고 모양도 둥글어요. 그런데 왜 행성이 아닐까요?</p><div class="key"><span class="kt">차이점</span>자기 <b>궤도 주변의 천체들을 흡수하지 못해</b> 궤도가 깨끗하지 않기 때문. 그래도 태양을 도니까 <b>태양계 구성원</b>이에요.</div>`},

 {t:"write",key:"w_c1",h:"관제 일지 · 한 줄 논술",img:"comet",prompt:`우주 신문에 <b>"행성이 아닌 혜성은 태양계 구성원이 아니다"</b>라는 기사가 실렸어요. 이 기사가 잘못된 까닭을 한두 문장으로 반박해 보세요.`,frame:"혜성은 행성은 아니지만 <b>______을/를 공전</b>하기 때문에 <b>______</b>이다.",spec:{min:25,groups:[{name:"'공전'이라는 말",words:["공전","주위를 돌","주위를 도는","태양 주위"]},{name:"'태양계 구성원'이라는 판단",words:["구성원","태양계에 포함","태양계이다","태양계에 속"]}]},ai:"평가 요소: ① 혜성이 태양 주위를 공전한다는 사실을 근거로 들었는가 ② 그러므로 (행성이 아니어도) 태양계 구성원이라고 판단했는가 ③ 신문 기사가 틀렸다고 분명히 말했는가. 수준: 상=①②③ 모두, 근거→결론 연결어 사용 / 중=판단은 맞으나 공전 근거가 없거나 흐릿함 / 하=판단이 틀리거나 근거 없음. 중1 범위: 태양계=태양+태양 주위를 공전하는 천체."},

function slideDone(c,sl,idx){const k=c.id+"_"+idx;
 if(sl.t==="learn"||sl.t==="hero"||sl.t==="clear")return !!S.seen[k];
 if(sl.t==="quiz"||sl.t==="game2")return !!S.quiz[k];

 try{const r=await call({action:'logs',pin:TPIN,cls:x.cls,num:x.num}); const rows=r.rows||[];
   document.getElementById("tlogs").innerHTML=`<div class="sec"><button data-sec>▶ 전체 이력 ${rows.length}건 (시간순, AI 피드백 포함)</button><div hidden>${rows.map(l=>{let fb=null;try{fb=l.aifb?JSON.parse(l.aifb):null;}catch(e){}
     return `<div class="frame" style="color:var(--fg)"><span class="small">${esc((l.t||'').slice(5,16).replace('T',' '))}</span> <b style="color:var(--sun)">${esc(l.type)}</b> ${esc(l.item)} <span class="pill">${esc(l.score||'')}</span> ${l.ai?`<span class="pill g">AI ${esc(l.ai)}</span>`:''}<br>${esc(l.text)}${fb?`<div class="small" style="margin-top:6px">🤖 ${esc((fb.good||[]).join(' / '))} · ✦ ${esc((fb.improve||[]).join(' / '))}</div>`:''}</div>`;}).join("")||'<p class="small">없음</p>'}</div></div>`;
   bindSec(document.getElementById("tlogs"));
 }catch(e){document.getElementById("tlogs").innerHTML=`<p class="small">이력 불러오기 실패: ${esc(e)}</p>`;}
}
function localRecordHTML(){const w=Object.entries(S.writes||{}),e=Object.entries(S.exam||{});
 return `<p>${esc(me?me.name:'')} · ⭐${S.pts} · ${rank().r}</p>${w.map(([k,v])=>`<div class="frame" style="color:var(--fg)"><b style="color:var(--sun)">${esc(k)}</b> ${v.ok?'통과':'연습 중'}<br>${esc(v.t)}</div>`).join("")}${e.map(([n,v])=>`<div class="frame" style="color:var(--fg)"><b style="color:var(--sun)">문항 ${n}</b> ${esc(v.g)}<br>${esc(v.t)}</div>`).join("")}`;}


/* ═══════ 교신 — 질문 게시판 (질문=교신, 답=응답) ═══════ */
const LSC="araho_comms_local";
function localComms(){try{return JSON.parse(localStorage.getItem(LSC)||"[]");}catch(e){return [];}}
function saveLocalComms(a){try{localStorage.setItem(LSC,JSON.stringify(a.slice(0,300)));}catch(e){}}
async function commsList(f){
  if(API){const r=await call({action:'qlist',cls:f.cls||'',num:me?me.num:'',mission:f.mission||''});return r.rows;}
  let rows=localComms(); if(f.mission)rows=rows.filter(x=>x.mission===f.mission); return rows.map(x=>({...x,mine:me&&x.cls===me.cls&&x.num===me.num}));
}
async function commsAdd(o){
  if(API){return post({action:'qadd',...me,...o});}
  const rows=localComms(); rows.unshift({id:'l'+Date.now(),t:new Date().toISOString(),cls:me.cls,num:o.anon==='1'?'':me.num,name:o.anon==='1'?'익명 승무원':me.name,mission:o.mission,phase:o.phase,text:o.text,answers:[]}); saveLocalComms(rows); return {ok:true};
}
async function commsAnswer(qid,text){
  const teacher=(me&&me.cls==="T")?'1':'';
  if(API){return post({action:'qanswer',...me,qid,text,teacher});}
  const rows=localComms(); const q=rows.find(x=>x.id===qid); if(q){q.answers.push({t:new Date().toISOString(),name:me.name,text,teacher:!!teacher});saveLocalComms(rows);} return {ok:true};
}
const PHASES=["출발 전","귀환 후"];
function commsComposeHTML(mission,phase,opts){
  opts=opts||{};
  const pick=opts.pick?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px"><select id="cmM" style="width:auto;padding:8px 12px">${CH.map(c=>`<option value="${c.no}" ${mission===c.no?'selected':''}>${c.no} ${c.title}</option>`).join("")}</select><select id="cmP" style="width:auto;padding:8px 12px">${PHASES.map(x=>`<option ${phase===x?'selected':''}>${x}</option>`).join("")}</select></div>`:"";
  return `<div class="card" style="margin:${opts.compact?'10px 0 0':'0 0 16px'}"><h3 style="font-size:1.25rem">📡 ${opts.pick?"새 교신 보내기":phase+" 교신 보내기"} ${opts.pick?"":`<span class="small">— ${mission}</span>`}</h3>
   <p class="small">${phase==="귀환 후"?"임무를 마치고 나서 새로 생긴 질문, 아직도 헷갈리는 것, 더 알고 싶은 것.":"이 주제에서 가장 궁금한 것 하나. 답을 모르는 질문일수록 좋은 교신입니다."}</p>${pick}
   <textarea id="cmText" style="min-height:90px" placeholder="예) 혜성 꼬리는 왜 항상 태양 반대쪽을 향할까?"></textarea>
   <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cmAnon" style="width:20px;height:20px"> 익명으로 보내기</label>
   <button class="btn-p" id="cmSend" style="margin-left:auto">교신 발신 (+3점)</button></div><div id="cmMsg"></div></div>`;
}
function bindCompose(root,mission,phase,after){
  const b=root.querySelector("#cmSend"); if(!b)return;
  b.onclick=async()=>{const t=root.querySelector("#cmText").value.trim(); const m=root.querySelector("#cmMsg");
    const ms=root.querySelector("#cmM"),ps=root.querySelector("#cmP"); const mi=ms?ms.value:mission, ph=ps?ps.value:phase;
    if(t.length<5){m.innerHTML='<div class="fb no">질문을 조금 더 자세히 적어 주세요 (5자 이상).</div>';return;}
    b.disabled=true;b.textContent="발신 중…";
    try{await commsAdd({mission:mi,phase:ph,text:t,anon:root.querySelector("#cmAnon").checked?'1':'0'});
      const key="q_"+mi+"_"+ph; S.comms=S.comms||{}; const first=!S.comms[key]; S.comms[key]=(S.comms[key]||0)+1;
      if(first)addPts(3); else save(); root.querySelector("#cmText").value="";
      m.innerHTML='<div class="fb ok"><b>📡 교신 수신 완료.</b> 다른 승무원과 센터장이 응답할 거예요. 교신 탭에서 확인!</div>'; if(after)after();}
    catch(e){m.innerHTML='<div class="fb no">발신 실패: '+esc(e)+'</div>';}
    b.disabled=false;b.textContent="교신 발신 (+3점)";};
}
let CM={mission:"",mine:false,noans:false};
function renderComms(){
  app.innerHTML=`${hudBlock()}<h2 style="margin:18px 4px 4px;font-size:1.9rem">📡 교신 채널</h2>
  <p class="small" style="margin:0 4px 10px">승무원들의 질문(교신)과 응답이 모이는 곳. 모르는 질문에 답해 보는 것도 훌륭한 훈련 — 응답 1건에 +2점.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
   <select id="cmMission" style="width:auto;padding:8px 12px"><option value="">모든 미션</option>${CH.map(c=>`<option value="${c.no}" ${CM.mission===c.no?'selected':''}>${c.no} ${c.title}</option>`).join("")}</select>
   <button class="btn-g" id="cmMine" style="min-height:44px;${CM.mine?'border-color:var(--sun);color:var(--sun)':''}">내 교신만</button>
   <button class="btn-g" id="cmNoans" style="min-height:44px;${CM.noans?'border-color:var(--sun);color:var(--sun)':''}">응답 없는 교신</button>
   <button class="btn-s" id="cmReload" style="min-height:44px;margin-left:auto">새로고침</button></div>
  <div class="row2"><div id="cmList"><p class="small">불러오는 중…</p></div><div id="cmCompose">${commsComposeHTML(CM.mission||CH[0].no,"출발 전",{pick:true})}
   ${API?"":'<div class="fb no">서버 미연결: 교신이 이 기기에만 저장됩니다. 센터장이 시트를 연결하면 학급 전체가 함께 봅니다.</div>'}</div></div>`;
  drawHud();
  bindCompose(app.querySelector("#cmCompose"),CM.mission||CH[0].no,"출발 전",loadComms);
  app.querySelector("#cmMission").onchange=e=>{CM.mission=e.target.value;render();};
  app.querySelector("#cmMine").onclick=()=>{CM.mine=!CM.mine;render();}; app.querySelector("#cmNoans").onclick=()=>{CM.noans=!CM.noans;render();};
  app.querySelector("#cmReload").onclick=loadComms;
  loadComms();
}
async function loadComms(){
  const L=document.getElementById("cmList"); if(!L)return;
  try{let rows=await commsList({cls:"",mission:CM.mission});
    if(CM.mine)rows=rows.filter(r=>r.mine); if(CM.noans)rows=rows.filter(r=>!(r.answers||[]).length);
    if(!rows.length){L.innerHTML='<div class="card"><p class="small">아직 교신이 없어요. 첫 교신을 보내 보세요!</p></div>';return;}
    L.innerHTML=rows.map(r=>`<div class="card" style="margin:0 0 12px" data-q="${esc(r.id)}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">${esc(r.mission)}</span><span class="tag">${esc(r.phase)}</span><span class="small">${esc(r.cls)}반 ${esc(r.name)} · ${esc((r.t||'').slice(5,16).replace('T',' '))}</span>${r.mine?'<span class="pill w">내 교신</span>':''}</div>
      <p class="s-body" style="font-size:1.15rem;margin:8px 0">❓ ${esc(r.text)}</p>
      ${(r.answers||[]).map(a=>`<div class="frame" style="color:var(--fg);${a.teacher?'border-color:var(--sun);border-style:solid':''}"><b style="color:${a.teacher?'var(--sun)':'var(--cyan)'}">${a.teacher?'🎖️ 센터장':'💬 '+esc(a.name)}</b> <span class="small">${esc((a.t||'').slice(5,16).replace('T',' '))}</span><br>${esc(a.text)}</div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:8px"><input type="text" class="ansIn" placeholder="응답 쓰기 — 아는 만큼, 근거와 함께" style="flex:1"><button class="btn-s ansBtn" style="min-height:48px">응답</button></div></div>`).join("");
    L.querySelectorAll(".ansBtn").forEach(b=>b.onclick=async()=>{const card=b.closest("[data-q]"),inp=card.querySelector(".ansIn"),t=inp.value.trim(); if(t.length<2)return toast("응답을 적어 주세요");
      b.disabled=true; try{await commsAnswer(card.dataset.q,t); S.comms=S.comms||{}; S.comms.ans=(S.comms.ans||0)+1; if(S.comms.ans<=15)addPts(2); else save(); loadComms();}catch(e){toast("응답 실패: "+e);b.disabled=false;}});
  }catch(e){L.innerHTML=`<div class="fb no">교신 채널 연결 실패: ${esc(e)}</div>`;}
}

/* ═══════ 내비 ═══════ */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;deck=null;render();});
document.addEventListener("keydown",e=>{if(!deck)return;if(e.target.closest("textarea,input"))return;
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();const n=stage.querySelector("#next");if(n)n.click();}
 if(e.key==="ArrowLeft"){e.preventDefault();const p=stage.querySelector("#prev");if(p&&!p.disabled)p.click();}
 if(e.key==="Escape"){deck=null;view="learn";render();}});
(function(){const h=(location.hash||"").replace("#","");const m=h.match(/^(c[1-5])s(\d+)$/);
 if(m){const ci=CH.findIndex(c=>c.id===m[1]);if(ci>=0){deck={ch:ci,i:Math.min(+m[2]-1,CH[ci].slides.length-1)};view="learn";}}
 else if(["home","learn","wanted","exam","comms","teacher"].includes(h))view=h;})();
if(me){loadLocal(); if(API){call({action:'ping'}).then(r=>{AI_ON=!!r.ai;setSync('on');showAI();}).catch(()=>setSync('err'));}}
render();
</script>
