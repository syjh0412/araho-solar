<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아라호 관제센터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 하단 큰 탭 내비 + 한 화면 한 카드. 우주 관제센터 모니터 컨셉의 단일 다크 테마. */
:root{
  --bg:#0b1026; --bg2:#121a3d; --card:#1a2350; --card2:#222d63; --line:#35407e;
  --fg:#eef1ff; --muted:#aab3e0; --sun:#ffb340; --ice:#6ee7ff; --good:#4ade80; --bad:#ff8585; --warn:#ffd166;
  --disp:'Jua',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.7;margin:0;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 70% 15%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#ffffff44 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#ffffff33 50%,transparent 51%);}
#app{max-width:860px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.7rem} h3{font-size:1.3rem}
p{margin:.5em 0}
button{font-family:var(--body);font-size:1.05rem;border:0;border-radius:14px;cursor:pointer;min-height:52px;padding:10px 18px;color:var(--fg)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.btn-p{background:var(--sun);color:#2a1a00;font-weight:700;font-size:1.15rem}
.btn-s{background:var(--card2);border:1.5px solid var(--line)}
.btn-g{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
textarea,input[type=text]{width:100%;background:var(--bg2);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:1.1rem;font-family:var(--body);line-height:1.7}
textarea{min-height:130px;resize:vertical}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 20px;margin:14px 0}
.tag{display:inline-block;background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 12px;font-size:.85rem;letter-spacing:.06em}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px}
.hud .rk{font-family:var(--disp);font-size:1.15rem;color:var(--sun)}
.hud .pt{font-variant-numeric:tabular-nums;color:var(--ice)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--ice));border-radius:99px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:#0d1330ee;border-top:1.5px solid var(--line);backdrop-filter:blur(6px);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav#tabs button{background:transparent;min-height:60px;min-width:64px;flex:0 1 150px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.92rem;color:var(--muted);border-radius:14px;padding:6px 4px}
nav#tabs button .ic{font-size:1.5rem}
nav#tabs button.on{background:var(--card2);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chap{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:8px}
.chap .em{font-size:2rem}
.chap.doneAll{border-color:var(--good)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.deck-nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.deck-nav button{flex:1;font-size:1.15rem}
.learnbody{font-size:1.18rem}
.learnbody b{color:var(--sun)} .learnbody em{color:var(--ice);font-style:normal;font-weight:700}
.key{background:var(--bg2);border-left:5px solid var(--sun);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);margin:8px 0;font-size:1.1rem;padding:14px 16px}
.opt.ok{background:#15381f;border-color:var(--good)}
.opt.no{background:#3a1b1b;border-color:var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-size:1.05rem}
.fb.ok{background:#15381f;border:1.5px solid var(--good)}
.fb.no{background:#3a2314;border:1.5px solid var(--warn)}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{padding:4px 0}
.cklist .y::before{content:"✔ ";color:var(--good)} .cklist .n::before{content:"✦ ";color:var(--warn)}
.frame{background:var(--bg2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:1rem;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:1.05rem}
table.t th,table.t td{border:1px solid var(--line);padding:9px 10px;text-align:center}
table.t th{background:var(--bg2);color:var(--ice);font-weight:700}
table.t td:first-child{color:var(--sun);font-weight:700}
.twrap{overflow-x:auto;margin:10px 0}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.chain .nd{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:1rem}
.chain .ar{color:var(--sun);font-size:1.3rem}
.aurora{height:90px;border-radius:14px;margin:10px 0;background:linear-gradient(100deg,#0b1026 0%,#0e4d3a 25%,#2bd4a0 45%,#6ee7ff 60%,#7a5cff 80%,#0b1026 100%);opacity:.85;filter:blur(1px)}
.wanted{border:2px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(180deg,var(--card),var(--bg2));margin:12px 0}
.wanted.solved{border-color:var(--good)}
.stamp{font-family:var(--disp);color:var(--good);border:2.5px solid var(--good);border-radius:10px;display:inline-block;padding:2px 12px;transform:rotate(-6deg)}
.sec{border:1.5px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.sec>button{width:100%;text-align:left;background:var(--card2);border:0;border-radius:0;font-size:1.08rem;font-weight:700}
.sec>div{padding:12px 16px;background:var(--bg2)}
.small{font-size:.95rem;color:var(--muted)}
.codebox{background:#050816;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;word-break:break-all;max-height:140px;overflow:auto;user-select:all}
.badgerow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.badge{background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.95rem}
.badge.on{border-color:var(--sun);color:var(--sun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--sun);color:#2a1a00;font-weight:700;padding:12px 22px;border-radius:99px;box-shadow:0 6px 24px #0008;z-index:50;transition:opacity .3s}
svg text{font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){ .flare{animation:fl 3s ease-in-out infinite} @keyframes fl{0%,100%{opacity:.5}50%{opacity:1}} }
@media (max-width:460px){ body{font-size:16px} .card{padding:16px 14px} }
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs">
  <button data-v="home"><span class="ic">🛰️</span>관제센터</button>
  <button data-v="learn"><span class="ic">📚</span>미션 학습</button>
  <button data-v="wanted"><span class="ic">🔭</span>수배 파일</button>
  <button data-v="exam"><span class="ic">✍️</span>논술 시험</button>
  <button data-v="teacher"><span class="ic">📋</span>선생님</button>
</nav>

<script>
"use strict";
/* ───────── 상태 ───────── */
const LS="araho_v1", TEACHER_CODE="7001";
let S={name:"",cls:"",pts:0,seen:{},quiz:{},writes:{},wanted:{},exam:{},tdone:false};
try{const j=localStorage.getItem(LS); if(j)S={...S,...JSON.parse(j)};}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} drawHud();}
function addPts(n){S.pts+=n;save();toast("+"+n+"점!");}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400);},1300);}
const RANKS=[[0,"훈련생 🌱"],[30,"3등 관제사 🥉"],[70,"2등 관제사 🥈"],[120,"1등 관제사 🥇"],[170,"수석 관제사 ⭐"]];
function rank(){let r=RANKS[0][1],next=RANKS[1]||null;for(let i=0;i<RANKS.length;i++){if(S.pts>=RANKS[i][0]){r=RANKS[i][1];next=RANKS[i+1]||null;}}return{r,next};}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ───────── AI 코치 (Gemini API) ───────── */
const GKEY_LS="araho_gkey";
function getKey(){try{return localStorage.getItem(GKEY_LS)||"";}catch(e){return "";}}
function setKey(k){try{if(k)localStorage.setItem(GKEY_LS,k);else localStorage.removeItem(GKEY_LS);}catch(e){}}
/* 배포 링크(?k=... 또는 #k=...)로 열면 키를 기기에 저장하고 주소에서 지움 */
(function(){try{
  const q=new URLSearchParams(location.search); let k=q.get("k")||"";
  if(!k&&location.hash.startsWith("#k="))k=decodeURIComponent(location.hash.slice(3));
  if(k){setKey(k.trim()); history.replaceState(null,"",location.pathname);}
}catch(e){}})();
const coach=()=>!!getKey();
const GMODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-1.5-flash"];
async function geminiJSON(prompt){
  const key=getKey(); let lastErr=null;
  for(const m of GMODELS){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.4}})});
      if(res.status===404)continue;               // 이 모델이 없으면 다음 모델 시도
      if(!res.ok){lastErr=res.status;if(res.status===429){await new Promise(r=>setTimeout(r,1500));continue;}break;}
      const j=await res.json();
      const txt=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts.map(p=>p.text||"").join("");
      if(!txt)throw new Error("empty");
      return JSON.parse(txt.replace(/^```json\s*|```\s*$/g,""));
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error("fail");
}

/* ───────── 서술 점검 엔진 ───────── */
const LINKS=/(때문|따라서|그러므로|왜냐하면|그래서|이므로|으므로)/;
const COMPARE=/(반면|비해|보다|많고|적고|크고|작고|높고|낮고|달리)/;
function checkWrite(text,spec){
  const t=(text||"").trim(); const msgs=[]; let got=0,need=0;
  need++; if(t.length>=spec.min){got++;msgs.push({y:1,m:`길이 충분 (${t.length}자)`});}else msgs.push({y:0,m:`조금 더 길게! 최소 ${spec.min}자 (지금 ${t.length}자)`});
  (spec.groups||[]).forEach(g=>{need++;const hit=g.words.some(w=>t.includes(w));
    if(hit){got++;msgs.push({y:1,m:`핵심어 포함: ${g.name}`});}else msgs.push({y:0,m:`이 내용이 보이지 않아요 → ${g.name}`});});
  if(spec.compare){need++;if(COMPARE.test(t)){got++;msgs.push({y:1,m:"비교 표현 사용 (…보다, 반면 등)"});}else msgs.push({y:0,m:"두 대상을 '…보다/반면'처럼 직접 비교해 보세요"});}
  if(spec.link!==false){need++;if(LINKS.test(t)){got++;msgs.push({y:1,m:"이유·결론 연결어 사용 (때문에, 따라서 등)"});}else msgs.push({y:0,m:"'왜냐하면 ~ 때문이다', '따라서 ~'로 근거와 주장을 이어 보세요"});}
  return {pass:got>=need, got, need, msgs};
}
function fbHTML(r){return `<div class="fb ${r.pass?'ok':'no'}"><b>${r.pass?'✅ 통과! 논리가 잘 이어졌어요.':'🛰️ 관제센터 점검 결과 '+r.got+'/'+r.need}</b><ul class="cklist">${r.msgs.map(m=>`<li class="${m.y?'y':'n'}">${esc(m.m)}</li>`).join("")}</ul>${r.pass?'':'<div class="small">✦ 표시만 고쳐서 다시 점검해 보세요. 고칠수록 점수가 올라가는 게 진짜 공부!</div>'}</div>`;}

async function aiFeedback(key,prompt,textGetter,outEl){
  const t=textGetter(); if(!t.trim()){outEl.innerHTML='<div class="fb no">먼저 글을 써 주세요!</div>';return;}
  outEl.innerHTML='<div class="fb no">🤖 AI 코치가 읽는 중…</div>';
  try{
    const res=await geminiJSON(
      "너는 한국 중학교 1학년 과학 논술 코치다. 학생의 글을 아래 기준으로 평가해 JSON으로만 답하라.\n"+
      "채점 관점: "+prompt+"\n학생 글: \"\"\"\n"+t+"\n\"\"\"\n"+
      '출력 형식: {"level":"상|중|하","good":["잘한 점 1~2개"],"improve":["고칠 점 1~2개, 구체적으로"],"next":"학생이 바로 이어 쓸 수 있는 예시 문장 1개"} 친절하고 짧게, 존댓말로. 정답을 통째로 불러주지 말고 스스로 고치게 힌트를 줘라.');
    outEl.innerHTML=`<div class="fb ok"><b>🤖 AI 코치 (수준: ${esc(res.level||"-")})</b>
      <ul class="cklist">${(res.good||[]).map(g=>`<li class="y">${esc(g)}</li>`).join("")}${(res.improve||[]).map(g=>`<li class="n">${esc(g)}</li>`).join("")}</ul>
      ${res.next?`<div class="frame">✍️ 이렇게 이어 보면? “${esc(res.next)}”</div>`:""}</div>`;
  }catch(e){outEl.innerHTML='<div class="fb no">AI 코치 연결에 실패했어요(키 확인 또는 잠시 후 다시). 자동 점검으로도 충분히 연습할 수 있어요!</div>';}
}
function showAI(){document.querySelectorAll(".aibtn").forEach(b=>b.hidden=!coach());}

/* ───────── 학습 콘텐츠 ───────── */
const SUN_SVG=`<svg viewBox="0 0 360 230" style="max-width:100%;display:block;margin:8px auto">
<defs><radialGradient id="sg" cx="50%" cy="50%"><stop offset="0%" stop-color="#fff3c4"/><stop offset="55%" stop-color="#ffb340"/><stop offset="100%" stop-color="#ff7b1c"/></radialGradient></defs>
<circle cx="150" cy="120" r="92" fill="none" stroke="#ffd16655" stroke-width="16"/>
<circle cx="150" cy="120" r="78" fill="url(#sg)"/>
<ellipse cx="128" cy="100" rx="9" ry="6" fill="#5a2d00"/><ellipse cx="170" cy="140" rx="6" ry="4" fill="#5a2d00"/><ellipse cx="146" cy="150" rx="4" ry="3" fill="#5a2d00"/>
<path class="flare" d="M216 70 q30 -26 14 -52 q-4 26 -30 36 z" fill="#ffd166"/>
<path d="M60 160 q-20 18 2 34 q20 12 30 -6" fill="none" stroke="#ff8f4d" stroke-width="7" stroke-linecap="round"/>
<line x1="128" y1="100" x2="288" y2="40" stroke="#aab3e0" stroke-width="1"/><text x="238" y="34" fill="#eef1ff" font-size="15">흑점</text>
<line x1="222" y1="52" x2="288" y2="78" stroke="#aab3e0" stroke-width="1"/><text x="292" y="83" fill="#eef1ff" font-size="15">플레어</text>
<line x1="75" y1="185" x2="60" y2="212" stroke="#aab3e0" stroke-width="1"/><text x="40" y="227" fill="#eef1ff" font-size="15">홍염</text>
<line x1="150" y1="34" x2="200" y2="14" stroke="#aab3e0" stroke-width="1"/><text x="204" y="14" fill="#eef1ff" font-size="15">코로나(대기)</text>
<line x1="108" y1="62" x2="52" y2="40" stroke="#aab3e0" stroke-width="1"/><text x="12" y="34" fill="#eef1ff" font-size="15">광구(표면)</text>
</svg>`;
const ORBIT_SVG=`<svg viewBox="0 0 360 210" style="max-width:100%;display:block;margin:8px auto">
<circle cx="180" cy="105" r="16" fill="#ffb340"/><text x="180" y="86" fill="#ffd166" font-size="14" text-anchor="middle">태양</text>
<ellipse cx="180" cy="105" rx="46" ry="26" fill="none" stroke="#35407e"/><circle cx="226" cy="105" r="5" fill="#8ab4ff"/>
<ellipse cx="180" cy="105" rx="86" ry="48" fill="none" stroke="#35407e"/><circle cx="94" cy="105" r="6" fill="#6ee7ff"/><circle cx="104" cy="96" r="2.5" fill="#dfe6ff"/><text x="60" y="94" fill="#aab3e0" font-size="13">행성＋위성</text>
<g fill="#b7a27a">${Array.from({length:22},(_,i)=>{const a=i/22*6.283;return `<circle cx="${(180+118*Math.cos(a)).toFixed(0)}" cy="${(105+62*Math.sin(a)).toFixed(0)}" r="1.6"/>`;}).join("")}</g>
<text x="300" y="150" fill="#aab3e0" font-size="13">소행성대</text>
<path d="M330 40 q-60 10 -120 52" fill="none" stroke="#35407e" stroke-dasharray="4 4"/>
<circle cx="330" cy="40" r="5" fill="#bfe9ff"/><path d="M335 36 l26 -14 M335 42 l28 -4" stroke="#bfe9ff" stroke-width="2"/>
<text x="268" y="26" fill="#aab3e0" font-size="13">혜성(긴 궤도)</text>
</svg>`;
const CHAIN=`<div class="chain"><span class="nd">태양 활동 활발 ☀️</span><span class="ar">→</span><span class="nd">흑점 수 ↑ · 홍염/플레어 잦음</span><span class="ar">→</span><span class="nd">태양풍 강해짐 🌬️</span><span class="ar">→</span><span class="nd">지구 자기장 교란</span><span class="ar">→</span><span class="nd">오로라·통신 장애·GPS 오류·정전·위성 고장</span></div>`;

const CH=[
{id:"c1",em:"🪐",title:"1장. 태양계 가족을 찾아라",sub:"태양계 구성원",cards:[
 {t:"l",h:"미션 브리핑",b:`탐사선 <b>아라호</b>가 곧 발사됩니다. 관제사의 첫 임무는 <em>태양계에 누가 사는지</em> 정확히 아는 것!<div class="key">💡 <b>태양계</b> = 태양 + 태양의 영향 안에서 <b>태양을 중심으로 도는(공전하는) 모든 천체</b></div>${ORBIT_SVG}`},
 {t:"l",h:"태양 — 유일한 별",b:`태양은 태양계에서 <b>스스로 빛을 내는 유일한 천체</b>, 즉 <em>별(항성)</em>이에요. 행성과 달이 밝게 보이는 건 태양 빛을 <b>반사</b>하기 때문이죠.<div class="key">🌟 스스로 빛을 낸다 → 별 / 빛을 반사한다 → 행성·위성 등</div>`},
 {t:"l",h:"행성 8형제",b:`태양 주위를 공전하는 8개의 행성: <em>수성·금성·지구·화성·목성·토성·천왕성·해왕성</em><div class="key">🎵 외우기: "수·금·지·화·목·토·천·해" — 태양에서 가까운 순서!</div>`},
 {t:"l",h:"위성 — 행성의 단짝",b:`<b>위성</b>은 <em>행성 주위를 공전</em>하는 천체예요. 지구의 위성은 <b>달</b>! 목성형 행성들은 위성을 수십 개씩 거느려요.<div class="key">⚠️ 위성은 태양이 아니라 <b>행성</b> 주위를 돌지만, 그 행성이 태양을 돌기 때문에 <b>위성도 태양계 구성원</b>이에요.</div>`},
 {t:"l",h:"소행성 — 돌덩이 무리",b:`<b>소행성</b>은 크기가 작고 모양이 불규칙한 <em>암석 천체</em>로, 태양 주위를 공전해요. 주로 <b>화성과 목성 사이</b>의 '소행성대'에 모여 있어요.`},

 {t:"q",q:"혜성의 꼬리가 생기는 때와 방향으로 옳은 것은?",o:["태양에서 멀어질 때, 태양 쪽","태양에 가까워질 때, 태양 반대쪽","언제나 꼬리가 있고 방향은 제멋대로"],a:1,ex:"태양에 가까워지면 얼음이 승화해 꼬리가 생기고, 태양풍에 밀려 꼬리는 태양 반대쪽을 향해요."},
 {t:"q",q:"다음 중 태양계 구성원이 <b>아닌</b> 것은?",o:["달(위성)","소행성","태양계 밖의 다른 별"],a:2,ex:"위성·소행성·혜성도 모두 태양계 구성원! 태양계 밖의 별은 구성원이 아니에요."},
 {t:"w",key:"w_c1",h:"🛰️ 관제 일지 한 줄 논술",prompt:`우주 신문에 "행성이 아닌 혜성은 태양계 구성원이 아니다"라는 기사가 실렸어요. 이 기사가 <b>잘못된 까닭</b>을 한두 문장으로 써 보세요.`,frame:"혜성은 행성은 아니지만 ______을/를 공전하기 때문에 ______이다.",spec:{min:25,groups:[{name:"'공전'이라는 말",words:["공전","주위를 돌","주위를 도는","태양 주위"]},{name:"'태양계 구성원'이라는 판단",words:["구성원","태양계에 포함","태양계이다","태양계에 속"]}]},ai:"혜성이 행성이 아니어도 태양 주위를 공전하므로 태양계 구성원이라는 점을 근거-주장 구조로 썼는지 평가"}

{id:"c2",em:"⚖️",title:"2장. 쌍둥이가 아니야",sub:"지구형 행성 vs 목성형 행성",cards:[

 {t:"l",h:"자료로 판단하는 법",b:`논술형 평가의 핵심은 <em>표를 읽고 근거를 대는 것</em>!<div class="twrap"><table class="t"><tr><th>구분</th><th>지구형</th><th>목성형</th></tr><tr><td>크기·질량</td><td>작다</td><td>크다</td></tr><tr><td>평균 밀도</td><td>크다</td><td>작다</td></tr><tr><td>위성 수</td><td>없거나 적다</td><td>많다</td></tr><tr><td>고리</td><td>없다</td><td>있다</td></tr></table></div><div class="key">✍️ 서술 공식: "A는 ○○형 행성이다. A는 B<b>보다</b> ~하고 ~하기 <b>때문이다</b>." — 근거는 <b>두 가지 이상</b>!</div>`},

 {t:"w",key:"w_c2",h:"🛰️ 관제 일지 한 줄 논술",prompt:`아라호가 관측한 <b>천체 P</b>: 상대 지름 4.0, 평균 밀도 1.2 g/cm³, 위성 27개, 고리 있음.<br>P를 지구형/목성형으로 <b>분류</b>하고, 자료에서 <b>근거 두 가지 이상</b>을 들어 까닭을 쓰세요.`,frame:"P는 ___형 행성이다. 왜냐하면 지구형 행성보다 ___이/가 ___고, ___이/가 ___기 때문이다.",spec:{min:40,groups:[{name:"'목성형'이라는 분류",words:["목성형"]},{name:"밀도 근거",words:["밀도"]},{name:"위성 또는 고리 근거",words:["위성","고리"]}],compare:true},ai:"천체 P(밀도 작음, 위성 많음, 고리 있음)를 목성형으로 분류하고 자료의 특징 2가지 이상을 비교해 근거로 들었는지 평가"}

{id:"c3",em:"☀️",title:"3장. 태양의 얼굴",sub:"태양의 특징과 태양 활동",cards:[

 {t:"l",h:"대기의 폭발 쇼: 홍염과 플레어",b:`<ul><li><b>홍염</b>: 광구에서 솟아오르는 거대한 <em>불기둥</em></li><li><b>플레어</b>: 흑점 근처에서 일어나는 강력한 <em>폭발</em> — 엄청난 에너지와 물질을 내뿜어요</li></ul>`},

const WOPTS=["태양","지구형 행성","목성형 행성","위성","소행성","혜성"];

/* ───────── 논술형 평가 연습 (평행 문항) ───────── */
const EXAM=[

  q:`【자료 1】을 근거로 천체 <b>가</b>와 <b>나</b>를 각각 지구형 행성과 목성형 행성으로 분류하고, 두 천체의 특징을 <b>두 가지 이상 비교</b>하여 분류한 까닭을 서술하시오.`,
  spec:{min:60,groups:[{name:"가=지구형 / 나=목성형 분류",words:["지구형"]},{name:"목성형 언급",words:["목성형"]},{name:"비교 근거 ① 지름 또는 밀도",words:["지름","밀도","크기"]},{name:"비교 근거 ② 위성 또는 고리",words:["위성","고리"]}],compare:true},
  ai:"천체 가(지름 작음·밀도 큼·위성 없음·고리 없음)=지구형, 나(지름 큼·밀도 작음·위성 많음·고리 있음)=목성형으로 분류하고, 특징 2가지 이상을 비교하여 근거로 들었는지 — 중1 논술형 2점 문항 기준으로 평가"},
 {no:2,pts:2,title:"태양계 구성원 판단하기",
  q:`【자료 1】을 근거로 천체 <b>다, 라, 마</b>가 각각 어떤 종류의 천체인지 밝히고, "행성이 아닌 다·라·마는 태양계 구성원이 아니다"라는 과학신문 설명이 <b>잘못된 까닭</b>을 <b>공전 관계</b>와 관련지어 서술하시오.`,

  ai:"다(행성 주위 공전)=위성, 라(화성·목성 사이 암석)=소행성, 마(얼음·긴 궤도·꼬리)=혜성으로 판단하고, 행성이 아니어도 태양(또는 행성) 주위를 공전하므로 태양계 구성원이라는 근거로 신문의 오류를 설명했는지 — 중1 논술형 2점 문항 기준으로 평가"},
 {no:3,pts:6,title:"태양 활동과 지구의 변화 설명하기",
  q:`【자료 2】에서 흑점 수와 홍염·플레어의 발생을 비교하여 <b>A와 B 중 태양 활동이 더 활발했던 시기</b>를 판단하고, 태양 활동에 따른 <b>태양풍의 변화</b>와 지구에서 나타난 현상(오로라, GPS 오류)을 관련지어, 우주기상센터가 <b>'중요 설비 보호 조치와 예보 강화'를 하기로 한 결정이 타당한 까닭</b>을 하나의 완결된 글로 서술하시오.`,
  spec:{min:140,groups:[{name:"A 시기가 활발하다는 판단",words:["A"]},{name:"근거 ① 흑점 수",words:["흑점"]},{name:"근거 ② 홍염·플레어",words:["플레어","홍염"]},{name:"태양풍 변화",words:["태양풍"]},{name:"지구에서 나타난 현상(오로라/GPS)",words:["오로라","GPS","지피에스"]},{name:"결정이 타당하다는 결론",words:["타당","필요하","적절"]}]},
  ai:"① A 시기가 활발함을 흑점 수·플레어 두 근거로 판단 ② 활발→태양풍 강해짐→지구 자기장 교란→오로라가 낮은 위도까지·GPS 오류라는 인과 연결 ③ 따라서 설비 보호와 예보 강화 결정이 타당함 — 세 요소가 하나의 완결된 글로 이어졌는지, 중1 논술형 6점 문항 채점 기준(판단 3점+인과·타당성 3점)으로 평가"}];

/* ───────── 그리기 ───────── */
const app=document.getElementById("app");
let view="home", deck=null;

function drawHud(){const h=document.getElementById("hud");if(!h)return;const{r,next}=rank();
 const pct=next?Math.min(100,Math.round(S.pts/next[0]*100)):100;
 h.innerHTML=`<span class="rk">${esc(S.name||"이름 미입력")} · ${r}</span><span class="pt">⭐ ${S.pts}점</span><span class="bar"><i style="width:${pct}%"></i></span><span class="small">${next?`다음 등급까지 ${next[0]-S.pts}점`:"최고 등급!"}</span>`;}

function chapProg(c){const total=c.cards.length;let d=0;c.cards.forEach((cd,i)=>{const k=c.id+"_"+i;
 if(cd.t==="l"&&S.seen[k])d++; if(cd.t==="q"&&S.quiz[k])d++; if(cd.t==="w"&&S.writes[cd.key]&&S.writes[cd.key].ok)d++;});return{d,total};}

function render(){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const r=(()=>{ if(view==="home")return renderHome();
 if(view==="learn")return deck?renderDeck():renderLearn();
 if(view==="wanted")return renderWanted();
 if(view==="exam")return renderExam();
 if(view==="teacher")return renderTeacher(); })();
 showAI(); return r;
}
function hudBlock(){return `<div id="hud" class="hud"></div>`;}

function renderHome(){
 app.innerHTML=`${hudBlock()}
 <div class="card" style="text-align:center">
  <div style="font-size:3rem">🚀</div>
  <h2>아라호 관제센터</h2>
  <p class="learnbody">2049년, 대한민국 우주 관제센터.<br>탐사선 <b>아라호</b>가 태양계 탐사를 떠난다.<br>너의 임무: 미션을 완수하며 <em>수석 관제사</em>가 되는 것!</p>
  <div class="frame">📚 미션 학습으로 지식 쌓기 → 🔭 수배 파일로 추리하기 → ✍️ 관제사 자격 논술 시험 통과!</div>
 </div>
 <div class="card">
  <h3>관제사 등록</h3>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
   <input type="text" id="inCls" placeholder="반·번호 (예: 3반 12번)" value="${esc(S.cls)}" style="flex:1;min-width:140px">

  </div>
  <button class="btn-p" id="btnReg" style="margin-top:12px;width:100%">등록 / 수정</button>
 </div>
 <div class="card">

  <div class="badgerow">${CH.map(c=>{const p=chapProg(c);return `<span class="badge ${p.d>=p.total?'on':''}">${c.em} ${c.title.split(".")[0]}장 ${p.d}/${p.total}</span>`;}).join("")}
  <span class="badge ${Object.keys(S.wanted).length>=WANTED.length?'on':''}">🔭 수배 ${Object.keys(S.wanted).length}/${WANTED.length}</span>
  <span class="badge ${[1,2,3].every(n=>S.exam[n])?'on':''}">✍️ 시험 ${[1,2,3].filter(n=>S.exam[n]).length}/3</span></div>
 </div>
 <div class="card">
  <h3>📨 선생님께 기록 제출</h3>
  <p class="small">아래 코드를 복사해 선생님께 보내면(메신저·학급 게시판 등) 선생님 화면에서 내 학습 기록을 볼 수 있어요.</p>
  <button class="btn-s" id="btnCode" style="width:100%">제출 코드 만들기</button>
  <div id="codeOut"></div>
 </div>`;
 drawHud();
 document.getElementById("btnReg").onclick=()=>{S.name=document.getElementById("inName").value.trim();S.cls=document.getElementById("inCls").value.trim();save();toast("등록 완료! 🫡");};
 document.getElementById("btnCode").onclick=()=>{
   const rep={n:S.name,c:S.cls,p:S.pts,r:rank().r,ch:CH.map(c=>{const p=chapProg(c);return p.d+"/"+p.total;}),wd:Object.keys(S.wanted).length,
     w:Object.entries(S.writes).map(([k,v])=>({k,ok:v.ok?1:0,t:(v.t||"").slice(0,400)})),
     e:Object.fromEntries(Object.entries(S.exam).map(([n,v])=>[n,{t:(v.t||"").slice(0,700),g:v.g||""}])),ts:new Date().toISOString().slice(0,16)};
   let code; try{code="ARAHO."+btoa(unescape(encodeURIComponent(JSON.stringify(rep))));}catch(e){code="";}

function renderLearn(){
 app.innerHTML=`${hudBlock()}<h2 style="margin:16px 4px 6px">📚 미션 학습</h2>
 <p class="small" style="margin:0 4px 10px">한 장은 5~10분! 카드를 넘기며 읽고, 퀴즈를 풀고, 마지막에 '한 줄 논술'로 마무리해요.</p>
 <div class="grid">${CH.map((c,i)=>{const p=chapProg(c);return `<button class="chap ${p.d>=p.total?'doneAll':''}" data-ch="${i}">
   <span class="em">${c.em}</span><h3>${c.title}</h3><span class="small">${c.sub}</span>
   <span class="dots">${c.cards.map((_,j)=>{const cd=c.cards[j],k=c.id+"_"+j;const on=(cd.t==="l"&&S.seen[k])||(cd.t==="q"&&S.quiz[k])||(cd.t==="w"&&S.writes[cd.key]&&S.writes[cd.key].ok);return `<i class="${on?'on':''}"></i>`;}).join("")}</span>
   ${p.d>=p.total?'<span class="stamp">MISSION CLEAR</span>':''}</button>`;}).join("")}</div>`;
 drawHud();
 document.querySelectorAll(".chap").forEach(b=>b.onclick=()=>{deck={ch:+b.dataset.ch,i:0};render();});
}

function renderDeck(){
 const c=CH[deck.ch], i=deck.i, cd=c.cards[i], k=c.id+"_"+i;
 let body="";
 if(cd.t==="l"){ if(!S.seen[k]){S.seen[k]=1;S.pts+=1;save();}
   body=`<span class="tag">카드 ${i+1}/${c.cards.length} · 읽기</span><h3 style="margin:10px 0">${cd.h}</h3><div class="learnbody">${cd.b}</div>`;}
 if(cd.t==="q"){
   body=`<span class="tag">카드 ${i+1}/${c.cards.length} · 퀴즈</span><h3 style="margin:10px 0">❓ ${cd.q}</h3>
   <div id="opts">${cd.o.map((o,j)=>`<button class="opt" data-j="${j}">${j+1}. ${o}</button>`).join("")}</div><div id="qfb">${S.quiz[k]?`<div class="fb ok"><b>✅ 해결한 퀴즈!</b> ${esc(cd.ex)}</div>`:""}</div>`;}
 if(cd.t==="w"){const w=S.writes[cd.key]||{};
   body=`<span class="tag">카드 ${i+1}/${c.cards.length} · 한 줄 논술</span><h3 style="margin:10px 0">${cd.h}</h3>
   <p class="learnbody">${cd.prompt}</p><div class="frame">💬 문장 틀: ${esc(cd.frame)}</div>
   <textarea id="wt">${esc(w.t||"")}</textarea>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
     <button class="btn-p" id="wchk" style="flex:1">관제센터 점검받기</button>
     <button class="btn-s aibtn" id="wai" style="flex:1" hidden>🤖 AI 코치 피드백</button>
   </div><div id="wout">${w.ok?'<div class="fb ok"><b>✅ 통과한 논술이에요. 더 다듬어 다시 점검해도 좋아요!</b></div>':""}</div>`;}
 app.innerHTML=`${hudBlock()}
 <div style="display:flex;align-items:center;gap:10px;margin:14px 2px 0"><button class="btn-g" id="back" style="min-height:44px">← 목록</button><h2 style="font-size:1.3rem">${c.em} ${c.title}</h2></div>
 <div class="card">${body}</div>
 <div class="deck-nav">
   <button class="btn-s" id="prev" ${i===0?"disabled":""}>◀ 이전</button>
   <button class="btn-p" id="next">${i===c.cards.length-1?"장 마치기 🏁":"다음 ▶"}</button>
 </div>`;
 drawHud();
 document.getElementById("back").onclick=()=>{deck=null;render();};
 document.getElementById("prev").onclick=()=>{deck.i--;render();};
 document.getElementById("next").onclick=()=>{if(i===c.cards.length-1){deck=null;toast(c.em+" 미션 진행 저장!");render();}else{deck.i++;render();}};
 if(cd.t==="q"){document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j;
   if(j===cd.a){b.classList.add("ok");document.getElementById("qfb").innerHTML=`<div class="fb ok"><b>🎯 정답!</b> ${esc(cd.ex)}</div>`;
     if(!S.quiz[k]){S.quiz[k]=1;addPts(2);}else save();}
   else{b.classList.add("no");document.getElementById("qfb").innerHTML=`<div class="fb no"><b>🛰️ 다시 생각!</b> 힌트: ${esc(cd.ex)}</div>`;}});}
 if(cd.t==="w"){
   const out=document.getElementById("wout");
   document.getElementById("wchk").onclick=()=>{
     const t=document.getElementById("wt").value; const r=checkWrite(t,cd.spec);
     out.innerHTML=fbHTML(r);
     const first=!(S.writes[cd.key]&&S.writes[cd.key].ok);
     S.writes[cd.key]={t,ok:r.pass||((S.writes[cd.key]||{}).ok),ts:Date.now()};
     if(r.pass&&first)addPts(5); else save();};
   document.getElementById("wai").onclick=()=>aiFeedback(cd.key,cd.ai,()=>document.getElementById("wt").value,out);
 }
}

  </div>`;}).join("")}`;

     document.getElementById("ms_"+w.id).onclick=()=>{S.wanted[w.id]={memo:document.getElementById("memo_"+w.id).value.trim()};addPts(4);render();};}
   else{b.classList.add("no");fb.innerHTML=`<div class="fb no">🛰️ 단서를 다시 읽어봐! <b>무엇의 주위를 도는지</b>, <b>무엇으로 이루어졌는지</b>가 핵심.</div>`;}
 });
}

function renderExam(){
 const sec=(t,b,open)=>`<div class="sec"><button data-sec>${open?"▼":"▶"} ${t}</button><div ${open?"":"hidden"}>${b}</div></div>`;
 app.innerHTML=`${hudBlock()}<h2 style="margin:16px 4px 6px">✍️ 관제사 자격 논술 시험 (연습)</h2>
 <p class="small" style="margin:0 4px 10px">실제 평가와 같은 방식, 다른 자료! 총 10점 · 자료를 근거로 완전한 문장으로 서술하세요.</p>
 ${sec("【제시문】 탐사선 아라호의 새 임무",`<p class="learnbody">국제 공동 탐사선 <b>아라호</b>는 지구를 출발해 천체 <b>다</b>의 근처를 지난 뒤 천체 <b>가</b>와 <b>나</b>를 관측할 예정이다. 이후 화성과 목성 사이에서 태양 주위를 도는 천체 <b>라</b>를 근접 촬영하고, 긴 궤도를 따라 돌다가 태양에 가까워지면 꼬리가 나타나는 천체 <b>마</b>를 관측한다.</p><p class="learnbody">탐사 소식을 전한 과학신문에는 이렇게 실렸다. <em>“태양계는 태양과 8개의 행성으로 이루어져 있다. 따라서 행성이 아닌 다, 라, 마는 태양계 구성원이 아니다.”</em></p>`,true)}
 ${sec("【자료 1】 천체 관측 결과",`<div class="twrap"><table class="t"><tr><th>구분</th><th>천체 가</th><th>천체 나</th></tr><tr><td>상대 지름</td><td>0.9</td><td>11.2</td></tr><tr><td>평균 밀도(g/cm³)</td><td>5.2</td><td>1.3</td></tr><tr><td>위성</td><td>없다</td><td>많다</td></tr><tr><td>고리</td><td>없다</td><td>있다</td></tr></table></div><p class="small">※ 상대 지름은 지구의 지름을 1.0으로 한 값</p>
 <div class="twrap"><table class="t"><tr><th>천체</th><th>관측 결과</th></tr><tr><td>다</td><td style="text-align:left">어느 행성 주위를 공전한다.</td></tr><tr><td>라</td><td style="text-align:left">태양 주위를 공전하며 화성과 목성 사이에서 주로 관측된다. 작고 불규칙한 암석 천체이다.</td></tr><tr><td>마</td><td style="text-align:left">얼음과 먼지로 이루어져 있고 긴 궤도로 태양 주위를 공전한다. 태양에 가까워지면 꼬리가 나타난다.</td></tr></table></div>`,true)}
 ${sec("【자료 2】 우주기상센터의 관측 기록",`<div class="twrap"><table class="t"><tr><th>항목</th><th>A 시기</th><th>B 시기</th></tr><tr><td>태양의 흑점 수</td><td>많음</td><td>적음</td></tr><tr><td>홍염과 플레어</td><td>자주 발생</td><td>드물게 발생</td></tr><tr><td>태양풍</td><td>강함</td><td>비교적 약함</td></tr><tr><td>오로라</td><td>평소보다 낮은 위도에서도 관측</td><td>극지방에서 드물게 관측</td></tr><tr><td>GPS 수신 오류 신고</td><td>크게 증가</td><td>거의 없음</td></tr></table></div><p class="learnbody">우주기상센터는 기록을 검토한 뒤, 태양 활동을 지속적으로 관측하면서 <b>인공위성·송전 설비 등 중요 설비 보호 조치</b>를 하고 <b>우주기상 예보를 강화</b>하기로 하였다.</p>`,true)}
 ${EXAM.map(e=>{const sv=S.exam[e.no]||{};return `<div class="card"><span class="tag">문항 ${e.no} · ${e.pts}점</span><h3 style="margin:8px 0">${e.no}. ${e.title}</h3>
  <p class="learnbody">${e.q}</p>
  <textarea id="et${e.no}" style="min-height:${e.no===3?220:150}px" placeholder="자료의 숫자·내용을 근거로, '왜냐하면/따라서'로 이어지는 완전한 문장으로 써 보세요.">${esc(sv.t||"")}</textarea>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
   <button class="btn-p echk" data-no="${e.no}" style="flex:1">자동 점검</button>
   <button class="btn-s aibtn eai" data-no="${e.no}" style="flex:1" hidden>🤖 AI 코치 피드백</button>
   <button class="btn-s esub" data-no="${e.no}" style="flex:1">제출 저장 ${sv.t?"(재제출)":""}</button>
  </div><div id="eout${e.no}">${sv.t?'<div class="fb ok"><b>📨 제출 저장됨</b> — 홈에서 제출 코드를 만들어 선생님께 보내세요.</div>':""}</div></div>`;}).join("")}
 <div class="card"><h3>🧭 좋은 논술의 3단 공식</h3><div class="chain"><span class="nd">① 판단/분류 (주장)</span><span class="ar">→</span><span class="nd">② 자료 속 근거 (왜냐하면~)</span><span class="ar">→</span><span class="nd">③ 연결·결론 (따라서~)</span></div></div>`;
 drawHud();
 document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{const d=b.nextElementSibling;d.hidden=!d.hidden;b.textContent=(d.hidden?"▶":"▼")+b.textContent.slice(1);});
 showAI();
 document.querySelectorAll(".echk").forEach(b=>b.onclick=()=>{const e=EXAM.find(x=>x.no==b.dataset.no);
   const r=checkWrite(document.getElementById("et"+e.no).value,e.spec);
   document.getElementById("eout"+e.no).innerHTML=fbHTML(r);});
 document.querySelectorAll(".eai").forEach(b=>b.onclick=()=>{const e=EXAM.find(x=>x.no==b.dataset.no);
   aiFeedback("e"+e.no,e.ai,()=>document.getElementById("et"+e.no).value,document.getElementById("eout"+e.no));});
 document.querySelectorAll(".esub").forEach(b=>b.onclick=()=>{const no=+b.dataset.no;const t=document.getElementById("et"+no).value;
   if(!t.trim())return toast("먼저 답을 써 주세요!");
   const first=!S.exam[no]; const r=checkWrite(t,EXAM.find(x=>x.no===no).spec);
   S.exam[no]={t,g:r.got+"/"+r.need,ts:Date.now()}; if(first)addPts(8);else save();
   document.getElementById("eout"+no).innerHTML='<div class="fb ok"><b>📨 제출 저장 완료!</b> 홈 화면 → "제출 코드 만들기"로 선생님께 보내면 끝.</div>';});
}

/* ───────── 선생님 ───────── */
function renderTeacher(){
 if(!S.tdone){
  app.innerHTML=`${hudBlock()}<div class="card" style="max-width:480px;margin:40px auto"><h3>📋 선생님 전용</h3>
  <p class="small">교사용 코드를 입력하세요. (학생 출입 금지 구역 🚧)</p>
  <input type="text" id="tc" inputmode="numeric" placeholder="교사 코드"><button class="btn-p" id="tgo" style="width:100%;margin-top:10px">입장</button><div id="terr"></div></div>`;
  drawHud();
  document.getElementById("tgo").onclick=()=>{if(document.getElementById("tc").value.trim()===TEACHER_CODE){S.tdone=true;save();render();}else document.getElementById("terr").innerHTML='<div class="fb no">코드가 달라요.</div>';};
  return;
 }
 app.innerHTML=`${hudBlock()}<h2 style="margin:16px 4px 6px">📋 학급 학습 기록</h2>
 <div class="card"><h3>🤖 AI 코치 설정 (Gemini API)</h3>
 <p class="small">Google AI Studio(aistudio.google.com)에서 발급한 API 키를 넣으면 이 기기에서 AI 피드백 버튼이 켜져요. 키는 <b>이 기기에만</b> 저장됩니다.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="gk" placeholder="AIza... 로 시작하는 키" value="${esc(getKey())}" style="flex:1;min-width:200px"><button class="btn-p" id="gksave" style="min-width:110px">저장</button></div>
 <div id="gkst" class="small" style="margin-top:6px">${coach()?"✅ 키 저장됨 — AI 코치 켜짐":"키 없음 — 자동 점검만 작동"}</div>
 <p class="small" style="margin-top:10px">학생 태블릿에도 켜려면 아래 <b>배포용 링크</b>를 QR로 만들어 나눠주세요. 링크를 연 기기에 키가 자동 저장되고 주소창에서는 지워집니다. ⚠️ 링크를 받은 사람은 선생님의 무료 할당량을 쓸 수 있으니 학급 안에서만 공유하세요.</p>
 <button class="btn-s" id="gklink" style="width:100%">학생 배포용 링크 만들기·복사</button><div id="gkout"></div></div>
 <div class="card"><h3>① 학생 제출 코드 붙여넣기</h3>
 <p class="small">학생들이 홈 화면에서 만든 <b>ARAHO.</b> 코드를 한 줄에 하나씩 붙여넣고 [기록 불러오기]를 누르세요. (쿨메신저·패들렛·구글 설문 등으로 수합하면 편해요.) 이 기기에만 표시되며 어디에도 전송되지 않습니다.</p>
 <textarea id="codes" style="min-height:120px" placeholder="ARAHO.eyJ...&#10;ARAHO.eyJ..."></textarea>
 <button class="btn-p" id="parse" style="width:100%;margin-top:10px">기록 불러오기</button></div>
 <div id="roster"></div>
 <div class="card"><h3>② 이 기기의 학생 기록 바로 보기</h3><p class="small">순회하며 학생 태블릿에서 이 탭을 열면 그 학생의 기록을 바로 확인할 수 있어요.</p>
 <button class="btn-s" id="mine" style="width:100%">이 기기 기록 열기</button><div id="mineOut"></div>
 <button class="btn-g" id="tlock" style="width:100%;margin-top:10px">선생님 모드 잠그기</button></div>`;
 drawHud();
 document.getElementById("gksave").onclick=()=>{setKey(document.getElementById("gk").value.trim());document.getElementById("gkst").textContent=coach()?"✅ 키 저장됨 — AI 코치 켜짐":"키 없음 — 자동 점검만 작동";showAI();toast(coach()?"AI 코치 켜짐 🤖":"키 삭제됨");};
 document.getElementById("gklink").onclick=()=>{const k=getKey();if(!k)return toast("먼저 키를 저장하세요");
   const url=location.origin+location.pathname+"?k="+encodeURIComponent(k);
   document.getElementById("gkout").innerHTML=`<div class="codebox">${esc(url)}</div>`;
   navigator.clipboard.writeText(url).then(()=>toast("링크 복사됨 — QR로 만들어 배포!")).catch(()=>toast("길게 눌러 복사하세요"));};
 const studentHTML=(d)=>`<div class="card"><h3>👩‍🚀 ${esc(d.n||"이름없음")} <span class="small">(${esc(d.c||"-")})</span></h3>
   <p>⭐ ${d.p}점 · ${esc(d.r||"")} · 제출 시각 ${esc(d.ts||"-")}</p>
   <p class="small">학습 진도: ${ (d.ch||[]).map((x,i)=>`${i+1}장 ${x}`).join(" · ") } · 수배 해결 ${d.wd??0}/${WANTED.length}</p>
   ${(d.w||[]).length?`<div class="sec"><button data-sec>▶ 한 줄 논술 ${(d.w||[]).length}건</button><div hidden>${d.w.map(w=>`<p><b>${esc(w.k)}</b> ${w.ok?'<span style="color:var(--good)">통과</span>':'<span style="color:var(--warn)">연습 중</span>'}<br>${esc(w.t)}</p>`).join("<hr style='border-color:var(--line)'>")}</div></div>`:'<p class="small">한 줄 논술 기록 없음</p>'}
   ${d.e&&Object.keys(d.e).length?`<div class="sec"><button data-sec>▶ 논술 시험 답안 ${Object.keys(d.e).length}문항</button><div hidden>${Object.entries(d.e).map(([n,v])=>`<p><b>문항 ${n}</b> <span class="small">(자동점검 ${esc(v.g||"-")})</span><br>${esc(v.t)}</p>`).join("<hr style='border-color:var(--line)'>")}</div></div>`:'<p class="small">시험 답안 없음</p>'}</div>`;
 const bindSec=(root)=>root.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{const dd=b.nextElementSibling;dd.hidden=!dd.hidden;b.textContent=(dd.hidden?"▶":"▼")+b.textContent.slice(1);});
 document.getElementById("parse").onclick=()=>{
   const lines=document.getElementById("codes").value.split(/\s+/).filter(x=>x.startsWith("ARAHO."));
   const rows=[];lines.forEach(l=>{try{rows.push(JSON.parse(decodeURIComponent(escape(atob(l.slice(6))))));}catch(e){}});
   const R=document.getElementById("roster");
   if(!rows.length){R.innerHTML='<div class="fb no">읽을 수 있는 코드가 없어요. ARAHO. 로 시작하는 코드 전체를 붙여넣었는지 확인하세요.</div>';return;}
   rows.sort((a,b)=>(a.c||"").localeCompare(b.c||"","ko"));
   R.innerHTML=`<div class="fb ok"><b>${rows.length}명의 기록을 불러왔어요.</b></div>`+rows.map(studentHTML).join("");
   bindSec(R);};
 document.getElementById("mine").onclick=()=>{
   const d={n:S.name,c:S.cls,p:S.pts,r:rank().r,ch:CH.map(c=>{const p=chapProg(c);return p.d+"/"+p.total;}),wd:Object.keys(S.wanted).length,
     w:Object.entries(S.writes).map(([k,v])=>({k,ok:v.ok?1:0,t:v.t||""})),e:S.exam,ts:"지금"};
   const M=document.getElementById("mineOut");M.innerHTML=studentHTML(d);bindSec(M);};
 document.getElementById("tlock").onclick=()=>{S.tdone=false;save();render();};
}

/* ───────── 내비 ───────── */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;deck=null;render();});
const h0=(location.hash||"").replace("#","");
if(["home","learn","wanted","exam","teacher"].includes(h0))view=h0;
render();
</script>
</body>
</html>
